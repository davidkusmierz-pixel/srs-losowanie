<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SRS LOBBY COMBO</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: white;

      background:
        linear-gradient(
          rgba(5, 6, 12, 0.75),
          rgba(5, 6, 12, 0.94)
        ),
        url("background.png.png");

      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    .container {
      width: min(950px, 94%);
      margin: auto;
      padding: 20px 0 60px;
    }

    h1 {
      text-align: center;
      font-size: clamp(32px, 7vw, 55px);
      margin: 15px 0 25px;
      text-shadow: 0 4px 25px black;
    }

    .card {
      background: rgba(10, 11, 20, 0.94);
      border: 1px solid rgba(220, 0, 0, 0.55);
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 20px;

      box-shadow:
        0 10px 35px rgba(0,0,0,0.6),
        0 0 30px rgba(180,0,0,0.08);
    }

    .hidden {
      display: none !important;
    }

    button,
    input,
    select {
      font-family: inherit;
    }

    button {
      border: none;
      border-radius: 11px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .admin-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    #adminPin {
      width: 220px;
      height: 58px;
      border-radius: 11px;
      border: 1px solid #555;
      background: #15151d;
      color: white;
      text-align: center;
      font-size: 17px;
      padding: 0 15px;
    }

    #newRoundBtn {
      min-width: 260px;
      height: 58px;
      font-size: 17px;
      background: linear-gradient(
        135deg,
        #e30000,
        #850000
      );
    }

    #adminInfo {
      margin-top: 12px;
      text-align: center;
      min-height: 20px;
      color: #aaa;
    }

    .admin-schedule {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #333;
    }

    .schedule-title {
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .schedule-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .schedule-field label {
      display: block;
      margin-bottom: 8px;
      color: #ddd;
      font-weight: bold;
    }

    .schedule-field input {
      width: 100%;
      height: 52px;
      border-radius: 10px;
      border: 1px solid #555;
      background: #15151d;
      color: white;
      padding: 0 15px;
      font-size: 16px;
    }

    #setScheduleBtn {
      width: 100%;
      height: 55px;
      margin-top: 15px;
      font-size: 17px;
      background: linear-gradient(
        135deg,
        #b00000,
        #650000
      );
    }

    #newWeekBtn {
      width: 100%;
      height: 50px;
      margin-top: 10px;
      background: #24242e;
    }

    .status-card {
      text-align: center;
    }

    #phaseStatus {
      font-size: clamp(24px, 5vw, 31px);
      font-weight: bold;
      margin-bottom: 15px;
    }

    #countdown {
      font-size: clamp(55px, 12vw, 82px);
      font-weight: bold;
      color: #ffe000;
      line-height: 1;
      text-shadow: 0 0 25px rgba(255,220,0,0.35);
    }

    #phaseInfo {
      margin-top: 15px;
      color: #ccc;
    }

    .section-title {
      text-align: center;
      font-size: clamp(21px, 4vw, 27px);
      font-weight: bold;
      margin-bottom: 20px;
    }

    .label {
      display: block;
      margin: 18px 0 8px;
      font-weight: bold;
      color: #ddd;
    }

    select,
    input[type="number"] {
      width: 100%;
      min-height: 52px;
      border-radius: 10px;
      border: 1px solid #555;
      background: #15151d;
      color: white;
      padding: 0 15px;
      font-size: 16px;
    }

    input[type="date"],
    input[type="time"] {
      color-scheme: dark;
    }

    .classes {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }

    .class-btn {
      min-height: 70px;
      background: #15151d;
      border: 2px solid #444;
      font-size: 17px;
    }

    .class-btn.selected {
      border-color: #ff2020;
      background: linear-gradient(
        135deg,
        #5e0000,
        #210000
      );
    }

    #saveComboBtn {
      width: 100%;
      min-height: 58px;
      margin-top: 25px;
      font-size: 18px;
      background: linear-gradient(
        135deg,
        #e30000,
        #850000
      );
    }

    #comboInfo {
      margin-top: 15px;
      text-align: center;
      min-height: 22px;
    }

    .participant-count {
      text-align: center;
      font-size: 20px;
      margin-bottom: 15px;
      color: #ffe000;
    }

    .my-combo {
      margin-top: 15px;
      text-align: center;
      line-height: 1.8;
    }

    .result {
      text-align: center;
      line-height: 1.8;
    }

    .result-title {
      color: #ffe000;
      font-size: 20px;
      margin-top: 12px;
    }

    .result-value {
      font-size: clamp(23px, 5vw, 34px);
      font-weight: bold;
      color: #ff6666;
    }

    .pool-info {
      text-align: center;
      color: #ffe000;
      font-weight: bold;
      font-size: 20px;
      margin-bottom: 10px;
    }

    @media (max-width: 850px) {
      .classes {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    @media (max-width: 650px) {
      .classes {
        grid-template-columns: repeat(2, 1fr);
      }

      .schedule-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 500px) {
      .admin-row {
        flex-direction: column;
      }

      #adminPin,
      #newRoundBtn {
        width: 100%;
      }
    }
  </style>
</head>

<script type="module">

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
  getDatabase,
  ref,
  set,
  get,
  onValue,
  remove
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


/* ================================================== */
/* FIREBASE */
/* ================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyDRDAiSlJBPOG8N_c4ctBRLYrwx3ER5rKw",

  authDomain:
    "srs-losowanie.firebaseapp.com",

  databaseURL:
    "https://srs-losowanie-default-rtdb.firebaseio.com",

  projectId:
    "srs-losowanie",

  storageBucket:
    "srs-losowanie.firebasestorage.app",

  messagingSenderId:
    "212959687651",

  appId:
    "1:212959687651:web:0a9a5e647450767bc026d6"

};


const app =
  initializeApp(
    firebaseConfig
  );

const database =
  getDatabase(app);


/* ================================================== */
/* USTAWIENIA */
/* ================================================== */

const ADMIN_PIN =
  "840416";


/* ================================================== */
/* ELEMENTY */
/* ================================================== */

const adminPin =
  document.getElementById(
    "adminPin"
  );

const newRoundBtn =
  document.getElementById(
    "newRoundBtn"
  );

const adminInfo =
  document.getElementById(
    "adminInfo"
  );

const drawDate =
  document.getElementById(
    "drawDate"
  );

const drawTime =
  document.getElementById(
    "drawTime"
  );

const setScheduleBtn =
  document.getElementById(
    "setScheduleBtn"
  );

const newWeekBtn =
  document.getElementById(
    "newWeekBtn"
  );

const phaseStatus =
  document.getElementById(
    "phaseStatus"
  );

const countdown =
  document.getElementById(
    "countdown"
  );

const phaseInfo =
  document.getElementById(
    "phaseInfo"
  );

const comboSection =
  document.getElementById(
    "comboSection"
  );

const trackSelect =
  document.getElementById(
    "trackSelect"
  );

const classButtons =
  document.querySelectorAll(
    ".class-btn"
  );

const lapsInput =
  document.getElementById(
    "lapsInput"
  );

const weatherSelect =
  document.getElementById(
    "weatherSelect"
  );

const timeOfDaySelect =
  document.getElementById(
    "timeOfDaySelect"
  );

const tireSelect =
  document.getElementById(
    "tireSelect"
  );

const pitSelect =
  document.getElementById(
    "pitSelect"
  );

const fuelSelect =
  document.getElementById(
    "fuelSelect"
  );

const tireWearSelect =
  document.getElementById(
    "tireWearSelect"
  );

const startTypeSelect =
  document.getElementById(
    "startTypeSelect"
  );

const qualifyingSelect =
  document.getElementById(
    "qualifyingSelect"
  );

const bopSelect =
  document.getElementById(
    "bopSelect"
  );

const saveComboBtn =
  document.getElementById(
    "saveComboBtn"
  );

const comboInfo =
  document.getElementById(
    "comboInfo"
  );

const myCombo =
  document.getElementById(
    "myCombo"
  );

const participantCount =
  document.getElementById(
    "participantCount"
  );

const officialResult =
  document.getElementById(
    "officialResult"
  );


/* ================================================== */
/* REFERENCJE FIREBASE */
/* ================================================== */

const roundRef =
  ref(
    database,
    "srsLobbyRound"
  );


const combosRef =
  ref(
    database,
    "srsLobbyCombos"
  );


/* ================================================== */
/* ZMIENNE */
/* ================================================== */

let currentRound =
  null;

let currentCombos =
  {};

let selectedClasses =
  [];

let finishingRound =
  false;


/* ================================================== */
/* IDENTYFIKATOR UŻYTKOWNIKA */
/* ================================================== */

let playerId =
  localStorage.getItem(
    "srsLobbyPlayerId"
  );


if (!playerId) {

  playerId =
    "player_" +
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .substring(2, 10);


  localStorage.setItem(
    "srsLobbyPlayerId",
    playerId
  );

}


/* ================================================== */
/* RESET FORMULARZA */
/* ================================================== */

function resetComboForm() {

  trackSelect.value =
    "";

  selectedClasses =
    [];

  classButtons.forEach(
    button => {

      button.classList.remove(
        "selected"
      );

    }
  );

  lapsInput.value =
    "";

  weatherSelect.value =
    "";

  timeOfDaySelect.value =
    "";

  tireSelect.value =
    "";

  pitSelect.value =
    "";

  fuelSelect.value =
    "";

  tireWearSelect.value =
    "";

  startTypeSelect.value =
    "";

  qualifyingSelect.value =
    "";

  bopSelect.value =
    "";

  myCombo.innerHTML =
    "";

  comboInfo.textContent =
    "";

  saveComboBtn.disabled =
    false;

  saveComboBtn.textContent =
    "➕ DODAJ MOJE COMBO";

}


/* ================================================== */
/* CZY RUNDA JEST AKTYWNA */
/* ================================================== */

function roundIsActive() {

  return (

    currentRound &&

    currentRound.status ===
      "voting" &&

    currentRound.drawTime &&

    Date.now() <
      Number(
        currentRound.drawTime
      )

  );

}


/* ================================================== */
/* NOWA RUNDA */
/* ================================================== */

newRoundBtn.addEventListener(
  "click",
  async () => {

    if (
      adminPin.value.trim() !==
      ADMIN_PIN
    ) {

      adminInfo.textContent =
        "❌ Nieprawidłowy PIN.";

      adminInfo.style.color =
        "#ff5555";

      return;

    }


    const confirmStart =
      confirm(

        "Utworzyć nową rundę?\n\n" +

        "Niewylosowane COMBO pozostaną w puli."

      );


    if (!confirmStart) {
      return;
    }


    try {

      newRoundBtn.disabled =
        true;


      const now =
        Date.now();


      await set(
        roundRef,
        {

          id:
            String(now),

          status:
            "voting",

          startTime:
            now,

          drawTime:
            null,

          winner:
            null

        }
      );


      resetComboForm();


      officialResult.textContent =
        "📅 Ustaw datę i godzinę losowania.";


      adminInfo.textContent =
        "🟢 Nowa runda utworzona. Ustaw termin losowania.";

      adminInfo.style.color =
        "#4ade80";


      adminPin.value =
        "";

    }

    catch (error) {

      adminInfo.textContent =
        "❌ Błąd: " +
        error.message;

      adminInfo.style.color =
        "#ff5555";

    }


    newRoundBtn.disabled =
      false;

  }
);


/* ================================================== */
/* KLASA / MULTIKLASA */
/* ================================================== */

classButtons.forEach(
  button => {

    button.addEventListener(
      "click",
      () => {

        if (!roundIsActive()) {
          return;
        }


        const className =
          button.dataset.class;


        if (
          selectedClasses.includes(
            className
          )
        ) {

          selectedClasses =
            selectedClasses.filter(
              item =>
                item !==
                className
            );


          button.classList.remove(
            "selected"
          );

        }

        else {

          selectedClasses.push(
            className
          );


          button.classList.add(
            "selected"
          );

        }

      }
    );

  }
);


/* ================================================== */
/* ZAPIS COMBO */
/* ================================================== */

saveComboBtn.addEventListener(
  "click",
  async () => {

    if (!roundIsActive()) {

      showError(
        "❌ Runda nie jest aktywna."
      );

      return;

    }


    const track =
      trackSelect.value;

    const laps =
      Number(
        lapsInput.value
      );

    const weather =
      weatherSelect.value;

    const timeOfDay =
      timeOfDaySelect.value;

    const tires =
      tireSelect.value;

    const pit =
      pitSelect.value;

    const fuel =
      fuelSelect.value;

    const tireWear =
      tireWearSelect.value;

    const startType =
      startTypeSelect.value;

    const qualifying =
      qualifyingSelect.value;

    const bop =
      bopSelect.value;


    if (!track) {

      );

      return;

    }


    if (!timeOfDay) {

      showError(
        "❌ Wybierz porę dnia."
      );

      return;

    }


    if (!tires) {

      showError(
        "❌ Wybierz opony."
      );

      return;

    }


    if (!pit) {

      showError(
        "❌ Wybierz PIT STOP."
      );

      return;

    }


    if (!fuel) {

      showError(
        "❌ Wybierz zużycie paliwa."
      );

      return;

    }


    if (!tireWear) {

      showError(
        "❌ Wybierz zużycie opon."
      );

      return;

    }


    if (!startType) {

    ) {

        ref(

           * wyświetlany publicznie.

          playerId:
            playerId,

          roundId:
            currentRound.id,

          drawTime:
            currentRound.drawTime,

          track:

          classes:

          laps:
            laps,

          weather:
            weather,

          timeOfDay:
            timeOfDay,

          tires:
            tires,

          pit:
            pit,

          fuel:
            fuel,

          tireWear:
            tireWear,

            startType,

          qualifying:

/* ================================================== */
/* BŁĄD */
/* ================================================== */

function showError(
  message
) {

  comboInfo.textContent =
    message;

  comboInfo.style.color =
    "#ff5555";

}


/* ================================================== */
/* LOSOWA POZYCJA */
/* ================================================== */

function randomItem(
  array
) {

  return array[
    Math.floor(
      Math.random() *
      array.length
    )
  ];

}


/* ================================================== */
/* USTAWIENIE TERMINU */
/* ================================================== */

setScheduleBtn.addEventListener(
  "click",
  async () => {

    if (
      adminPin.value.trim() !==
      ADMIN_PIN
    ) {

      adminInfo.textContent =
        "❌ Nieprawidłowy PIN.";

      adminInfo.style.color =
        "#ff5555";

      return;

    }


    const date =
      drawDate.value;

    const time =
      drawTime.value;


    if (!date || !time) {

      adminInfo.textContent =
        "❌ Wybierz datę oraz godzinę.";

      adminInfo.style.color =
        "#ff5555";

      return;

    }


    const drawTimestamp =
      new Date(
        date +
        "T" +
        time
      ).getTime();


    if (
      !Number.isFinite(
        drawTimestamp
      )
    ) {

      adminInfo.textContent =
        "❌ Nieprawidłowa data lub godzina.";

      adminInfo.style.color =
        "#ff5555";

      return;

    }


    if (
      drawTimestamp <=
      Date.now()
    ) {

      adminInfo.textContent =
        "❌ Termin musi być w przyszłości.";

      adminInfo.style.color =
        "#ff5555";

      return;

    }


    try {

      const baseRound =
        currentRound || {

          id:
            String(
              Date.now()
            ),

          startTime:
            Date.now(),

          winner:
            null

        };


      await set(
        roundRef,
        {

          ...baseRound,

          status:
            "voting",

          drawTime:
            drawTimestamp,

          winner:
            null,

          updatedAt:
            Date.now()

        }
      );


      adminInfo.textContent =
        "✅ Termin losowania ustawiony.";

      adminInfo.style.color =
        "#4ade80";


      adminPin.value =
        "";

    }

    catch (error) {

      adminInfo.textContent =
        "❌ Błąd: " +
        error.message;

      adminInfo.style.color =
        "#ff5555";

    }

  }
);

/* ================================================== */
/* LOSOWANIE */
/* ================================================== */

async function finishRound() {

  if (
    finishingRound ||
    !currentRound
  ) {

    return;

  }


  finishingRound =
    true;


  try {

    const roundSnapshot =
      await get(
        roundRef
      );


    const latestRound =
      roundSnapshot.val();


    if (
      !latestRound ||
      latestRound.status !==
        "voting" ||
      !latestRound.drawTime ||
      Date.now() <
        Number(
          latestRound.drawTime
        )
    ) {

      finishingRound =
        false;

      return;

    }


    const combosSnapshot =
      await get(
        combosRef
      );


    const allCombos =
      combosSnapshot.val() ||
      {};


    /*
     * WAŻNE:
     *
     * Nie filtrujemy po roundId.
     *
     * Dzięki temu stare, niewylosowane
     * COMBO pozostają w puli.
     */

    const entries =
      Object.entries(
        allCombos
      );


    if (
      entries.length ===
      0
    ) {

      await set(
        roundRef,
        {

          ...latestRound,

          status:
            "finished",

          winner:
            null,

          finishedAt:
            Date.now()

        }
      );


      finishingRound =
        false;

      return;

    }


    /*
     * LOSUJEMY JEDNO COMBO
     * Z CAŁEJ PULI.
     */

    const winnerEntry =
      randomItem(
        entries
      );


    const winnerKey =
      winnerEntry[0];

    const winner =
      winnerEntry[1];


    /*
     * USUWAMY TYLKO WYLOSOWANE COMBO.
     *
     * Wszystkie pozostałe zostają.
     */

    await remove(
      ref(
        database,
        "srsLobbyCombos/" +
        winnerKey
      )
    );


    /*
     * ZAPIS WYNIKU.
     */

    await set(
      roundRef,
      {

        ...latestRound,

        status:
          "finished",

        winner:
          winner,

        finishedAt:
          Date.now()

      }
    );

  }

  catch (error) {

    console.error(
      "Błąd losowania:",
      error
    );

  }


  finishingRound =
    false;

}


/* ================================================== */
/* ODLICZANIE */
/* ================================================== */

function updateCountdown() {

  if (
    !currentRound ||
    currentRound.status !==
      "voting" ||
    !currentRound.drawTime
  ) {

    return;

  }


  const left =
    Number(
      currentRound.drawTime
    ) -
    Date.now();


  if (left <= 0) {

    countdown.textContent =
      "00:00:00";


    finishRound();


    return;

  }


  const totalSeconds =
    Math.floor(
      left / 1000
    );


  const days =
    Math.floor(
      totalSeconds / 86400
    );


  const hours =
    Math.floor(
      (totalSeconds % 86400) /
      3600
    );


  const minutes =
    Math.floor(
      (totalSeconds % 3600) /
      60
    );


  const seconds =
    totalSeconds % 60;


  if (days > 0) {

    countdown.textContent =

      String(days)
        .padStart(2, "0") +

      ":" +

      String(hours)
        .padStart(2, "0") +

      ":" +

      String(minutes)
        .padStart(2, "0") +

      ":" +

      String(seconds)
        .padStart(2, "0");

  }

  else {

    countdown.textContent =

      String(hours)
        .padStart(2, "0") +

      ":" +

      String(minutes)
        .padStart(2, "0") +

      ":" +

      String(seconds)
        .padStart(2, "0");

  }

}


/* ================================================== */
/* RENDER RUNDY */
/* ================================================== */

function renderRound() {

  if (!currentRound) {

    phaseStatus.textContent =
      "⏳ BRAK AKTYWNEJ RUNDY";

    phaseStatus.style.color =
      "#ddd";

    countdown.textContent =
      "00:00:00";

    phaseInfo.textContent =
      "Czekamy na rozpoczęcie rundy.";

    comboSection.classList.add(
      "hidden"
    );

    officialResult.textContent =
      "Wynik pojawi się po zakończeniu czasu.";

    return;

  }


  if (
    currentRound.status ===
    "waiting"
  ) {

    phaseStatus.textContent =
      "📅 OCZEKIWANIE NA TERMIN";

    phaseStatus.style.color =
      "#ffe000";

    countdown.textContent =
      "00:00:00";

    phaseInfo.textContent =
      "Administrator musi ustawić datę i godzinę losowania.";

    comboSection.classList.add(
      "hidden"
    );

    return;

  }


  if (
    currentRound.status ===
    "voting"
  ) {

    if (
      roundIsActive()
    ) {

      phaseStatus.textContent =
        "🟢 DODAWANIE COMBO TRWA";

      phaseStatus.style.color =
        "#4ade80";

      phaseInfo.textContent =
        "Możesz dodać jedno COMBO do tego terminu.";

      comboSection.classList.remove(
        "hidden"
      );


      officialResult.textContent =
        "🎰 Losowanie odbędzie się automatycznie w wyznaczonym terminie.";

    }

    else {

      phaseStatus.textContent =
        "🎰 AUTOMATYCZNE LOSOWANIE...";

      phaseStatus.style.color =
        "#ffe000";

      phaseInfo.textContent =
        "System losuje jedno COMBO z całej puli.";

      comboSection.classList.add(
        "hidden"
      );


      finishRound();

    }

  }


  if (
    currentRound.status ===
    "finished"
  ) {

    phaseStatus.textContent =
      "🏆 COMBO WYLOSOWANE";

    phaseStatus.style.color =
      "#ff6666";

    countdown.textContent =
      "00:00:00";

    phaseInfo.textContent =
      "Niewylosowane COMBO pozostają w puli. Administrator może ustawić kolejny termin.";

    comboSection.classList.add(
      "hidden"
    );


    const winner =
      currentRound.winner;


    if (!winner) {

      officialResult.textContent =
        "❌ Nikt nie dodał COMBO.";

      return;

    }


    const classes =
      Array.isArray(
        winner.classes
      )
        ? winner.classes.join(
            " + "
          )
        : winner.classes;


    const classType =
      Array.isArray(
        winner.classes
      ) &&
      winner.classes.length > 1

        ? "🔵 MULTIKLASA"

        : "🏎️ KLASA AUT";


    officialResult.innerHTML = `

      <div class="result-title">
        🏁 WYBRANY TOR
      </div>

      <div class="result-value">
        ${winner.track}
      </div>

      <div class="result-title">
        ${classType}
      </div>

      <div class="result-value">
        ${classes}
      </div>

      <div class="result-title">
        🔢 OKRĄŻENIA
      </div>

      <div class="result-value">
        ${winner.laps}
      </div>

      <div class="result-title">
        🌦️ POGODA
      </div>

      <div class="result-value">
        ${winner.weather}
      </div>

      <div class="result-title">
        🌅 PORA DNIA
      </div>

      <div class="result-value">
        ${winner.timeOfDay}
      </div>

      <div class="result-title">
        🛞 OPONY
      </div>

      <div class="result-value">
        ${winner.tires}
      </div>

      <div class="result-title">
        🔧 PIT STOP
      </div>

      <div class="result-value">
        ${winner.pit}
      </div>

      <div class="result-title">
        ⛽ ZUŻYCIE PALIWA
      </div>

      <div class="result-value">
        ${winner.fuel}
      </div>

      <div class="result-title">
        🛞 ZUŻYCIE OPON
      </div>

      <div class="result-value">
        ${winner.tireWear}
      </div>

      <div class="result-title">
        🚦 TYP STARTU
      </div>

      <div class="result-value">
        ${winner.startType}
      </div>

      <div class="result-title">
        ⏱️ KWALIFIKACJE
      </div>

      <div class="result-value">
        ${winner.qualifying}
      </div>

      <div class="result-title">
        ⚖️ BOP
      </div>

      <div class="result-value">
        ${winner.bop}
      </div>

    `;

  }

}


/* ================================================== */
/* ODCZYT RUNDY */
/* ================================================== */

onValue(
  roundRef,
  snapshot => {

    currentRound =
      snapshot.val();


    renderRound();

    updateCountdown();

  }
);


/* ================================================== */
/* ODCZYT COMBO */
/* ================================================== */

onValue(
  combosRef,
  snapshot => {

    currentCombos =
      snapshot.val() ||
      {};


    /*
     * LICZYMY CAŁĄ PULĘ,
     * a nie tylko bieżącą rundę.
     */

    const combos =
      Object.values(
        currentCombos
      );


    participantCount.textContent =
      "🎯 " +
      combos.length +
      " COMBO w puli";


    /*
     * POKAZUJEMY SWOJE COMBO
     * TYLKO JEŚLI NALEŻY DO
     * AKTUALNEJ RUNDY.
     */

    const mySavedCombo =
      currentCombos[
        playerId
      ];


    if (
      mySavedCombo &&
      currentRound &&
      mySavedCombo.roundId ===
        currentRound.id
    ) {

      const myClasses =
        Array.isArray(
          mySavedCombo.classes
        )
          ? mySavedCombo.classes.join(
              " + "
            )
          : mySavedCombo.classes;


      myCombo.innerHTML = `

        <strong>
          ✅ TWOJE COMBO:
        </strong>

        <br>

        🏁 ${mySavedCombo.track}

        <br>

        🏎️ ${myClasses}

        <br>

        🔢 ${mySavedCombo.laps} okr.

        <br>

        🌦️ ${mySavedCombo.weather}

        <br>

        🌅 ${mySavedCombo.timeOfDay}

        <br>

        🛞 ${mySavedCombo.tires}

        <br>

        🔧 ${mySavedCombo.pit}

        <br>

        ⛽ Paliwo
        ${mySavedCombo.fuel}

        <br>

        🛞 Zużycie opon
        ${mySavedCombo.tireWear}

        <br>

        🚦 ${mySavedCombo.startType}

        <br>

        ⏱️ Kwalifikacje:
        ${mySavedCombo.qualifying}

        <br>

        ⚖️ ${mySavedCombo.bop}

      `;

    }

    else {

      myCombo.innerHTML =
        "";

    }

  }
);


/* ================================================== */
/* AUTOMATYCZNA KONTROLA CZASU */
/* ================================================== */

setInterval(
  () => {

    updateCountdown();


    if (
      currentRound &&
      currentRound.status ===
        "voting" &&
      currentRound.drawTime &&
      !roundIsActive()
    ) {

      finishRound();

    }

  },
  1000
);


/* ================================================== */
/* DOMYŚLNA DATA I GODZINA */
/* ================================================== */

function setDefaultSchedule() {

  const now =
    new Date(
      Date.now() +
      7 * 24 * 60 * 60 * 1000
    );


  const year =
    now.getFullYear();

  const month =
    String(
      now.getMonth() + 1
    ).padStart(
      2,
      "0"
    );

  const day =
    String(
      now.getDate()
    ).padStart(
      2,
      "0"
    );


  drawDate.value =
    `${year}-${month}-${day}`;

  drawTime.value =
    "20:00";

}


setDefaultSchedule();
