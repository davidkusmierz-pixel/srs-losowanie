<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SRS LOBBY COMBO</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: white;

      background:
        linear-gradient(
          rgba(5, 6, 12, 0.75),
          rgba(5, 6, 12, 0.94)
        ),
        url("background.png.png");

      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    .container {
      width: min(950px, 94%);
      margin: auto;
      padding: 20px 0 60px;
    }

    h1 {
      text-align: center;
      font-size: clamp(32px, 7vw, 55px);
      margin: 15px 0 25px;
      text-shadow: 0 4px 25px black;
    }

    .card {
      background: rgba(10, 11, 20, 0.94);
      border: 1px solid rgba(220, 0, 0, 0.55);
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 20px;

      box-shadow:
        0 10px 35px rgba(0,0,0,0.6),
        0 0 30px rgba(180,0,0,0.08);
    }

    .hidden {
      display: none !important;
    }

    button,
    input,
    select {
      font-family: inherit;
    }

    button {
      border: none;
      border-radius: 11px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .admin-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    #adminPin {
      width: 220px;
      height: 58px;
      border-radius: 11px;
      border: 1px solid #555;
      background: #15151d;
      color: white;
      text-align: center;
      font-size: 17px;
      padding: 0 15px;
    }

    #newRoundBtn {
      min-width: 260px;
      height: 58px;
      font-size: 17px;
      background: linear-gradient(
        135deg,
        #e30000,
        #850000
      );
    }

    #adminInfo {
      margin-top: 12px;
      text-align: center;
      min-height: 20px;
      color: #aaa;
    }

    .status-card {
      text-align: center;
    }

    #phaseStatus {
      font-size: clamp(24px, 5vw, 31px);
      font-weight: bold;
      margin-bottom: 15px;
    }

    #countdown {
      font-size: clamp(55px, 12vw, 82px);
      font-weight: bold;
      color: #ffe000;
      line-height: 1;
      text-shadow: 0 0 25px rgba(255,220,0,0.35);
    }

    #phaseInfo {
      margin-top: 15px;
      color: #ccc;
    }

    .section-title {
      text-align: center;
      font-size: clamp(21px, 4vw, 27px);
      font-weight: bold;
      margin-bottom: 20px;
    }

    .label {
      display: block;
      margin: 18px 0 8px;
      font-weight: bold;
      color: #ddd;
    }

    select,
    input[type="number"] {
      width: 100%;
      min-height: 52px;
      border-radius: 10px;
      border: 1px solid #555;
      background: #15151d;
      color: white;
      padding: 0 15px;
      font-size: 16px;
    }

    .classes {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }

    .class-btn {
      min-height: 70px;
      background: #15151d;
      border: 2px solid #444;
      font-size: 17px;
    }

    .class-btn.selected {
      border-color: #ff2020;
      background: linear-gradient(
        135deg,
        #5e0000,
        #210000
      );
    }

    #trackPoolInfo {
      text-align: center;
      color: #ffe000;
      font-weight: bold;
      margin-bottom: 10px;
      font-size: 18px;
    }

    #saveComboBtn {
      width: 100%;
      min-height: 58px;
      margin-top: 25px;
      font-size: 18px;
      background: linear-gradient(
        135deg,
        #e30000,
        #850000
      );
    }

    #comboInfo {
      margin-top: 15px;
      text-align: center;
      min-height: 22px;
    }

    .participant-count {
      text-align: center;
      font-size: 20px;
      margin-bottom: 15px;
      color: #ffe000;
    }

    .my-combo {
      margin-top: 15px;
      text-align: center;
      line-height: 1.8;
    }

    .result {
      text-align: center;
      line-height: 1.8;
    }

    .result-title {
      color: #ffe000;
      font-size: 20px;
      margin-top: 12px;
    }

    .result-value {
      font-size: clamp(23px, 5vw, 34px);
      font-weight: bold;
      color: #ff6666;
    }

    @media (max-width: 850px) {
      .classes {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    @media (max-width: 650px) {
      .classes {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 500px) {
      .admin-row {
        flex-direction: column;
      }

      #adminPin,
      #newRoundBtn {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🎮 SRS LOBBY COMBO</h1>


    <!-- ADMIN -->

    <div class="card">

      <div class="admin-row">

        <input

        <button id="newRoundBtn">
          🔄 NOWA RUNDA
        </button>

      </div>

    </div>


    <!-- STATUS -->

    </div>


    <!-- COMBO -->

    <div id="comboSection" class="card hidden">

      <div class="section-title">
        ➕ DODAJ SWOJE COMBO
      </div>


      <!-- TOR -->

      <label class="label">
        🏁 WYBIERZ TOR
      </label>

      <div id="trackPoolInfo">
        🎯 POZOSTAŁO TORÓW: 0
      </div>

      <select id="trackSelect">

        <option value="">
          -- WYBIERZ TOR --
        </option>

      </select>


      <!-- KLASA -->

      <label class="label">
        🏎️ WYBIERZ KLASĘ / MULTIKLASĘ
      </label>

      <div class="classes">

        <button
          type="button"
          class="class-btn"
          data-class="Gr.1"
        >
          🏎️ Gr.1
        </button>

        <button
          type="button"
          class="class-btn"
          data-class="Gr.2"
        >
          🏁 Gr.2
        </button>

        <button
          type="button"
          class="class-btn"
          data-class="Gr.3"
        >
          🚗 Gr.3
        </button>

        <button
          type="button"
          class="class-btn"
          data-class="Gr.4"
        >
          🚙 Gr.4
        </button>

        <button
          type="button"
          class="class-btn"
          data-class="Hypercar"
        >
          🔥 Hypercar
        </button>

        <button
          type="button"
          class="class-btn"
          data-class="Super Formula"
        >
          🏎️ Super Formula
        </button>

        <button
          type="button"
          class="class-btn"
          data-class="Gr.B"
        >
          🚙 Gr.B
        </button>

        <button
          type="button"
          class="class-btn"
          data-class="Vision Gran Turismo"
        >
          ⚡ Vision GT
        </button>

        <button
          type="button"
          class="class-btn"
          data-class="Samochody drogowe"
        >
          🚗 Samochody drogowe
        </button>

        <button
          type="button"
          class="class-btn"
          data-class="Open Class"
        >
          🏁 Open Class
        </button>

      </div>


      <!-- OKRĄŻENIA -->

      <label class="label">
        🔢 LICZBA OKRĄŻEŃ
      </label>

      <input
        type="number"
        id="lapsInput"
        min="1"
        max="200"
        placeholder="Np. 15"
      >


      <!-- POGODA -->

      <label class="label">
        🌦️ POGODA
      </label>

      <select id="weatherSelect">

        <option value="">
          -- WYBIERZ POGODĘ --
        </option>

        <option>☀️ Słonecznie</option>
        <option>🌤️ Lekko pochmurno</option>
        <option>🌥️ Pochmurno</option>
        <option>🌦️ Zmienna pogoda</option>
        <option>🌧️ Deszcz</option>

      </select>


      <!-- PORA DNIA -->

      <label class="label">
        🌅 PORA DNIA
      </label>

      <select id="timeOfDaySelect">

        <option value="">
          -- WYBIERZ PORĘ DNIA --
        </option>

        <option>🌄 Świt</option>
        <option>☀️ Rano</option>
        <option>🌞 Dzień</option>
        <option>🌇 Popołudnie</option>
        <option>🌅 Zachód słońca</option>
        <option>🌙 Noc</option>

      </select>


      <!-- OPONY -->

      <label class="label">
        🛞 OPONY
      </label>

      <select id="tireSelect">

        <option value="">
          -- WYBIERZ OPONY --
        </option>

        <option>RH – Twarde</option>
        <option>RM – Średnie</option>
        <option>RS – Miękkie</option>
        <option>RH + RM</option>
        <option>RM + RS</option>
        <option>RH + RM + RS</option>
        <option>SH – Sport Hard</option>
        <option>SM – Sport Medium</option>
        <option>SS – Sport Soft</option>
        <option>Dowolne opony</option>

      </select>


      <!-- PIT -->

      <label class="label">

      </label>

      <select id="pitSelect">

        <option value="">
          -- WYBIERZ PIT STOP --
        </option>

        <option>

        </option>

      <!-- PALIWO -->

      <select id="fuelSelect">

        <option value="">

        </option>

        <option>x1</option>

      </select>


      <!-- KWALIFIKACJE -->

      <label class="label">
        ⏱️ KWALIFIKACJE
      </label>

      <select id="qualifyingSelect">

        <option value="">

        </option>

        <option>
          Brak kwalifikacji
        </option>

        <option>5 minut</option>
        <option>10 minut</option>

        <option>20 minut</option>

      </select>


      <!-- BOP -->

      <label class="label">
        ⚖️ BOP
      </label>

      <select id="bopSelect">

        <option value="">
          -- WYBIERZ BOP --
        </option>

        <option>

        </option>

      </select>


      <button id="saveComboBtn">
        ➕ DODAJ MOJE COMBO
      </button>

      <div id="comboInfo"></div>

      <div id="myCombo" class="my-combo"></div>

    </div>


    <!-- UCZESTNICY -->

    <div class="card">

      <div class="section-title">
        👥 UCZESTNICY
      </div>

      <div
        id="participantCount"
        class="participant-count"

        👥 0 osób dodało COMBO
      </div>

    </div>


    <!-- WYNIK -->

    <div class="card">

      <div class="section-title">
        🏆 WYLOSOWANE COMBO
      </div>

      <div
        id="officialResult"
        class="result"
      >
        Wynik pojawi się automatycznie po zakończeniu czasu.
      </div>

    </div>

  </div>


  <script type="module">

    import {
      initializeApp
    } from
    "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

    import {
      getDatabase,
      ref,
      set,
      get,
      onValue,
      remove,
      runTransaction
    } from
    "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


    /* =====================================================
       FIREBASE
    ===================================================== */

    const firebaseConfig = {

      apiKey:
        "AIzaSyDRDAiSlJBPOG8N_c4ctBRLYrwx3ER5rKw",

      authDomain:
        "srs-losowanie.firebaseapp.com",

      databaseURL:
        "https://srs-losowanie-default-rtdb.firebaseio.com",

      projectId:
        "srs-losowanie",

      storageBucket:
        "srs-losowanie.firebasestorage.app",

      messagingSenderId:
        "212959687651",

      appId:
        "1:212959687651:web:0a9a5e647450767bc026d6"

    };


    const app =
      initializeApp(firebaseConfig);

    const database =
      getDatabase(app);


    /* =====================================================
       ADMIN
    ===================================================== */

    const ADMIN_PIN =
      "840416";


    /* =====================================================
       CZAS RUNDY
       5 MINUT
    ===================================================== */

    const ROUND_TIME =
      5 * 60 * 1000;


    /* =====================================================
       ELEMENTY
    ===================================================== */

    const adminPin =
      document.getElementById("adminPin");

    const newRoundBtn =
      document.getElementById("newRoundBtn");

    const adminInfo =
      document.getElementById("adminInfo");

    const phaseStatus =
      document.getElementById("phaseStatus");

    const countdown =
      document.getElementById("countdown");

    const phaseInfo =
      document.getElementById("phaseInfo");

    const comboSection =
      document.getElementById("comboSection");

    const trackSelect =
      document.getElementById("trackSelect");

    const trackPoolInfo =
      document.getElementById("trackPoolInfo");

    const classButtons =
      document.querySelectorAll(".class-btn");

    const lapsInput =
      document.getElementById("lapsInput");

    const weatherSelect =
      document.getElementById("weatherSelect");

    const timeOfDaySelect =
      document.getElementById("timeOfDaySelect");

    const tireSelect =
      document.getElementById("tireSelect");

    const pitSelect =
      document.getElementById("pitSelect");

    const fuelSelect =
      document.getElementById("fuelSelect");

    const tireWearSelect =
      document.getElementById("tireWearSelect");

    const startTypeSelect =
      document.getElementById("startTypeSelect");

    const qualifyingSelect =
      document.getElementById("qualifyingSelect");

    const bopSelect =
      document.getElementById("bopSelect");

    const saveComboBtn =
      document.getElementById("saveComboBtn");

    const comboInfo =
      document.getElementById("comboInfo");

    const myCombo =
      document.getElementById("myCombo");

    const participantCount =
      document.getElementById("participantCount");

    const officialResult =
      document.getElementById("officialResult");


    /* =====================================================
       FIREBASE REFERENCJE
    ===================================================== */

    const roundRef =
      ref(
        database,
        "srsLobbyRound"
      );

    const combosRef =
      ref(
        database,
        "srsLobbyCombos"
      );

    const trackPoolRef =
      ref(
        database,
        "srsLobbyTrackPool"
      );


    /*
     * PEŁNA PULA TORÓW
     */

    const ALL_TRACKS = [

      "Autodrome Lago Maggiore",
      "Autopolis",
      "Blue Moon Bay Speedway",
      "Brands Hatch",
      "Circuit de Barcelona-Catalunya",
      "Circuit de la Sarthe",
      "Circuit de Spa-Francorchamps",
      "Daytona Road Course",
      "Deep Forest Raceway",
      "Dragon Trail - Seaside",
      "Fuji International Speedway",
      "Goodwood Motor Circuit",
      "Grand Valley",
      "High Speed Ring",
      "Interlagos",
      "Kyoto Driving Park",
      "Monza Circuit",
      "Mount Panorama",
      "Nürburgring GP",
      "Nürburgring Nordschleife",
      "Nürburgring 24h",
      "Red Bull Ring",
      "Road Atlanta",
      "Sardegna Road Track",
      "Sardegna Windmills",
      "Suzuka Circuit",
      "Tokyo Expressway",
      "Trial Mountain Circuit",
      "Watkins Glen",
      "WeatherTech Raceway Laguna Seca"

    ];


    /* =====================================================
       ZMIENNE
    ===================================================== */

    let currentRound = null;

    let currentCombos = {};

    let selectedClasses = [];

    let finishingRound = false;


    /* =====================================================
       ID GRACZA
    ===================================================== */

    let playerId =
      localStorage.getItem(
        "srsLobbyPlayerId"
      );


    if (!playerId) {

      playerId =
        "player_" +
        Date.now() +
        "_" +
        Math.random()
          .toString(36)
          .substring(2, 10);


      localStorage.setItem(
        "srsLobbyPlayerId",
        playerId
      );

    }


    /* =====================================================
       PULA TORÓW
    ===================================================== */

    async function getTrackPool() {

      const snapshot =
        await get(trackPoolRef);

      let pool =
        snapshot.val();


      /*
       * Pierwsze uruchomienie
       */

      if (!Array.isArray(pool)) {

        pool =
          [...ALL_TRACKS];

        await set(
          trackPoolRef,
          pool
        );

      }


      /*
       * Jeżeli wszystkie tory zostały
       * wykorzystane, zaczynamy nowy cykl.
       */

      if (pool.length === 0) {

        pool =
          [...ALL_TRACKS];

        await set(
          trackPoolRef,
          pool
        );

      }


      return pool;

    }


    /* =====================================================
       WYŚWIETLANIE DOSTĘPNYCH TORÓW
    ===================================================== */

    function renderTrackPool(pool) {

      if (!Array.isArray(pool)) {

        pool =
          [...ALL_TRACKS];

      }


      /*
       * Zapamiętujemy aktualnie wybrany tor
       */

      const previousValue =
        trackSelect.value;


      trackSelect.innerHTML = "";


      const defaultOption =
        document.createElement("option");


      defaultOption.value = "";

      defaultOption.textContent =
        "-- WYBIERZ TOR --";


      trackSelect.appendChild(
        defaultOption
      );


      pool.forEach(
        track => {

          const option =
            document.createElement("option");


          option.value =
            track;


          option.textContent =
            track;


          trackSelect.appendChild(
            option
          );

        }
      );


      /*
       * Jeżeli poprzedni tor nadal jest
       * dostępny, pozostawiamy go zaznaczonego.
       */

      if (
        previousValue &&
        pool.includes(previousValue)
      ) {

        trackSelect.value =
          previousValue;

      }


      trackPoolInfo.textContent =
        "🎯 POZOSTAŁO TORÓW: " +
        pool.length;

    }


    /* =====================================================
       RESET FORMULARZA
    ===================================================== */

    function resetComboForm() {

      trackSelect.value = "";

      selectedClasses = [];


      classButtons.forEach(
        button => {

          button.classList.remove(
            "selected"
          );

        }
      );


      lapsInput.value = "";

      weatherSelect.value = "";

      timeOfDaySelect.value = "";

      tireSelect.value = "";

      pitSelect.value = "";

      fuelSelect.value = "";

      tireWearSelect.value = "";

      startTypeSelect.value = "";

      qualifyingSelect.value = "";

      bopSelect.value = "";


      myCombo.innerHTML = "";

      comboInfo.textContent = "";


      saveComboBtn.disabled =
        false;


      saveComboBtn.textContent =
        "➕ DODAJ MOJE COMBO";

    }


    /* =====================================================
       SPRAWDZENIE AKTYWNOŚCI RUNDY
    ===================================================== */

    function roundIsActive() {

      return (

        currentRound &&

        currentRound.status ===
          "voting" &&

        Date.now() <
          Number(
            currentRound.endTime
          )

      );

    }


    /* =====================================================
       NOWA RUNDA
    ===================================================== */

    newRoundBtn.addEventListener(
      "click",
      async () => {

        if (
          adminPin.value.trim() !==
          ADMIN_PIN
        ) {

          adminInfo.textContent =
            "❌ Nieprawidłowy PIN.";

          adminInfo.style.color =
            "#ff5555";

          return;

        }


        const confirmStart =
          confirm(
            "Rozpocząć nową rundę na 5 minut?\n\n" +
            "Stare COMBO zostaną usunięte.\n" +
            "Wylosowane wcześniej tory pozostaną poza pulą."
          );


        if (!confirmStart) {

          return;

        }


        try {

          newRoundBtn.disabled =
            true;


          adminInfo.textContent =
            "⏳ Przygotowywanie nowej rundy...";

          adminInfo.style.color =
            "#ffe000";


          /*
           * USUWAMY STARE COMBO.
           *
           * PULA TORÓW NIE JEST USUWANA.
           */

          await remove(
            combosRef
          );


          /*
           * Pobieramy aktualną pulę.
           */

          const trackPool =
            await getTrackPool();


          /*
           * Jeżeli pula jest pusta,
           * getTrackPool automatycznie
           * utworzy nowy cykl.
           */

          renderTrackPool(
            trackPool
          );


          const now =
            Date.now();


          /*
           * Tworzymy nową rundę.
           */

          await set(
            roundRef,
            {

              id:
                String(now),

              status:
                "voting",

              startTime:
                now,

              endTime:
                now + ROUND_TIME,

              winner:
                null

            }
          );


          resetComboForm();


          adminPin.value =
            "";


          participantCount.textContent =
            "👥 0 osób dodało COMBO";


          officialResult.textContent =
            "🎰 Losowanie odbędzie się automatycznie po zakończeniu czasu.";


          adminInfo.textContent =
            "🟢 Nowa runda rozpoczęta. Pula torów została zachowana.";


          adminInfo.style.color =
            "#4ade80";

        }


        catch (error) {

          console.error(
            error
          );


          adminInfo.textContent =
            "❌ Błąd: " +
            error.message;


          adminInfo.style.color =
            "#ff5555";

        }


        newRoundBtn.disabled =
          false;

      }
    );


    /* =====================================================
       WYBÓR KLASY
    ===================================================== */

    classButtons.forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            if (
              !roundIsActive()
            ) {

              return;

            }


            const className =
              button.dataset.class;


            if (
              selectedClasses.includes(
                className
              )
            ) {

              selectedClasses =
                selectedClasses.filter(
                  item =>
                    item !==
                    className
                );


              button.classList.remove(
                "selected"
              );

            }


            else {

              selectedClasses.push(
                className
              );


              button.classList.add(
                "selected"
              );

            }

          }
        );

      }
    );


    /* =====================================================
       ZAPIS COMBO
    ===================================================== */

    saveComboBtn.addEventListener(
      "click",
      async () => {

        if (
          !roundIsActive()
        ) {

          showError(
            "❌ Runda nie jest aktywna."
          );

          return;

        }


        const track =
          trackSelect.value;


        /*
         * SPRAWDZAMY AKTUALNĄ PULĘ.
         */

        const currentPool =
          await getTrackPool();


        if (
          !currentPool.includes(
            track
          )
        ) {

          showError(
            "❌ Ten tor został już wykorzystany. Wybierz inny."
          );


          renderTrackPool(
            currentPool
          );


          return;

        }


        const laps =
          Number(
            lapsInput.value
          );


        const weather =
          weatherSelect.value;


        const timeOfDay =
          timeOfDaySelect.value;


        const tires =
          tireSelect.value;


        const pit =
          pitSelect.value;


        const fuel =
          fuelSelect.value;


        const tireWear =
          tireWearSelect.value;


        const startType =
          startTypeSelect.value;


        const qualifying =
          qualifyingSelect.value;


        const bop =
          bopSelect.value;


        if (!track) {

          showError(
            "❌ Wybierz tor."
          );

          return;

        }


        if (
          selectedClasses.length === 0
        ) {

          showError(
            "❌ Wybierz klasę."
          );

          return;

        }


        if (
          !laps ||
          laps < 1
        ) {

          showError(
            "❌ Podaj liczbę okrążeń."
          );

          return;

        }


        if (!weather) {

          showError(
            "❌ Wybierz pogodę."
          );

          return;

        }


        if (!timeOfDay) {

          showError(
            "❌ Wybierz porę dnia."
          );

          return;

        }


        if (!tires) {

          showError(
            "❌ Wybierz opony."
          );

          return;

        }


        if (!pit) {

          showError(
            "❌ Wybierz PIT STOP."
          );

          return;

        }


        if (!fuel) {

          showError(
            "❌ Wybierz zużycie paliwa."
          );

          return;

        }


        if (!tireWear) {

          showError(
            "❌ Wybierz zużycie opon."
          );

          return;

        }


        if (!startType) {

          showError(
            "❌ Wybierz typ startu."
          );

          return;

        }


        if (!qualifying) {

          showError(
            "❌ Wybierz kwalifikacje."
          );

          return;

        }


        if (!bop) {

          showError(
            "❌ Wybierz BOP."
          );

          return;

        }


        saveComboBtn.disabled =
          true;


        try {

          await set(

            ref(
              database,
              "srsLobbyCombos/" +
              playerId
            ),

            {

              playerId:
                playerId,

              roundId:
                currentRound.id,

              track:
                track,

              classes:
                selectedClasses,

              laps:
                laps,

              weather:
                weather,

              timeOfDay:
                timeOfDay,

              tires:
                tires,

              pit:
                pit,

              fuel:
                fuel,

              tireWear:
                tireWear,

              startType:
                startType,

              qualifying:
                qualifying,

              bop:
                bop,

              time:
                Date.now()

            }

          );


          comboInfo.textContent =
            "✅ COMBO zapisane.";


          comboInfo.style.color =
            "#4ade80";


          saveComboBtn.textContent =
            "✏️ ZMIEŃ MOJE COMBO";

        }


        catch (error) {

          showError(
            "❌ Błąd: " +
            error.message
          );

        }


        saveComboBtn.disabled =
          false;

      }
    );


    /* =====================================================
       BŁĄD
    ===================================================== */

    function showError(
      message
    ) {

      comboInfo.textContent =
        message;

      comboInfo.style.color =
        "#ff5555";

    }


    /* =====================================================
       LOSOWANIE
    ===================================================== */

    function randomItem(
      array
    ) {

      return array[
        Math.floor(
          Math.random() *
          array.length
        )
      ];

    }


    /* =====================================================
       ZAKOŃCZENIE RUNDY
    ===================================================== */

    async function finishRound() {

      if (
        finishingRound ||
        !currentRound
      ) {

        return;

      }


      finishingRound =
        true;


      try {

        /*
         * Pobieramy najnowszy stan rundy.
         */

        const roundSnapshot =
          await get(
            roundRef
          );


        const latestRound =
          roundSnapshot.val();


        /*
         * Jeżeli ktoś już zakończył
         * rundę, nic więcej nie robimy.
         */

        if (
          !latestRound ||
          latestRound.status !==
            "voting" ||
          Date.now() <
            Number(
              latestRound.endTime
            )
        ) {

          finishingRound =
            false;

          return;

        }


        /*
         * Pobieramy wszystkie COMBO.
         */

        const combosSnapshot =
          await get(
            combosRef
          );


        const allCombos =
          combosSnapshot.val() ||
          {};


        const combos =
          Object.values(
            allCombos
          )
          .filter(
            combo =>
              combo.roundId ===
              latestRound.id
          );


        /*
         * Nikt nie dodał COMBO.
         */

        if (
          combos.length === 0
        ) {

          await set(
            roundRef,
            {

              ...latestRound,

              status:
                "finished",

              winner:
                null

            }
          );


          finishingRound =
            false;

          return;

        }


        /*
         * LOSUJEMY COMBO.
         */

        const winner =
          randomItem(
            combos
          );


        /*
         * ============================================
         * USUWAMY WYLOSOWANY TOR Z PULI
         * ============================================
         */

        const poolSnapshot =
          await get(
            trackPoolRef
          );


        let trackPool =
          poolSnapshot.val();


        if (
          !Array.isArray(
            trackPool
          )
        ) {

          trackPool =
            [...ALL_TRACKS];

        }


        /*
         * Usuwamy tylko wylosowany tor.
         */

        trackPool =
          trackPool.filter(
            track =>
              track !==
              winner.track
          );


        /*
         * Zapisujemy nową pulę.
         */

        await set(
          trackPoolRef,
          trackPool
        );


        /*
         * ============================================
         * ZAKOŃCZENIE RUNDY
         * ============================================
         */

        await set(
          roundRef,
          {

            ...latestRound,

            status:
              "finished",

            winner:
              winner,

            finishedAt:
              Date.now(),

            remainingTracks:
              trackPool.length

          }
        );

      }


      catch (error) {

        console.error(
          "Błąd losowania:",
          error
        );

      }


      finishingRound =
        false;

    }


    /* =====================================================
       ODLICZANIE
    ===================================================== */

    function updateCountdown() {

      if (
        !currentRound ||
        currentRound.status !==
          "voting"
      ) {

        return;

      }


      const left =
        Number(
          currentRound.endTime
        ) -
        Date.now();


      if (
        left <= 0
      ) {

        countdown.textContent =
          "00:00";


        finishRound();


        return;

      }


      const seconds =
        Math.floor(
          left / 1000
        );


      const minutes =
        Math.floor(
          seconds / 60
        );


      const remainingSeconds =
        seconds % 60;


      countdown.textContent =
        String(minutes)
          .padStart(
            2,
            "0"
          ) +
        ":" +
        String(
          remainingSeconds
        )
          .padStart(
            2,
            "0"
          );

    }


    /* =====================================================
       RENDER RUNDY
    ===================================================== */

    function renderRound() {

      if (!currentRound) {

        phaseStatus.textContent =
          "⏳ BRAK AKTYWNEJ RUNDY";


        phaseStatus.style.color =
          "#ddd";


        countdown.textContent =
          "00:00";


        phaseInfo.textContent =
          "Czekamy na rozpoczęcie rundy.";


        comboSection.classList.add(
          "hidden"
        );


        officialResult.textContent =
          "Wynik pojawi się po zakończeniu czasu.";


        return;

      }


      /*
       * Runda trwa.
       */

      if (
        currentRound.status ===
        "voting"
      ) {

        if (
          roundIsActive()
        ) {

          phaseStatus.textContent =
            "🟢 DODAWANIE COMBO TRWA";


          phaseStatus.style.color =
            "#4ade80";


          phaseInfo.textContent =
            "Dodaj swoje COMBO przed końcem czasu.";


          comboSection.classList.remove(
            "hidden"
          );


          officialResult.textContent =
            "🎰 Losowanie odbędzie się automatycznie po zakończeniu czasu.";

        }


        else {

          phaseStatus.textContent =
            "🎰 AUTOMATYCZNE LOSOWANIE...";


          phaseStatus.style.color =
            "#ffe000";


          phaseInfo.textContent =
            "System losuje jedno COMBO.";


          comboSection.classList.add(
            "hidden"
          );


          finishRound();

        }

      }


      /*
       * Runda zakończona.
       */

      if (
        currentRound.status ===
        "finished"
      ) {

        phaseStatus.textContent =
          "🏆 COMBO WYLOSOWANE";


        phaseStatus.style.color =
          "#ff6666";


        countdown.textContent =
          "00:00";


        phaseInfo.textContent =
          "Admin może rozpocząć nową rundę.";


        comboSection.classList.add(
          "hidden"
        );


        const winner =
          currentRound.winner;


        if (!winner) {

          officialResult.textContent =
            "❌ Nikt nie dodał COMBO.";

          return;

        }


        const classes =
          Array.isArray(
            winner.classes
          )
            ? winner.classes.join(
                " + "
              )
            : winner.classes;


        const classType =
          Array.isArray(
            winner.classes
          ) &&
          winner.classes.length > 1
            ? "🔵 MULTIKLASA"
            : "🏎️ KLASA AUT";


        officialResult.innerHTML = `

          <div class="result-title">
            🏁 WYBRANY TOR
          </div>

          <div class="result-value">
            ${winner.track}
          </div>

          <div class="result-title">
            ${classType}
          </div>

          <div class="result-value">
            ${classes}
          </div>

          <div class="result-title">
            🔢 OKRĄŻENIA
          </div>

          <div class="result-value">
            ${winner.laps}
          </div>

          <div class="result-title">
            🌦️ POGODA
          </div>

          <div class="result-value">
            ${winner.weather}
          </div>

          <div class="result-title">
            🌅 PORA DNIA
          </div>

          <div class="result-value">
            ${winner.timeOfDay}
          </div>

          <div class="result-title">
            🛞 OPONY
          </div>

          <div class="result-value">
            ${winner.tires}
          </div>

          <div class="result-title">
            🔧 PIT STOP
          </div>

          <div class="result-value">
            ${winner.pit}
          </div>

          <div class="result-title">
            ⛽ ZUŻYCIE PALIWA
          </div>

          <div class="result-value">
            ${winner.fuel}
          </div>

          <div class="result-title">
            🛞 ZUŻYCIE OPON
          </div>

          <div class="result-value">
            ${winner.tireWear}
          </div>

          <div class="result-title">
            🚦 TYP STARTU
          </div>

          <div class="result-value">
            ${winner.startType}
          </div>

          <div class="result-title">
            ⏱️ KWALIFIKACJE
          </div>

          <div class="result-value">
            ${winner.qualifying}
          </div>

          <div class="result-title">
            ⚖️ BOP
          </div>

          <div class="result-value">
            ${winner.bop}
          </div>

          <div class="result-title">
            🎯 POZOSTAŁO TORÓW
          </div>

          <div class="result-value">
            ${currentRound.remainingTracks ?? "-"}
          </div>

        `;

      }

    }


    /* =====================================================
       NASŁUCH RUNDY
    ===================================================== */

    onValue(
      roundRef,
      async snapshot => {

        currentRound =
          snapshot.val();


        renderRound();


        updateCountdown();


        /*
         * Odświeżamy pulę.
         */

        try {

          const pool =
            await getTrackPool();


          renderTrackPool(
            pool
          );

        }

        catch (error) {

          console.error(
            "Błąd pobierania puli:",
            error
          );

        }

      }
    );


    /* =====================================================
       NASŁUCH PULI TORÓW
    ===================================================== */

    onValue(
      trackPoolRef,
      snapshot => {

        let pool =
          snapshot.val();


        if (
          !Array.isArray(pool)
        ) {

          pool =
            [...ALL_TRACKS];

        }


        /*
         * Tutaj NIE zapisujemy automatycznie
         * pełnej puli do Firebase.
         *
         * Dzięki temu pustą pulę może
         * obsłużyć getTrackPool().
         */

        renderTrackPool(
          pool
        );

      }
    );


    /* =====================================================
       NASŁUCH COMBO
    ===================================================== */

    onValue(
      combosRef,
      snapshot => {

        currentCombos =
          snapshot.val() ||
          {};


        if (!currentRound) {

          participantCount.textContent =
            "👥 0 osób dodało COMBO";


          return;

        }


        const combos =
          Object.values(
            currentCombos
          )
          .filter(
            combo =>
              combo.roundId ===
              currentRound.id
          );


        participantCount.textContent =
          "👥 " +
          combos.length +
          " osób dodało COMBO";


        const mySavedCombo =
          currentCombos[
            playerId
          ];


        if (
          mySavedCombo &&
          mySavedCombo.roundId ===
            currentRound.id
        ) {

          const myClasses =
            Array.isArray(
              mySavedCombo.classes
            )
              ? mySavedCombo.classes.join(
                  " + "
                )
              : mySavedCombo.classes;


          myCombo.innerHTML = `

            <strong>
              ✅ TWOJE COMBO:
            </strong>

            <br>

            🏁
            ${mySavedCombo.track}

            <br>

            🏎️
            ${myClasses}

            <br>

            🔢
            ${mySavedCombo.laps}
            okr.

            <br>

            🌦️
            ${mySavedCombo.weather}

            <br>

            🌅
            ${mySavedCombo.timeOfDay}

            <br>

            🛞
            ${mySavedCombo.tires}

            <br>

            🔧
            ${mySavedCombo.pit}

            <br>

            ⛽ Paliwo
            ${mySavedCombo.fuel}

            <br>

            🛞 Zużycie opon
            ${mySavedCombo.tireWear}

            <br>

            🚦
            ${mySavedCombo.startType}

            <br>

            ⏱️ Kwalifikacje:
            ${mySavedCombo.qualifying}

            <br>

            ⚖️
            ${mySavedCombo.bop}

          `;

        }


        else {

          myCombo.innerHTML =
            "";

        }

      }
    );


    /* =====================================================
       TIMER
    ===================================================== */

    setInterval(
      () => {

        updateCountdown();


        if (
          currentRound &&
          currentRound.status ===
            "voting" &&
          !roundIsActive()
        ) {

          finishRound();

        }

      },
      1000
    );


  </script>

</body>
</html>
