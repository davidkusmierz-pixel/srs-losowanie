<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SRS LOSOWANIE TORU</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #111214;
      color: #f2f2f2;
      padding: 40px 20px;
    }

    .container {
      max-width: 670px;
      margin: auto;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    h1 {
      margin: 0;
      font-size: 32px;
      letter-spacing: 1px;
    }

    .subtitle {
      margin-top: 8px;
      color: #bdbdbd;
      letter-spacing: 1px;
    }

    .card {
      background: #202124;
      border: 2px solid #36383d;
      border-radius: 20px;
      padding: 40px 20px;
      text-align: center;
      margin-bottom: 22px;
    }

    #trackName {
      font-size: 31px;
      font-weight: bold;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 20px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      background: #ffffff;
      color: #171717;
      transition: transform 0.2s;
    }

    button:hover {
      transform: scale(1.02);
    }

    #message {
      min-height: 30px;
      margin: 22px 0 28px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      color: #ffffff;
    }

    .ranking {
      background: #202124;
      border: 2px solid #36383d;
      border-radius: 20px;
      padding: 25px;
    }

    .ranking h2 {
      text-align: center;
      margin: 0 0 20px;
      font-size: 24px;
    }

    .ranking-item {
      display: flex;
      justify-content: space-between;
      padding: 15px 8px;
      border-bottom: 1px solid #373737;
      font-size: 17px;
    }

    .ranking-item:last-child {
      border-bottom: none;
    }

    .count {
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>🏁 SRS LOSOWANIE TORU</h1>
      <div class="subtitle">SIM RACING SQUAD 🎲</div>
    </div>

    <div class="card">
      <div id="trackName">
        🎲 KLIKNIJ LOSUJ TOR
      </div>
    </div>

    <button id="drawButton">
      🎲 LOSUJ TOR
    </button>

    <div id="message"></div>

    <div class="ranking">
      <h2>🏆 NAJCZĘŚCIEJ LOSOWANE TORY</h2>

      <div id="rankingList">
        Brak losowań.
      </div>
    </div>

  </div>

  <script>

    const tracks = [
      "Trial Mountain Circuit",
      "Deep Forest Raceway",
      "Dragon Trail – Wybrzeże",
      "Red Bull Ring",
      "Suzuka Circuit",
      "Mount Panorama",
      "Laguna Seca",
      "Monza",
      "Spa-Francorchamps",
      "Watkins Glen"
    ];

    const button = document.getElementById("drawButton");
    const trackName = document.getElementById("trackName");
    const message = document.getElementById("message");
    const rankingList = document.getElementById("rankingList");

    // WKLEJ SWÓJ ADRES WEBHOOKA
    const DISCORD_WEBHOOK_URL = "WKLEJ_TUTAJ_ADRES_WEBHOOKA";


    function getRanking() {
      return JSON.parse(
        localStorage.getItem("srsTrackRanking")
      ) || {};
    }


    function updateRanking(track) {

      const ranking = getRanking();

      if (!ranking[track]) {
        ranking[track] = 0;
      }

      ranking[track]++;

      localStorage.setItem(
        "srsTrackRanking",
        JSON.stringify(ranking)
      );

      renderRanking();
    }


    function renderRanking() {

      const ranking = getRanking();

      const sortedRanking =
        Object.entries(ranking)
          .sort((a, b) => b[1] - a[1]);

      if (sortedRanking.length === 0) {

        rankingList.innerHTML =
          "<div class='ranking-item'>Brak losowań.</div>";

        return;
      }

      rankingList.innerHTML = "";

      sortedRanking.forEach((item, index) => {

        const track = item[0];
        const count = item[1];

        const div = document.createElement("div");

        div.className = "ranking-item";

        div.innerHTML = `
          <span>${index + 1}. 🏁 ${track}</span>
          <span class="count">${count}×</span>
        `;

        rankingList.appendChild(div);
      });
    }


    function sendToDiscord(track) {

      if (
        !DISCORD_WEBHOOK_URL ||
        DISCORD_WEBHOOK_URL === "https://discord.com/api/webhooks/1543558910227513385/bzl4FcRUTWUn0J2kpna8VvVU60ITGtiaBTn87MzSzqQBItctf2uPWJ5SzoBaLJO2VWA_"
      ) {
        console.log("Nie ustawiono webhooka.");
        return;
      }

      fetch(DISCORD_WEBHOOK_URL + "?wait=true", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          username: "SRS LOSOWANIE TORU",
          content:
            "🎲 **NOWE LOSOWANIE TORU SRS**\n\n" +
            "🏁 **Wylosowany tor:** **" + track + "**"
        })
      })
      .then(response => {
        if (!response.ok) {
          throw new Error("Błąd Discord: " + response.status);
        }

        console.log("Wynik wysłany na Discord.");
      })
      .catch(error => {
        console.error(error);
      });
    }


    button.addEventListener("click", function () {

      const randomTrack =
        tracks[
          Math.floor(Math.random() * tracks.length)
        ];

      trackName.textContent =
        "🏆 " + randomTrack;

      message.textContent =
        "🎉 TOR ZOSTAŁ WYLOSOWANY!";

      updateRanking(randomTrack);

      sendToDiscord(randomTrack);
    });


    renderRanking();

  </script>

</body>
</html>
