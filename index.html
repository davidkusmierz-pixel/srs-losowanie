<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SRS COMBO</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #0b0b0b;
  color: #fff;
}

.container {
  max-width: 900px;
  margin: 0 auto;
  padding: 25px 15px 50px;
}

h1 {
  text-align: center;
  margin-bottom: 25px;
  font-size: 30px;
}

.card {
  background: #151515;
  border: 1px solid #2d2d2d;
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 18px;
  box-shadow: 0 4px 20px rgba(0,0,0,.25);
}

.card h2 {
  margin-top: 0;
  font-size: 20px;
}

input,
select {
  width: 100%;
  padding: 12px;
  background: #0d0d0d;
  border: 1px solid #3a3a3a;
  border-radius: 8px;
  color: #fff;
  margin-bottom: 10px;
  font-size: 15px;
}

button {
  border: none;
  border-radius: 8px;
  padding: 12px 16px;
  margin: 4px;
  cursor: pointer;
  font-weight: bold;
  color: #fff;
  background: #9b111e;
  transition: .2s;
}

button:hover {
  background: #c41627;
}

button:disabled {
  opacity: .45;
  cursor: not-allowed;
}

.admin-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 8px;
}

.admin-buttons button {
  flex: 1;
  min-width: 160px;
}

.stop-btn {
  background: #6b1118;
}

.resume-btn {
  background: #176b35;
}

.resume-btn:hover {
  background: #218a46;
}

.secondary-btn {
  background: #333;
}

.secondary-btn:hover {
  background: #444;
}

.status {
  text-align: center;
  font-size: 22px;
  font-weight: bold;
}

.countdown {
  text-align: center;
  font-size: 34px;
  margin: 12px 0;
  font-weight: bold;
}

.info {
  text-align: center;
  color: #aaa;
}

.pool-count {
  text-align: center;
  font-size: 28px;
  font-weight: bold;
  margin: 10px 0;
}

.pool-list {
  max-height: 350px;
  overflow-y: auto;
}

.track-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #0d0d0d;
  border: 1px solid #292929;
  padding: 10px 12px;
  border-radius: 7px;
  margin-bottom: 6px;
}

.track-item button {
  padding: 7px 10px;
  margin: 0;
  font-size: 12px;
}

.group-buttons {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

.group-btn {
  margin: 0;
  background: #252525;
  border: 1px solid #444;
}

.group-btn.selected {
  background: #9b111e;
  border-color: #c41627;
}

.result {
  text-align: center;
  padding: 20px;
  border: 1px solid #3a3a3a;
  border-radius: 10px;
  background: #0d0d0d;
}

.result .track {
  font-size: 25px;
  font-weight: bold;
  margin-top: 10px;
}

.hidden {
  display: none !important;
}

.message {
  margin-top: 10px;
  text-align: center;
  color: #aaa;
}

.success {
  color: #45d477;
}

.error {
  color: #ff5964;
}

.warning {
  color: #ffc857;
}

.date-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

@media(max-width:600px) {
  .group-buttons {
    grid-template-columns: repeat(2, 1fr);
  }

  .date-row {
    grid-template-columns: 1fr;
  }

  .admin-buttons {
    flex-direction: column;
  }
}
</style>
</head>

<body>

<div class="container">

  <h1>🏁 SRS COMBO</h1>

  <!-- ========================= -->
  <!-- PANEL ADMINA -->
  <!-- ========================= -->

  <div class="card">

    <h2>🔐 Panel administratora</h2>

    <input
      type="password"
      id="adminPin"
      placeholder="Wpisz hasło administratora"
    >

    <div class="admin-buttons">

      <button id="newComboBtn">
        🆕 NOWE COMBO
      </button>

      <button id="stopBtn" class="stop-btn">
        ⏸️ STOP
      </button>

      <button id="resumeBtn" class="resume-btn">
        ▶️ WZNÓW
      </button>

      <button id="changeDateBtn" class="secondary-btn">
        📅 ZMIEŃ DATĘ I GODZINĘ
      </button>

    </div>

    <div id="adminInfo" class="message"></div>

  </div>


  <!-- ========================= -->
  <!-- STATUS -->
  <!-- ========================= -->

  <div class="card">

    <h2>📊 Status COMBO</h2>

    <div id="phaseStatus" class="status">
      Brak aktywnego COMBO
    </div>

    <div id="countdown" class="countdown">
      --
    </div>

    <div id="phaseInfo" class="info">
      Utwórz nowe COMBO
    </div>

    <div class="pool-count">
      Torów w puli: <span id="poolCount">0</span>
    </div>

  </div>


  <!-- ========================= -->
  <!-- TERMIN -->
  <!-- ========================= -->

  <div id="dateSection" class="card hidden">

    <h2>📅 Termin COMBO</h2>

    <div class="date-row">

      <div>
        <label>Data</label>
        <input type="date" id="comboDate">
      </div>

      <div>
        <label>Godzina</label>
        <input type="time" id="comboTime">
      </div>

    </div>

    <button id="saveDateBtn">
      💾 ZAPISZ TERMIN
    </button>

  </div>


  <!-- ========================= -->
  <!-- DODAWANIE TORÓW -->
  <!-- ========================= -->

  <div id="addTrackSection" class="card hidden">

    <h2>➕ Dodaj tor do puli</h2>

    <select id="trackSelect">
      <option value="">-- wybierz tor --</option>
    </select>

    <button id="addTrackBtn">
      ➕ DODAJ TOR
    </button>

    <div id="trackMessage" class="message"></div>

  </div>


  <!-- ========================= -->
  <!-- PULA TORÓW -->
  <!-- ========================= -->

  <div class="card">

    <h2>🏁 Aktualna pula torów</h2>

    <div id="poolList" class="pool-list">
      <div class="message">
        Pula jest pusta.
      </div>
    </div>

  </div>


  <!-- ========================= -->
  <!-- GŁOSOWANIE -->
  <!-- ========================= -->

  <div id="votingSection" class="card hidden">

    <h2>🎯 Wybierz grupę</h2>

    <div class="group-buttons">

      <button class="group-btn" data-group="Gr.1">
        Gr.1
      </button>

      <button class="group-btn" data-group="Gr.2">
        Gr.2
      </button>

      <button class="group-btn" data-group="Gr.3">
        Gr.3
      </button>

      <button class="group-btn" data-group="Gr.4">
        Gr.4
      </button>

    </div>

    <button id="drawBtn" disabled>
      🎲 LOSUJ
    </button>

    <div id="drawResult" class="result hidden">

      <div>Wylosowana grupa:</div>

      <div id="drawnGroup" class="track"></div>

      <div style="margin-top:15px;">
        Wylosowany tor:
      </div>

      <div id="drawnTrack" class="track"></div>

    </div>

  </div>


  <!-- ========================= -->
  <!-- WYNIK OFICJALNY -->
  <!-- ========================= -->

  <div id="officialResult" class="card hidden">

    <h2>🏆 Oficjalny wynik COMBO</h2>

    <div class="result">

      <div>Grupa</div>

      <div id="officialGroup" class="track"></div>

      <div style="margin-top:15px;">
        Tor
      </div>

      <div id="officialTrack" class="track"></div>

    </div>

  </div>

</div>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
  getDatabase,
  ref,
  set,
  get,
  remove,
  onValue,
  push
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


/* ==================================================
   FIREBASE
================================================== */

const firebaseConfig = {
  apiKey: "AIzaSyDRDAiSlJBPOG8N_c4ctBRLYrwx3ER5rKw",
  authDomain: "srs-losowanie.firebaseapp.com",
  databaseURL: "https://srs-losowanie-default-rtdb.firebaseio.com",
  projectId: "srs-losowanie",
  storageBucket: "srs-losowanie.firebasestorage.app",
  messagingSenderId: "212959687651",
  appId: "1:212959687651:web:0a9a5e647450767bc026d6"
};

const app = initializeApp(firebaseConfig);
const database = getDatabase(app);


/* ==================================================
   USTAWIENIA
================================================== */

const ADMIN_PIN = "840416";

const WEEK = 7 * 24 * 60 * 60 * 1000;


/* ==================================================
   TORY
================================================== */

const tracks = [

  "Autodrome Lago Maggiore - Full Course",
  "Autopolis - Full Course",
  "Blue Moon Bay Speedway",
  "Brands Hatch Grand Prix Circuit",
  "Circuit de Barcelona-Catalunya",
  "Circuit de la Sarthe",
  "Circuit de Spa-Francorchamps",
  "Daytona International Speedway - Road Course",
  "Deep Forest Raceway",
  "Dragon Trail - Seaside",
  "Fuji International Speedway",
  "Goodwood Motor Circuit",
  "Grand Valley - Highway 1",
  "High Speed Ring",
  "Interlagos",
  "Kyoto Driving Park - Yamagiwa",
  "Monza Circuit",
  "Mount Panorama",
  "Nürburgring GP",
  "Nürburgring Nordschleife",
  "Nürburgring 24h",
  "Red Bull Ring",
  "Road Atlanta",
  "Sardegna - Road Track A",
  "Sardegna - Windmills",
  "Suzuka Circuit",
  "Tokyo Expressway - South",
  "Trial Mountain Circuit",
  "Watkins Glen Long Course",
  "WeatherTech Raceway Laguna Seca"

];


/* ==================================================
   REFERENCJE FIREBASE
================================================== */

const comboRef = ref(database, "srsCombo");
const poolRef = ref(database, "srsComboPool");
const votesRef = ref(database, "srsComboVotes");


/* ==================================================
   ZMIENNE
================================================== */

let currentCombo = null;
let currentPool = {};

let selectedGroup = null;
let finishingCombo = false;


/* ==================================================
   PLAYER ID
================================================== */

let playerId = localStorage.getItem("srsPlayerId");

if (!playerId) {

  playerId =
    "player_" +
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .substring(2, 10);

  localStorage.setItem("srsPlayerId", playerId);
}


/* ==================================================
   ELEMENTY
================================================== */

const adminPin = document.getElementById("adminPin");

const newComboBtn = document.getElementById("newComboBtn");
const stopBtn = document.getElementById("stopBtn");
const resumeBtn = document.getElementById("resumeBtn");
const changeDateBtn = document.getElementById("changeDateBtn");

const adminInfo = document.getElementById("adminInfo");

const phaseStatus = document.getElementById("phaseStatus");
const countdown = document.getElementById("countdown");
const phaseInfo = document.getElementById("phaseInfo");

const poolCount = document.getElementById("poolCount");
const poolList = document.getElementById("poolList");

const addTrackSection = document.getElementById("addTrackSection");
const trackSelect = document.getElementById("trackSelect");
const addTrackBtn = document.getElementById("addTrackBtn");
const trackMessage = document.getElementById("trackMessage");

const dateSection = document.getElementById("dateSection");
const comboDate = document.getElementById("comboDate");
const comboTime = document.getElementById("comboTime");
const saveDateBtn = document.getElementById("saveDateBtn");

const votingSection = document.getElementById("votingSection");

const drawBtn = document.getElementById("drawBtn");
const drawResult = document.getElementById("drawResult");

const drawnGroup = document.getElementById("drawnGroup");
const drawnTrack = document.getElementById("drawnTrack");

const officialResult = document.getElementById("officialResult");
const officialGroup = document.getElementById("officialGroup");
const officialTrack = document.getElementById("officialTrack");


/* ==================================================
   LISTA TORÓW
================================================== */

tracks.forEach(track => {

  const option = document.createElement("option");

  option.value = track;
  option.textContent = track;

  trackSelect.appendChild(option);

});


/* ==================================================
   SPRAWDZANIE ADMINA
================================================== */

function isAdmin() {

  return adminPin.value === ADMIN_PIN;

}


function requireAdmin() {

  if (!isAdmin()) {

    adminInfo.textContent =
      "❌ Nieprawidłowe hasło administratora.";

    adminInfo.className =
      "message error";

    return false;
  }

  return true;
}


/* ==================================================
   NOWE COMBO
================================================== */

newComboBtn.addEventListener("click", async () => {

  if (!requireAdmin()) return;

  const confirmation = confirm(
    "Utworzenie NOWEGO COMBO usunie całą aktualną pulę torów i rozpocznie nowe COMBO.\n\nCzy na pewno?"
  );

  if (!confirmation) return;


  try {

    await remove(poolRef);
    await remove(votesRef);


    const now = new Date();

    const defaultStart =
      now.getTime() + 5 * 60 * 1000;


    const combo = {

      id: "combo_" + Date.now(),

      status: "active",

      startTime: defaultStart,

      nextStartTime: defaultStart,

      repeatWeekly: true,

      winnerGroup: null,

      winnerTrack: null,

      finishedAt: null,

      createdAt: Date.now()

    };


    await set(comboRef, combo);


    adminInfo.textContent =
      "✅ Utworzono nowe COMBO. Pula została wyczyszczona.";

    adminInfo.className =
      "message success";


    dateSection.classList.remove("hidden");
    addTrackSection.classList.remove("hidden");


  } catch (error) {

    console.error(error);

    adminInfo.textContent =
      "❌ Wystąpił błąd podczas tworzenia COMBO.";

    adminInfo.className =
      "message error";

  }

});


/* ==================================================
   STOP
================================================== */

stopBtn.addEventListener("click", async () => {

  if (!requireAdmin()) return;

  if (!currentCombo) {

    adminInfo.textContent =
      "Brak aktywnego COMBO.";

    return;
  }


  if (currentCombo.status === "stopped") {

    adminInfo.textContent =
      "COMBO jest już zatrzymane.";

    return;
  }


  await set(
    comboRef,
    {
      ...currentCombo,
      status: "stopped",
      stoppedAt: Date.now()
    }
  );


  adminInfo.textContent =
    "⏸️ COMBO zostało zatrzymane.";

  adminInfo.className =
    "message warning";

});


/* ==================================================
   WZNÓW
================================================== */

resumeBtn.addEventListener("click", async () => {

  if (!requireAdmin()) return;

  if (!currentCombo) {

    adminInfo.textContent =
      "Brak COMBO.";

    return;
  }


  if (currentCombo.status !== "stopped") {

    adminInfo.textContent =
      "COMBO nie jest zatrzymane.";

    return;
  }


  await set(
    comboRef,
    {
      ...currentCombo,
      status: "active",
      resumedAt: Date.now()
    }
  );


  adminInfo.textContent =
    "▶️ COMBO zostało wznowione.";

  adminInfo.className =
    "message success";

});


/* ==================================================
   ZMIANA DATY I GODZINY
================================================== */

changeDateBtn.addEventListener("click", () => {

  if (!requireAdmin()) return;

  if (!currentCombo) {

    adminInfo.textContent =
      "Najpierw utwórz COMBO.";

    return;
  }


  const date =
    new Date(
      currentCombo.nextStartTime ||
      currentCombo.startTime
    );


  const year =
    date.getFullYear();

  const month =
    String(date.getMonth() + 1)
      .padStart(2, "0");

  const day =
    String(date.getDate())
      .padStart(2, "0");

  const hours =
    String(date.getHours())
      .padStart(2, "0");

  const minutes =
    String(date.getMinutes())
      .padStart(2, "0");


  comboDate.value =
    `${year}-${month}-${day}`;

  comboTime.value =
    `${hours}:${minutes}`;


  dateSection.classList.remove("hidden");

  dateSection.scrollIntoView({
    behavior: "smooth"
  });

});


/* ==================================================
   ZAPIS DATY
================================================== */

saveDateBtn.addEventListener("click", async () => {

  if (!requireAdmin()) return;

  if (!comboDate.value || !comboTime.value) {

    adminInfo.textContent =
      "Wybierz datę i godzinę.";

    adminInfo.className =
      "message error";

    return;
  }


  const newDate =
    new Date(
      `${comboDate.value}T${comboTime.value}`
    );


  if (isNaN(newDate.getTime())) {

    adminInfo.textContent =
      "Nieprawidłowa data.";

    return;
  }


  await set(
    comboRef,
    {
      ...currentCombo,

      nextStartTime:
        newDate.getTime(),

      startTime:
        newDate.getTime()
    }
  );


  adminInfo.textContent =
    "✅ Data i godzina zostały zmienione.";

  adminInfo.className =
    "message success";


  dateSection.classList.add("hidden");

});


/* ==================================================
   DODAWANIE TORU
================================================== */

addTrackBtn.addEventListener("click", async () => {

  if (!requireAdmin()) return;

  const track =
    trackSelect.value;


  if (!track) {

    trackMessage.textContent =
      "Wybierz tor.";

    trackMessage.className =
      "message error";

    return;
  }


  /* sprawdzenie czy tor już istnieje */

  const existing =
    Object.values(currentPool)
      .some(item =>
        item.track === track
      );


  if (existing) {

    trackMessage.textContent =
      "⚠️ Ten tor jest już w puli.";

    trackMessage.className =
      "message warning";

    return;
  }


  const newTrackRef =
    push(poolRef);


  await set(
    newTrackRef,
    {
      track: track,
      addedAt: Date.now()
    }
  );


  trackSelect.value = "";

  trackMessage.textContent =
    "✅ Tor został dodany do puli.";

  trackMessage.className =
    "message success";

});


/* ==================================================
   USUWANIE TORU Z PULI
================================================== */

async function removeTrack(key) {

  if (!requireAdmin()) return;

  const confirmation =
    confirm(
      "Czy na pewno usunąć ten tor z puli?"
    );

  if (!confirmation) return;

  await remove(
    ref(database, "srsComboPool/" + key)
  );

}


/* ==================================================
   RENDER PULI
================================================== */

function renderPool() {

  const entries =
    Object.entries(currentPool);


  poolCount.textContent =
    entries.length;


  poolList.innerHTML = "";


  if (entries.length === 0) {

    poolList.innerHTML =
      `<div class="message">
        Pula jest pusta.
      </div>`;

    return;
  }


  entries.forEach(([key, item]) => {

    const div =
      document.createElement("div");

    div.className =
      "track-item";


    const name =
      document.createElement("span");

    name.textContent =
      item.track;


    const removeBtn =
      document.createElement("button");

    removeBtn.textContent =
      "🗑️";

    removeBtn.className =
      "secondary-btn";


    removeBtn.addEventListener(
      "click",
      () => removeTrack(key)
    );


    div.appendChild(name);
    div.appendChild(removeBtn);

    poolList.appendChild(div);

  });

}


/* ==================================================
   SPRAWDZENIE GŁOSU
================================================== */

async function playerAlreadyVoted() {

  if (!currentCombo) return false;


  const snapshot =
    await get(votesRef);


  if (!snapshot.exists())
    return false;


  const votes =
    snapshot.val();


  return Object.values(votes)
    .some(vote =>
      vote.playerId === playerId &&
      vote.comboId === currentCombo.id
    );

}


/* ==================================================
   WYBÓR GRUPY
================================================== */

document
  .querySelectorAll(".group-btn")
  .forEach(button => {

    button.addEventListener(
      "click",
      async () => {

        if (!currentCombo) return;

        if (currentCombo.status !== "active")
          return;


        if (
          Date.now() <
          currentCombo.nextStartTime
        )
          return;


        if (
          currentCombo.winnerTrack
        )
          return;


        const already =
          await playerAlreadyVoted();


        if (already) {

          alert(
            "Twój głos został już zapisany."
          );

          return;
        }


        document
          .querySelectorAll(".group-btn")
          .forEach(btn =>
            btn.classList.remove("selected")
          );


        button.classList.add("selected");

        selectedGroup =
          button.dataset.group;


        drawBtn.disabled = false;

      }
    );

  });


/* ==================================================
   LOSOWANIE
================================================== */

drawBtn.addEventListener(
  "click",
  async () => {

    if (!currentCombo)
      return;


    if (
      currentCombo.status !== "active"
    )
      return;


    if (
      Date.now() <
      currentCombo.nextStartTime
    )
      return;


    if (!selectedGroup)
      return;


    const already =
      await playerAlreadyVoted();


    if (already) {

      alert(
        "Twój głos został już zapisany."
      );

      return;
    }


    const entries =
      Object.entries(currentPool);


    if (entries.length === 0) {

      alert(
        "Pula torów jest pusta."
      );

      return;
    }


    drawBtn.disabled = true;

    finishingCombo = true;


    /* zapis głosu */

    const voteRef =
      push(votesRef);


    await set(
      voteRef,
      {
        playerId: playerId,

        comboId:
          currentCombo.id,

        group:
          selectedGroup,

        time:
          Date.now()
      }
    );


    /* animacja */

    let animationCount = 0;


    const animation =
      setInterval(() => {

        const random =
          entries[
            Math.floor(
              Math.random() *
              entries.length
            )
          ];


        drawnTrack.textContent =
          random[1].track;

        drawnGroup.textContent =
          selectedGroup;


        drawResult.classList.remove(
          "hidden"
        );


        animationCount++;


        if (animationCount >= 25) {

          clearInterval(animation);

          finishCombo();

        }

      }, 70);

  }
);


/* ==================================================
   ZAKOŃCZENIE COMBO
================================================== */

async function finishCombo() {

  if (!currentCombo)
    return;


  const poolEntries =
    Object.entries(currentPool);


  if (poolEntries.length === 0)
    return;


  /*
    W tej wersji każdy użytkownik wybiera grupę,
    a tor jest losowany z aktualnej puli.
  */


  const randomEntry =
    poolEntries[
      Math.floor(
        Math.random() *
        poolEntries.length
      )
    ];


  const key =
    randomEntry[0];

  const track =
    randomEntry[1].track;


  drawnGroup.textContent =
    selectedGroup;

  drawnTrack.textContent =
    track;


  /*
    Usuwamy wylosowany tor z puli.
  */

  await remove(
    ref(
      database,
      "srsComboPool/" + key
    )
  );


  /*
    Następny termin = +7 dni
  */

  const currentStart =
    currentCombo.nextStartTime ||
    Date.now();


  const nextStart =
    currentStart + WEEK;


  const finishedCombo = {

    ...currentCombo,

    status: "active",

    winnerGroup:
      selectedGroup,

    winnerTrack:
      track,

    finishedAt:
      Date.now(),

    nextStartTime:
      nextStart,

    startTime:
      nextStart

  };


  await set(
    comboRef,
    finishedCombo
  );


  officialGroup.textContent =
    selectedGroup;

  officialTrack.textContent =
    track;


  officialResult.classList.remove(
    "hidden"
  );


  finishingCombo = false;


  selectedGroup = null;


  document
    .querySelectorAll(".group-btn")
    .forEach(btn =>
      btn.classList.remove("selected")
    );


  drawBtn.disabled = true;

}


/* ==================================================
   RENDER COMBO
================================================== */

function renderCombo() {

  if (!currentCombo) {

    phaseStatus.textContent =
      "Brak aktywnego COMBO";

    countdown.textContent =
      "--";

    phaseInfo.textContent =
      "Utwórz nowe COMBO.";

    votingSection.classList.add(
      "hidden"
    );

    officialResult.classList.add(
      "hidden"
    );

    return;
  }


  const now =
    Date.now();


  if (
    currentCombo.status ===
    "stopped"
  ) {

    phaseStatus.textContent =
      "⏸️ COMBO ZATRZYMANE";

    countdown.textContent =
      "--";

    phaseInfo.textContent =
      "COMBO jest zatrzymane. Pula torów pozostaje zachowana.";

    votingSection.classList.add(
      "hidden"
    );

    return;
  }


  const start =
    currentCombo.nextStartTime ||
    currentCombo.startTime;


  if (now < start) {

    phaseStatus.textContent =
      "⏳ OCZEKIWANIE NA COMBO";

    countdown.textContent =
      formatCountdown(start - now);

    phaseInfo.textContent =
      "Następne COMBO rozpocznie się: " +
      formatDate(start);

    votingSection.classList.add(
      "hidden"
    );

  } else {

    phaseStatus.textContent =
      "🟢 COMBO AKTYWNE";

    countdown.textContent =
      "TRWA";

    phaseInfo.textContent =
      "Wybierz grupę i oddaj swój głos.";

    if (
      currentCombo.winnerTrack
    ) {

      votingSection.classList.add(
        "hidden"
      );

    } else {

      votingSection.classList.remove(
        "hidden"
      );

    }

  }


  if (
    currentCombo.winnerTrack
  ) {

    officialResult.classList.remove(
      "hidden"
    );

    officialGroup.textContent =
      currentCombo.winnerGroup;

    officialTrack.textContent =
      currentCombo.winnerTrack;

  }

}


/* ==================================================
   FORMAT CZASU
================================================== */

function formatCountdown(ms) {

  if (ms <= 0)
    return "00:00:00";


  const totalSeconds =
    Math.floor(ms / 1000);


  const days =
    Math.floor(
      totalSeconds / 86400
    );


  const hours =
    Math.floor(
      (totalSeconds % 86400) / 3600
    );


  const minutes =
    Math.floor(
      (totalSeconds % 3600) / 60
    );


  const seconds =
    totalSeconds % 60;


  if (days > 0) {

    return (
      days + "d " +
      String(hours).padStart(2, "0") + ":" +
      String(minutes).padStart(2, "0") + ":" +
      String(seconds).padStart(2, "0")
    );

  }


  return (
    String(hours).padStart(2, "0") + ":" +
    String(minutes).padStart(2, "0") + ":" +
    String(seconds).padStart(2, "0")
  );

}


function formatDate(timestamp) {

  const date =
    new Date(timestamp);


  return date.toLocaleString(
    "pl-PL",
    {
      dateStyle: "short",
      timeStyle: "short"
    }
  );

}


/* ==================================================
   FIREBASE - COMBO
================================================== */

onValue(
  comboRef,
  snapshot => {

    currentCombo =
      snapshot.exists()
        ? snapshot.val()
        : null;


    renderCombo();

  }
);


/* ==================================================
   FIREBASE - PULA
================================================== */

onValue(
  poolRef,
  snapshot => {

    currentPool =
      snapshot.exists()
        ? snapshot.val()
        : {};


    renderPool();

  }
);


/* ==================================================
   TIMER
================================================== */

setInterval(
  () => {

    renderCombo();

  },
  1000
);


/* ==================================================
   POKAZYWANIE PANELU PO HAŚLE
================================================== */

adminPin.addEventListener(
  "input",
  () => {

    if (isAdmin()) {

      addTrackSection.classList.remove(
        "hidden"
      );

      adminInfo.textContent =
        "🔓 Dostęp administratora aktywny.";

      adminInfo.className =
        "message success";

    } else {

      addTrackSection.classList.add(
        "hidden"
      );

      dateSection.classList.add(
        "hidden"
      );

      adminInfo.textContent = "";

    }

  }
);


/* ==================================================
   START
================================================== */

renderPool();
renderCombo();

</script>
