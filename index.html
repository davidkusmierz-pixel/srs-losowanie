<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SRS LOSOWANIE TORU</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #111214;
      color: white;
      padding: 25px 15px;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    h1 {
      margin: 0;
      font-size: 32px;
    }

    .subtitle {
      margin-top: 8px;
      color: #bdbdbd;
      font-size: 14px;
      letter-spacing: 2px;
    }

    .card {
      background: #202124;
      border: 2px solid #3b3d42;
      border-radius: 20px;
      padding: 35px 20px;
      text-align: center;
      margin-bottom: 18px;
      min-height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #trackName {
      font-size: 30px;
      font-weight: bold;
      line-height: 1.3;
    }

    #drawButton {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 20px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      background: white;
      color: #111;
      transition: 0.2s;
    }

    #drawButton:hover {
      transform: scale(1.02);
    }

    #drawButton:active {
      transform: scale(0.98);
    }

    #drawButton:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    #message {
      min-height: 35px;
      padding: 18px 10px;
      text-align: center;
      font-size: 17px;
      font-weight: bold;
    }

    .ranking {
      background: #202124;
      border: 2px solid #3b3d42;
      border-radius: 20px;
      padding: 25px;
    }

    .ranking h2 {
      text-align: center;
      margin: 0 0 20px;
      font-size: 22px;
    }

    .ranking-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      padding: 15px 8px;
      border-bottom: 1px solid #393b40;
      font-size: 16px;
    }

    .ranking-item:last-child {
      border-bottom: none;
    }

    .track-title {
      flex: 1;
    }

    .count {
      font-weight: bold;
      white-space: nowrap;
    }

    .empty {
      text-align: center;
      color: #aaaaaa;
      padding: 15px;
    }

    @media (max-width: 500px) {
      h1 {
        font-size: 26px;
      }

      #trackName {
        font-size: 24px;
      }

      .ranking-item {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>🏁 SRS LOSOWANIE TORU</h1>
      <div class="subtitle">SIM RACING SQUAD 🎲</div>
    </div>

    <div class="card">
      <div id="trackName">
        🎲 KLIKNIJ PRZYCISK, ABY WYLOSOWAĆ TOR
      </div>
    </div>

    <button id="drawButton" type="button">
      🎲 LOSUJ TOR
    </button>

    <div id="message"></div>

    <div class="ranking">
      <h2>🏆 NAJCZĘŚCIEJ LOSOWANE TORY</h2>

      <div id="rankingList"></div>
    </div>

  </div>

  <script>

    const tracks = [
      "Trial Mountain Circuit",
      "Deep Forest Raceway",
      "Dragon Trail – Wybrzeże",
      "Red Bull Ring",
      "Suzuka Circuit",
      "Mount Panorama",
      "WeatherTech Raceway Laguna Seca",
      "Autodromo Nazionale Monza",
      "Spa-Francorchamps",
      "Watkins Glen"
    ];

    const button = document.getElementById("drawButton");
    const trackName = document.getElementById("trackName");
    const message = document.getElementById("message");
    const rankingList = document.getElementById("rankingList");

    let isDrawing = false;


    function getRanking() {

      try {
        return JSON.parse(
          localStorage.getItem("srsTrackRanking")
        ) || {};
      } catch (error) {
        return {};
      }

    }


    function updateRanking(track) {

      const ranking = getRanking();

      if (!ranking[track]) {
        ranking[track] = 0;
      }

      ranking[track]++;

      localStorage.setItem(
        "srsTrackRanking",
        JSON.stringify(ranking)
      );

    }


    function renderRanking() {

      const ranking = getRanking();

      const sortedRanking = Object.entries(ranking)
        .sort((a, b) => b[1] - a[1]);

      if (sortedRanking.length === 0) {

        rankingList.innerHTML =
          "<div class='empty'>🎲 Brak losowań. Czas wylosować pierwszy tor!</div>";

        return;
      }

      rankingList.innerHTML = "";

      sortedRanking.forEach((item, index) => {

        const track = item[0];
        const count = item[1];

        const div = document.createElement("div");

        div.className = "ranking-item";

        div.innerHTML =
          "<span class='track-title'>" +
          (index + 1) +
          ". 🏁 " +
          track +
          "</span>" +
          "<span class='count'>" +
          count +
          "×</span>";

        rankingList.appendChild(div);

      });

    }


    function drawTrack() {

      if (isDrawing) {
        return;
      }

      isDrawing = true;

      button.disabled = true;

      button.textContent = "🎲 LOSOWANIE...";

      message.textContent = "🎰 LOSOWANIE TORU...";

      let counter = 0;

      const animation = setInterval(function () {

        const randomTrack =
          tracks[Math.floor(Math.random() * tracks.length)];

        trackName.textContent = "🎲 " + randomTrack;

        counter++;

        if (counter >= 15) {

          clearInterval(animation);

          const finalTrack =
            tracks[Math.floor(Math.random() * tracks.length)];

          trackName.textContent = "🏆 " + finalTrack;

          message.textContent =
            "🎉 TOR ZOSTAŁ WYLOSOWANY!";

          updateRanking(finalTrack);

          renderRanking();

          button.disabled = false;

          button.textContent = "🎲 LOSUJ TOR";

          isDrawing = false;

        }

      }, 100);

    }


    button.addEventListener("click", drawTrack);


    renderRanking();

  </script>

</body>
</html>
