<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SRS LOBBY COMBO</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #090909;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin: 5px 0 5px;
      color: #e60000;
      font-size: 32px;
      letter-spacing: 1px;
    }

    .subtitle {
      text-align: center;
      color: #999;
      margin-bottom: 25px;
    }

    .card {
      background: #111;
      border: 1px solid #292929;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 8px 25px rgba(0,0,0,.35);
    }

    .card h2 {
      margin-top: 0;
      color: #e60000;
      font-size: 20px;
    }

    label.title {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #ddd;
    }

    select,
    input[type="text"],
    input[type="number"],
    input[type="datetime-local"] {
      width: 100%;
      background: #191919;
      color: white;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 12px;
      outline: none;
      font-size: 15px;
    }

    select:focus,
    input:focus {
      border-color: #e60000;
    }

    .field {
      margin-bottom: 15px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .class-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .class-btn {
      background: #1a1a1a;
      border: 1px solid #333;
      color: #ddd;
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: .15s;
    }

    .class-btn:hover {
      border-color: #e60000;
    }

    .class-btn.selected {
      background: #b90000;
      border-color: #e60000;
      color: white;
    }

    .tire-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 8px;
    }

    .tire-option {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 11px;
      background: #181818;
      border: 1px solid #333;
      border-radius: 8px;
      cursor: pointer;
      transition: .15s;
    }

    .tire-option.selected {
      border-color: #e60000;
      background: #2a0b0b;
    }

    .tire-option input {
      accent-color: #e60000;
    }

    .tire-info {
      color: #777;
      font-size: 14px;
      padding: 8px 0;
    }

    button.main-btn {
      width: 100%;
      padding: 14px;
      background: #d00000;
      color: white;
      border: none;
      border-radius: 9px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    button.main-btn:hover {
      background: #f00000;
    }

    button.main-btn:disabled {
      background: #444;
      cursor: not-allowed;
    }

    .admin-box {
      border: 1px solid #333;
      background: #0d0d0d;
    }

    .error {
      display: none;
      background: #3b0808;
      border: 1px solid #b00000;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      color: #ffb0b0;
    }

    .success {
      display: none;
      background: #073b16;
      border: 1px solid #0c8b34;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      color: #baffc9;
    }

    .status {
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .countdown {
      text-align: center;
      color: #e60000;
      font-size: 28px;
      font-weight: bold;
      margin: 10px 0;
    }

    .result {
      display: none;
    }

    .result-header {
      text-align: center;
      margin-bottom: 18px;
    }

    .result-header h2 {
      color: #e60000;
      margin-bottom: 5px;
    }

    .result-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .result-item {
      background: #191919;
      border: 1px solid #292929;
      border-radius: 8px;
      padding: 12px;
    }

    .result-item.full {
      grid-column: 1 / -1;
    }

    .result-label {
      color: #777;
      font-size: 12px;
      margin-bottom: 5px;
    }

    .result-value {
      font-weight: bold;
      color: white;
      word-break: break-word;
    }

    .discord-btn {
      background: #5865F2 !important;
      margin-top: 15px !important;
    }

    .discord-btn:hover {
      background: #4752c4 !important;
    }

    .footer {
      text-align: center;
      color: #555;
      font-size: 12px;
      margin-top: 25px;
      padding-bottom: 20px;
    }

    @media (max-width: 650px) {
      .grid,
      .result-grid {
        grid-template-columns: 1fr;
      }

      .tire-group {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

    <button id="saveComboBtn" class="main-btn">

  </div>

  <!-- ADMIN -->

<!-- FIREBASE -->
<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getDatabase,
    ref,
    set,
    push,
    onValue,
    get
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


  /* ============================================================
     FIREBASE
     ============================================================ */

  const firebaseConfig = {
    apiKey: "AIzaSyDRDAiSlJBPOG8N_c4ctBRLYrwx3ER5rKw",
    authDomain: "srs-losowanie.firebaseapp.com",
    databaseURL: "https://srs-losowanie-default-rtdb.firebaseio.com",
    projectId: "srs-losowanie",
    storageBucket: "srs-losowanie.firebasestorage.app",
    messagingSenderId: "212959687651",
    appId: "1:212959687651:web:0a9a5e647450767bc026d6"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);


  /* ============================================================
     USTAWIENIA
     ============================================================ */

  const ADMIN_PIN = "840416";

  const ROUND_TIME = 5 * 60 * 1000;

  /*
     W TYM MIEJSCU WKLEJ WEBHOOK DISCORDA
  */

  const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1543742170157158550/pRsAgoyhhswi7kD57RFc1wERkVtLNlsgky7BI-JoYq7sTmWwMo5brD_kVf7Wa7PWWwmz";


  /* ============================================================
     REFERENCJE FIREBASE
     ============================================================ */

  const roundRef = ref(db, "srsLobbyRound");
  const combosRef = ref(db, "srsLobbyCombos");


  /* ============================================================
     PLAYER ID
     ============================================================ */

  let playerId = localStorage.getItem("srsLobbyPlayerId");

  if (!playerId) {
    playerId =
      Date.now().toString(36) +
      Math.random().toString(36).substring(2);

    localStorage.setItem("srsLobbyPlayerId", playerId);
  }


  /* ============================================================
     ZMIENNE
     ============================================================ */

  let currentRound = null;
  let currentWinner = null;
  let selectedClasses = [];


  /* ============================================================
     OPONY
     ============================================================ */

  const tireDefinitions = {

    Comfort: [
      {
        value: "CH – Comfort Hard",
        label: "CH – Comfort Hard"
      },
      {
        value: "CM – Comfort Medium",
        label: "CM – Comfort Medium"
      },
      {
        value: "CS – Comfort Soft",
        label: "CS – Comfort Soft"
      }
    ],

    Sport: [
      {
        value: "SH – Sport Hard",
        label: "SH – Sport Hard"
      },
      {
        value: "SM – Sport Medium",
        label: "SM – Sport Medium"
      },
      {
        value: "SS – Sport Soft",
        label: "SS – Sport Soft"
      }
    ],

    Racing: [
      {
        value: "RH – Racing Hard",
        label: "RH – Racing Hard"
      },
      {
        value: "RM – Racing Medium",
        label: "RM – Racing Medium"
      },
      {
        value: "RS – Racing Soft",
        label: "RS – Racing Soft"
      }
    ]

  };


  /* ============================================================
     ELEMENTY
     ============================================================ */

  const errorBox =
    document.getElementById("errorBox");

  const successBox =
    document.getElementById("successBox");

  const roundStatus =
    document.getElementById("roundStatus");

  const countdown =
    document.getElementById("countdown");

  const resultCard =
    document.getElementById("resultCard");

  const resultContent =
    document.getElementById("resultContent");

  const sendDiscordBtn =
    document.getElementById("sendDiscordBtn");


  /* ============================================================
     KOMUNIKATY
     ============================================================ */

  function showError(message) {

    errorBox.textContent = message;
    errorBox.style.display = "block";

    successBox.style.display = "none";

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  }


  function showSuccess(message) {

    successBox.textContent = message;
    successBox.style.display = "block";

    errorBox.style.display = "none";

  }


  function clearMessages() {

    errorBox.style.display = "none";
    successBox.style.display = "none";

  }


  /* ============================================================
     KLASY
     ============================================================ */

  document
    .querySelectorAll(".class-btn")
    .forEach(button => {

      button.addEventListener("click", () => {

        const value =
          button.dataset.class;

        if (selectedClasses.includes(value)) {

          selectedClasses =
            selectedClasses.filter(
              item => item !== value
            );

          button.classList.remove("selected");

        } else {

          selectedClasses.push(value);

          button.classList.add("selected");

        }

      });

    });


  /* ============================================================
     OPONY
     ============================================================ */

  function createTireCheckboxes(
    container,
    category,
    prefix
  ) {

    container.innerHTML = "";

    if (!category) {

      container.innerHTML =
        `<div class="tire-info">
          Najpierw wybierz typ opon.
        </div>`;

      return;
    }

    const tires =
      tireDefinitions[category];

    if (!tires) return;

    tires.forEach(tire => {

      const label =
        document.createElement("label");

      label.className =
        "tire-option";

      const checkbox =
        document.createElement("input");

      checkbox.type = "checkbox";

      checkbox.className =
        prefix + "-tire";

      checkbox.value =
        tire.value;

      const span =
        document.createElement("span");

      span.textContent =
        tire.label;

      checkbox.addEventListener(
        "change",
        () => {

          label.classList.toggle(
            "selected",
            checkbox.checked
          );

        }
      );

      label.appendChild(checkbox);
      label.appendChild(span);

      container.appendChild(label);

    });

  }


  document
    .getElementById("tireCategorySelect")
    .addEventListener("change", event => {

      const category =
        event.target.value;

      createTireCheckboxes(
        document.getElementById(
          "usableTiresContainer"
        ),
        category,
        "usable"
      );

      createTireCheckboxes(
        document.getElementById(
          "requiredTiresContainer"
        ),
        category,
        "required"
      );

    });


  /* ============================================================
     POBIERANIE OPON
     ============================================================ */

  function getSelectedTires(className) {

    return Array.from(
      document.querySelectorAll(
        "." + className + "-tire:checked"
      )
    ).map(
      checkbox => checkbox.value
    );

  }


  /* ============================================================
     FORMAT OPON
     ============================================================ */

  function formatTires(value) {

    if (Array.isArray(value)) {

      return value.length
        ? value.join(" + ")
        : "Brak";

    }

    return value || "Brak";

  }


  /* ============================================================
     ZAPIS COMBO
     ============================================================ */

  document
    .getElementById("saveComboBtn")
    .addEventListener("click", async () => {

      clearMessages();

      try {

        const roundSnapshot =
          await get(roundRef);

        if (!roundSnapshot.exists()) {

          showError(
            "❌ Nie ma aktywnej rundy."
          );

          return;
        }

        const round =
          roundSnapshot.val();

        if (
          round.status !== "voting"
        ) {

          showError(
            "❌ Aktualnie nie trwa głosowanie."
          );

          return;
        }


        const track =
          document.getElementById(
            "trackSelect"
          ).value;

        const laps =
          document.getElementById(
            "lapsInput"
          ).value;

        const raceTime =
          document.getElementById(
            "raceTimeInput"
          ).value.trim();

        const weather =
          document.getElementById(
            "weatherSelect"
          ).value;

        const timeOfDay =
          document.getElementById(
            "timeOfDaySelect"
          ).value;

        const tireCategory =
          document.getElementById(
            "tireCategorySelect"
          ).value;

        const usableTires =
          getSelectedTires("usable");

        const requiredTires =
          getSelectedTires("required");

        const pit =
          document.getElementById(
            "pitSelect"
          ).value;

        const fuel =
          document.getElementById(
            "fuelSelect"
          ).value;

        const tireWear =
          document.getElementById(
            "tireWearSelect"
          ).value;

        const startType =
          document.getElementById(
            "startTypeSelect"
          ).value;

        const qualifying =
          document.getElementById(
            "qualifyingSelect"
          ).value;

        const bop =
          document.getElementById(
            "bopSelect"
          ).value;


        /* WALIDACJA */

        if (!track) {
          showError("❌ Wybierz tor.");
          return;
        }

        if (!selectedClasses.length) {
          showError("❌ Wybierz klasę.");
          return;
        }

        if (!laps) {
          showError(
            "❌ Podaj liczbę okrążeń."
          );
          return;
        }

        if (!weather) {
          showError("❌ Wybierz pogodę.");
          return;
        }

        if (!timeOfDay) {
          showError(
            "❌ Wybierz porę dnia."
          );
          return;
        }

        if (!tireCategory) {
          showError(
            "❌ Wybierz typ opon."
          );
          return;
        }

        if (!usableTires.length) {
          showError(
            "❌ Wybierz opony dostępne."
          );
          return;
        }

        if (!requiredTires.length) {
          showError(
            "❌ Wybierz opony obowiązkowe."
          );
          return;
        }

        const requiredNotAvailable =
          requiredTires.some(
            tire =>
              !usableTires.includes(tire)
          );

        if (requiredNotAvailable) {

          showError(
            "❌ Opony obowiązkowe muszą znajdować się wśród opon dostępnych."
          );

          return;
        }

        if (!pit) {
          showError(
            "❌ Wybierz ustawienie PIT."
          );
          return;
        }

        if (!fuel) {
          showError(
            "❌ Wybierz ustawienie paliwa."
          );
          return;
        }

        if (!tireWear) {
          showError(
            "❌ Wybierz zużycie opon."
          );
          return;
        }

        if (!startType) {
          showError(
            "❌ Wybierz rodzaj startu."
          );
          return;
        }

        if (!qualifying) {
          showError(
            "❌ Wybierz kwalifikacje."
          );
          return;
        }

        if (!bop) {
          showError(
            "❌ Wybierz BOP."
          );
          return;
        }


        /* ZAPIS */

        const combo = {

          playerId,

          roundId:
            round.id,

          track,

          classes:
            selectedClasses,

          laps:
            Number(laps),

          raceTime:
            raceTime || "",

          weather,

          timeOfDay,

          tireCategory,

          usableTires,

          requiredTires,

          pit,

          fuel,

          tireWear,

          startType,

          qualifying,

          bop,

          createdAt:
            Date.now()

        };


        await set(
          ref(
            db,
            "srsLobbyCombos/" +
            playerId
          ),
          combo
        );


        showSuccess(
          "✅ Twoje COMBO zostało zapisane."
        );

        document
          .getElementById(
            "saveComboBtn"
          )
          .textContent =
          "✅ COMBO ZAPISANE";


      } catch (error) {

        console.error(error);

        showError(
          "❌ Nie udało się zapisać COMBO."
        );

      }

    });


  /* ============================================================
     NOWA RUNDA
     ============================================================ */

  document
    .getElementById("newRoundBtn")
    .addEventListener("click", async () => {

      clearMessages();

      const pin =
        document.getElementById(
          "adminPinInput"
        ).value;

      if (pin !== ADMIN_PIN) {

        showError(
          "❌ Nieprawidłowy PIN."
        );

        return;
      }

      try {

        const now =
          Date.now();

        await set(roundRef, {

          id:
            String(now),

          status:
            "voting",

          startTime:
            now,

          endTime:
            now + ROUND_TIME,

          winner:
            null

        });

        showSuccess(
          "🎲 Nowa runda została rozpoczęta."
        );

        document
          .getElementById(
            "adminPinInput"
          ).value = "";

      } catch (error) {

        console.error(error);

        showError(
          "❌ Nie udało się rozpocząć rundy."
        );

      }

    });


  /* ============================================================
     LOSOWANIE ZWYCIĘZCY
     ============================================================ */

  async function finishRound(round) {

    if (!round) return;

    if (round.status !== "voting")
      return;

    if (Date.now() < round.endTime)
      return;

    try {

      const snapshot =
        await get(combosRef);

      const allCombos =
        snapshot.exists()
          ? snapshot.val()
          : {};

      const combos =
        Object.values(allCombos)
          .filter(
            combo =>
              combo.roundId === round.id
          );

      if (!combos.length) {

        await set(roundRef, {

          ...round,

          status:
            "finished",

          winner:
            null,

          finishedAt:
            Date.now()

        });

        return;
      }


      const winner =
        combos[
          Math.floor(
            Math.random() *
            combos.length
          )
        ];


      await set(roundRef, {

        ...round,

        status:
          "finished",

        winner,

        finishedAt:
          Date.now()

      });

    } catch (error) {

      console.error(
        "Błąd kończenia rundy:",
        error
      );

    }

  }


  /* ============================================================
     FORMAT WYNIKU
     ============================================================ */

  function displayResult(winner) {

    if (!winner) {

      resultCard.style.display =
        "none";

      return;
    }

    currentWinner =
      winner;

    resultCard.style.display =
      "block";


    resultContent.innerHTML = `

      <div class="result-item full">
        <div class="result-label">
          🏁 TOR
        </div>
        <div class="result-value">
          ${escapeHtml(winner.track)}
        </div>
      </div>

      <div class="result-item">
        <div class="result-label">
          🏎️ KLASA
        </div>
        <div class="result-value">
          ${escapeHtml(
            Array.isArray(winner.classes)
              ? winner.classes.join(" + ")
              : winner.classes || ""
          )}
        </div>
      </div>

      <div class="result-item">
        <div class="result-label">
          🔢 OKRĄŻENIA
        </div>
        <div class="result-value">
          ${winner.laps || "-"}
        </div>
      </div>

      <div class="result-item">
        <div class="result-label">
          ⏱️ CZAS WYŚCIGU
        </div>
        <div class="result-value">
          ${escapeHtml(
            winner.raceTime || "Nie podano"
          )}
        </div>
      </div>

      <div class="result-item">
        <div class="result-label">
          🌦️ POGODA
        </div>
        <div class="result-value">
          ${escapeHtml(winner.weather)}
        </div>
      </div>

      <div class="result-item">
        <div class="result-label">
          🌅 PORA DNIA
        </div>
        <div class="result-value">
          ${escapeHtml(winner.timeOfDay)}
        </div>
      </div>

      <div class="result-item">
        <div class="result-label">
          🛞 TYP OPON
        </div>
        <div class="result-value">
          ${escapeHtml(winner.tireCategory)}
        </div>
      </div>

      <div class="result-item full">
        <div class="result-label">
          🛞 OPONY DOSTĘPNE
        </div>
        <div class="result-value">
          ${escapeHtml(
            formatTires(
              winner.usableTires
            )
          )}
        </div>
      </div>

      <div class="result-item full">
        <div class="result-label">
          🔧 OPONY OBOWIĄZKOWE
        </div>
        <div class="result-value">
          ${escapeHtml(
            formatTires(
              winner.requiredTires
            )
          )}
        </div>
      </div>

      <div class="result-item">
        <div class="result-label">
          🔧 PIT STOP
        </div>
        <div class="result-value">
          ${escapeHtml(winner.pit)}
        </div>
      </div>

      <div class="result-item">
        <div class="result-label">
          ⛽ PALIWO
        </div>
        <div class="result-value">
          ${escapeHtml(winner.fuel)}
        </div>
      </div>

      <div class="result-item">
        <div class="result-label">
          🛞 ZUŻYCIE OPON
        </div>
        <div class="result-value">
          ${escapeHtml(winner.tireWear)}
        </div>
      </div>

      <div class="result-item">
        <div class="result-label">
          🚦 START
        </div>
        <div class="result-value">
          ${escapeHtml(winner.startType)}
        </div>
      </div>

      <div class="result-item">
        <div class="result-label">
          ⏱️ KWALIFIKACJE
        </div>
        <div class="result-value">
          ${escapeHtml(winner.qualifying)}
        </div>
      </div>

      <div class="result-item">
        <div class="result-label">
          ⚖️ BOP
        </div>
        <div class="result-value">
          ${escapeHtml(winner.bop)}
        </div>
      </div>

    `;


    sendDiscordBtn.disabled =
      false;

    sendDiscordBtn.textContent =
      "📢 WYŚLIJ WYNIK NA DISCORD";

  }


  /* ============================================================
     BEZPIECZNY HTML
     ============================================================ */

  function escapeHtml(value) {

    if (value === null ||
        value === undefined) {
      return "";
    }

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* ============================================================
     DISCORD
     ============================================================ */

  sendDiscordBtn
    .addEventListener(
      "click",
      async () => {

        if (!currentWinner) {

          showError(
            "❌ Brak wyniku do wysłania."
          );

          return;
        }


        if (
          !DISCORD_WEBHOOK_URL ||
          DISCORD_WEBHOOK_URL ===
          "TU_WKLEJ_WEBHOOK"
        ) {

          showError(
            "❌ Najpierw wpisz webhook Discorda w kodzie strony."
          );

          return;
        }


        sendDiscordBtn.disabled =
          true;

        sendDiscordBtn.textContent =
          "⏳ WYSYŁANIE...";


        const winner =
          currentWinner;


        const classes =
          Array.isArray(
            winner.classes
          )
            ? winner.classes.join(" + ")
            : winner.classes || "-";


        const embed = {

          title:
            "🏆 SRS LOBBY COMBO",

          description:
            "🎲 Wylosowano nowe COMBO!",

          color:
            0xE30000,

          fields: [

            {
              name: "🏁 Tor",
              value:
                winner.track || "-",
              inline: false
            },

            {
              name: "🏎️ Klasa",
              value:
                classes,
              inline: true
            },

            {
              name: "🔢 Okrążenia",
              value:
                String(
                  winner.laps || "-"
                ),
              inline: true
            },

            {
              name: "⏱️ Czas wyścigu",
              value:
                winner.raceTime ||
                "Nie podano",
              inline: true
            },

            {
              name: "🌦️ Pogoda",
              value:
                winner.weather || "-",
              inline: true
            },

            {
              name: "🌅 Pora dnia",
              value:
                winner.timeOfDay || "-",
              inline: true
            },

            {
              name: "🛞 Typ opon",
              value:
                winner.tireCategory || "-",
              inline: true
            },

            {
              name: "🛞 Opony dostępne",
              value:
                formatTires(
                  winner.usableTires
                ),
              inline: false
            },

            {
              name: "🔧 Opony obowiązkowe",
              value:
                formatTires(
                  winner.requiredTires
                ),
              inline: false
            },

            {
              name: "🔧 PIT STOP",
              value:
                winner.pit || "-",
              inline: true
            },

            {
              name: "⛽ Paliwo",
              value:
                winner.fuel || "-",
              inline: true
            },

            {
              name: "🛞 Zużycie opon",
              value:
                winner.tireWear || "-",
              inline: true
            },

            {
              name: "🚦 Start",
              value:
                winner.startType || "-",
              inline: true
            },

            {
              name: "⏱️ Kwalifikacje",
              value:
                winner.qualifying || "-",
              inline: true
            },

            {
              name: "⚖️ BOP",
              value:
                winner.bop || "-",
              inline: true
            }

          ],

          footer: {
            text:
              "Sim Racing Squad • SRS Lobby Combo"
          },

          timestamp:
            new Date().toISOString()

        };


        try {

          const response =
            await fetch(
              DISCORD_WEBHOOK_URL,
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({

                  username:
                    "SRS Lobby Combo",

                  embeds: [
                    embed
                  ]

                })

              }
            );


          if (!response.ok) {

            throw new Error(
              "Discord HTTP " +
              response.status
            );

          }


          sendDiscordBtn.textContent =
            "✅ WYSŁANO NA DISCORD";

          showSuccess(
            "✅ Wynik COMBO został wysłany na Discord."
          );


        } catch (error) {

          console.error(
            "Discord:",
            error
          );

          sendDiscordBtn.disabled =
            false;

          sendDiscordBtn.textContent =
            "📢 WYŚLIJ WYNIK NA DISCORD";

          showError(
            "❌ Nie udało się wysłać wyniku na Discord."
          );

        }

      }
    );


  /* ============================================================
     AKTUALIZACJA RUNDY
     ============================================================ */

  onValue(
    roundRef,
    async snapshot => {

      if (!snapshot.exists()) {

        currentRound =
          null;

        roundStatus.textContent =
          "BRAK AKTYWNEJ RUNDY";

        countdown.textContent =
          "--";

        resultCard.style.display =
          "none";

        return;
      }


      const round =
        snapshot.val();

      currentRound =
        round;


      if (
        round.status === "voting"
      ) {

        roundStatus.textContent =
          "🎲 TRWA LOSOWANIE COMBO";

        displayResult(null);

        updateCountdown(
          round.endTime
        );


        if (
          Date.now() >=
          round.endTime
        ) {

          await finishRound(
            round
          );

        }

      }


      else if (
        round.status === "finished"
      ) {

        roundStatus.textContent =
          "🏁 LOSOWANIE ZAKOŃCZONE";

        countdown.textContent =
          "GOTOWE";

        displayResult(
          round.winner
        );

      }

    }
  );


  /* ============================================================
     ODLICZANIE
     ============================================================ */

  function updateCountdown(endTime) {

    function update() {

      if (
        !currentRound ||
        currentRound.status !==
        "voting"
      ) {

        return;
      }


      const difference =
        endTime - Date.now();


      if (difference <= 0) {

        countdown.textContent =
          "LOSOWANIE...";

        return;
      }


      const totalSeconds =
        Math.floor(
          difference / 1000
        );

      const minutes =
        Math.floor(
          totalSeconds / 60
        );

      const seconds =
        totalSeconds % 60;


      countdown.textContent =
        String(minutes)
          .padStart(2, "0") +
        ":" +
        String(seconds)
          .padStart(2, "0");

    }


    update();

    setInterval(
      update,
      1000
    );

  }

</script>
