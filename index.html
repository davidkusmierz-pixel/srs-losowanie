<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SRS LOBBY COMBO</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background:
    linear-gradient(rgba(0,0,0,.82), rgba(0,0,0,.92)),
    url("background.png.png") center/cover fixed;
  color: #fff;
}

.container {
  max-width: 1000px;
  margin: auto;
  padding: 25px 15px 50px;
}

header {
  text-align: center;
  margin-bottom: 25px;
}

header h1 {
  margin: 0;
  font-size: 34px;
  font-weight: 900;
  color: #e50914;
  text-shadow: 0 0 15px rgba(229,9,20,.5);
}

header p {
  color: #aaa;
  margin-top: 7px;
}

.card {
  background: rgba(15,15,15,.94);
  border: 1px solid #333;
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 18px;
  box-shadow: 0 8px 30px rgba(0,0,0,.45);
}

.card h2 {
  margin-top: 0;
  font-size: 20px;
  color: #e50914;
}

label {
  display: block;
  margin: 12px 0 6px;
  font-weight: bold;
  color: #ddd;
}

input,
select,
button {
  width: 100%;
  border-radius: 8px;
  border: 1px solid #444;
  background: #1a1a1a;
  color: #fff;
  padding: 12px;
  font-size: 15px;
}

input:focus,
select:focus {
  outline: none;
  border-color: #e50914;
}

button {
  cursor: pointer;
  font-weight: bold;
  border: none;
  background: #b0000b;
  margin-top: 12px;
}

button:hover {
  background: #e50914;
}

button.secondary {
  background: #333;
}

button.secondary:hover {
  background: #444;
}

button.green {
  background: #126b2e;
}

button.green:hover {
  background: #168a3a;
}

button.orange {
  background: #8a4d00;
}

button.orange:hover {
  background: #b96700;
}

.admin-grid,
.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.admin-grid > div,
.grid > div {
  min-width: 0;
}

.full {
  grid-column: 1 / -1;
}

.status {
  text-align: center;
  padding: 20px;
  border-radius: 12px;
  background: #111;
  border: 1px solid #333;
}

.status-main {
  font-size: 25px;
  font-weight: 900;
  color: #e50914;
}

.countdown {
  font-size: 38px;
  font-weight: 900;
  margin-top: 10px;
}

.info {
  color: #aaa;
  margin-top: 8px;
}

.pool-box {
  text-align: center;
  padding: 18px;
  border: 1px solid #333;
  border-radius: 12px;
  background: #101010;
}

.pool-number {
  font-size: 38px;
  font-weight: 900;
  color: #e50914;
}

.pool-label {
  color: #aaa;
  font-size: 14px;
}

.classes {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  margin-top: 8px;
}

.class-option {
  display: flex;
  align-items: center;
  gap: 8px;
  background: #181818;
  border: 1px solid #333;
  padding: 9px;
  border-radius: 7px;
  cursor: pointer;
}

.class-option input {
  width: auto;
  margin: 0;
}

.result {
  border: 1px solid #e50914;
  background: rgba(100,0,0,.15);
  border-radius: 12px;
  padding: 20px;
}

.result-title {
  color: #e50914;
  font-size: 22px;
  font-weight: 900;
  margin-bottom: 15px;
}

.result-row {
  padding: 7px 0;
  border-bottom: 1px solid #292929;
}

.result-row:last-child {
  border-bottom: none;
}

.hidden {
  display: none !important;
}

.small {
  font-size: 13px;
  color: #888;
}

.warning {
  color: #ffb000;
  font-size: 14px;
  margin-top: 8px;
}

.success {
  color: #35d46f;
  font-size: 14px;
  margin-top: 8px;
}

@media(max-width:700px) {
  .admin-grid,
  .grid {
    grid-template-columns: 1fr;
  }

  .classes {
    grid-template-columns: 1fr;
  }

  header h1 {
    font-size: 27px;
  }

  .countdown {
    font-size: 30px;
  }
}
</style>
</head>

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
  getDatabase,
  ref,
  set,
  get,
  remove,
  onValue
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


/* ==========================================================
   FIREBASE
========================================================== */

const firebaseConfig = {
  apiKey: "AIzaSyDRDAiSlJBPOG8N_c4ctBRLYrwx3ER5rKw",
  authDomain: "srs-losowanie.firebaseapp.com",
  databaseURL: "https://srs-losowanie-default-rtdb.firebaseio.com",
  projectId: "srs-losowanie",
  storageBucket: "srs-losowanie.firebasestorage.app",
  messagingSenderId: "212959687651",
  appId: "1:212959687651:web:0a9a5e647450767bc026d6"
};

const app = initializeApp(firebaseConfig);
const database = getDatabase(app);


/* ==========================================================
   USTAWIENIA
========================================================== */

const ADMIN_PIN = "840416";

const roundRef = ref(database, "srsLobbyRound");
const combosRef = ref(database, "srsLobbyCombos");

let currentRound = null;
let currentCombos = {};

let adminUnlocked = false;
let countdownTimer = null;
let drawRunning = false;


/* ==========================================================
   PLAYER ID
========================================================== */

let playerId =
  localStorage.getItem("srsLobbyPlayerId");

if (!playerId) {

  playerId =
    "player_" +
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .substring(2, 9);

  localStorage.setItem(
    "srsLobbyPlayerId",
    playerId
  );
}


/* ==========================================================
   ELEMENTY
========================================================== */

const statusMain =
  document.getElementById("statusMain");

const countdown =
  document.getElementById("countdown");

const roundInfo =
  document.getElementById("roundInfo");

const poolCount =
  document.getElementById("poolCount");

const trackCount =
  document.getElementById("trackCount");

const resultContainer =
  document.getElementById("resultContainer");

const resultContent =
  document.getElementById("resultContent");

const adminPanel =
  document.getElementById("adminPanel");

const adminMessage =
  document.getElementById("adminMessage");

const comboMessage =
  document.getElementById("comboMessage");


/* ==========================================================
   POMOCNICZE
========================================================== */

function escapeHtml(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


function showMessage(element, text, type = "") {

  element.className = type;
  element.textContent = text;
}


function formatDate(timestamp) {

  if (!timestamp) return "--";

  return new Date(timestamp)
    .toLocaleString("pl-PL", {
      dateStyle: "short",
      timeStyle: "short"
    });
}


function formatCountdown(ms) {

  if (ms <= 0) return "00:00:00";

  const totalSeconds =
    Math.floor(ms / 1000);

  const days =
    Math.floor(totalSeconds / 86400);

  const hours =
    Math.floor(
      (totalSeconds % 86400) / 3600
    );

  const minutes =
    Math.floor(
      (totalSeconds % 3600) / 60
    );

  const seconds =
    totalSeconds % 60;

  if (days > 0) {

    return (
      String(days).padStart(2, "0") +
      ":" +
      String(hours).padStart(2, "0") +
      ":" +
      String(minutes).padStart(2, "0") +
      ":" +
      String(seconds).padStart(2, "0")
    );

  }

  return (
    String(hours).padStart(2, "0") +
    ":" +
    String(minutes).padStart(2, "0") +
    ":" +
    String(seconds).padStart(2, "0")
  );
}


/* ==========================================================
   LICZENIE PULI
========================================================== */

function updatePoolDisplay() {

  const entries =
    Object.entries(currentCombos || {});

  poolCount.textContent =
    entries.length;


  const uniqueTracks =
    new Set(
      entries
        .map(([key, combo]) => combo.track)
        .filter(Boolean)
    );

  trackCount.textContent =
    uniqueTracks.size;
}


/* ==========================================================
   ŁADOWANIE COMBO
========================================================== */

onValue(combosRef, snapshot => {

  currentCombos =
    snapshot.val() || {};

  updatePoolDisplay();

  loadMyCombo();

});


/* ==========================================================
   ŁADOWANIE RUNDY
========================================================== */

onValue(roundRef, snapshot => {

  currentRound =
    snapshot.val() || null;

  updateRoundDisplay();

  loadMyCombo();

});


/* ==========================================================
   STATUS RUNDY
========================================================== */

function updateRoundDisplay() {

  if (countdownTimer) {

    clearInterval(countdownTimer);
    countdownTimer = null;

  }


  if (!currentRound) {

    statusMain.textContent =
      "BRAK AKTYWNEGO LOSOWANIA";

    countdown.textContent =
      "--";

    roundInfo.textContent =
      "Administrator nie ustawił jeszcze terminu losowania.";

    resultContainer.classList.add("hidden");

    return;
  }


  if (currentRound.status === "finished") {

    statusMain.textContent =
      "LOSOWANIE ZAKOŃCZONE";

    countdown.textContent =
      "00:00:00";

    roundInfo.textContent =
      "Losowanie: " +
      formatDate(currentRound.drawTime);

    showWinner(currentRound.winner);

    return;
  }


  if (!currentRound.drawTime) {

    statusMain.textContent =
      "OCZEKIWANIE NA TERMIN";

    countdown.textContent =
      "--";

    roundInfo.textContent =
      "Administrator musi ustawić datę i godzinę losowania.";

    return;
  }


  statusMain.textContent =
    "LOSOWANIE ODBĘDZIE SIĘ ZA";

  roundInfo.textContent =
    "Termin: " +
    formatDate(currentRound.drawTime);


  updateCountdown();

  countdownTimer =
    setInterval(updateCountdown, 1000);

}


function updateCountdown() {

  if (!currentRound?.drawTime) {

    countdown.textContent =
      "--";

    return;
  }


  const remaining =
    currentRound.drawTime -
    Date.now();


  if (remaining <= 0) {

    countdown.textContent =
      "00:00:00";

    if (!drawRunning) {

      drawRunning = true;

      finishRound()
        .finally(() => {
          drawRunning = false;
        });

    }

    return;
  }


  countdown.textContent =
    formatCountdown(remaining);
}


/* ==========================================================
   NOWA RUNDA
========================================================== */

document
  .getElementById("newRoundBtn")
  .addEventListener("click", async () => {

    if (!adminUnlocked) {

      alert("Najpierw odblokuj panel administratora.");

      return;
    }


    const confirmed =
      confirm(
        "Rozpocząć nową rundę?\n\n" +
        "Pula combo pozostanie bez zmian."
      );

    if (!confirmed) return;


    const round = {

      id:
        "round_" +
        Date.now(),

      status:
        "waiting",

      createdAt:
        Date.now(),

      drawTime:
        null,

      winner:
        null

    };


    await set(roundRef, round);


    showMessage(
      adminMessage,
      "Nowa runda utworzona. Ustaw datę i godzinę losowania.",
      "success"
    );


    resultContainer.classList.add("hidden");

  });


/* ==========================================================
   USTAWIANIE DATY I GODZINY
========================================================== */

document
  .getElementById("saveScheduleBtn")
  .addEventListener("click", async () => {

    if (!adminUnlocked) {

      alert("Najpierw odblokuj panel administratora.");

      return;
    }


    const date =
      document.getElementById("drawDate").value;

    const time =
      document.getElementById("drawTime").value;


    if (!date || !time) {

      showMessage(
        adminMessage,
        "Wybierz datę oraz godzinę losowania.",
        "warning"
      );

      return;
    }


    const drawTime =
      new Date(
        `${date}T${time}`
      ).getTime();


    if (
      Number.isNaN(drawTime)
    ) {

      showMessage(
        adminMessage,
        "Nieprawidłowa data lub godzina.",
        "warning"
      );

      return;
    }


    if (
      drawTime <= Date.now()
    ) {

      showMessage(
        adminMessage,
        "Termin losowania musi być w przyszłości.",
        "warning"
      );

      return;
    }


    const existing =
      currentRound || {

        id:
          "round_" +
          Date.now(),

        createdAt:
          Date.now(),

        winner:
          null

      };


    const updatedRound = {

      ...existing,

      status:
        "waiting",

      drawTime:
        drawTime,

      updatedAt:
        Date.now(),

      winner:
        null

    };


    await set(
      roundRef,
      updatedRound
    );


    showMessage(
      adminMessage,
      "Termin losowania został zapisany: " +
      formatDate(drawTime),
      "success"
    );

  });


/* ==========================================================
   WYCZYŚĆ PULĘ
========================================================== */

document
  .getElementById("clearPoolBtn")
  .addEventListener("click", async () => {

    if (!adminUnlocked) {

      alert("Najpierw odblokuj panel administratora.");

      return;
    }


    const confirmed =
      confirm(
        "UWAGA!\n\n" +
        "Czy na pewno chcesz wyczyścić całą pulę?\n\n" +
        "Wszystkie zgłoszone combo zostaną usunięte."
      );

    if (!confirmed) return;


    await remove(combosRef);


    showMessage(
      adminMessage,
      "Pula została wyczyszczona.",
      "success"
    );

  });


/* ==========================================================
   ADMIN LOGIN
========================================================== */

document
  .getElementById("adminLoginBtn")
  .addEventListener("click", () => {

    const pin =
      document.getElementById("adminPin").value;


    if (pin === ADMIN_PIN) {

      adminUnlocked = true;

      adminPanel.classList.remove("hidden");

      showMessage(
        adminMessage,
        "Panel administratora odblokowany.",
        "success"
      );

    } else {

      alert("Nieprawidłowy PIN.");

    }

  });


/* ==========================================================
   ZAPIS COMBO
========================================================== */

document
  .getElementById("saveComboBtn")
  .addEventListener("click", async () => {

    const track =
      document.getElementById("track").value;


    if (!track) {

      showMessage(
        comboMessage,
        "Wybierz tor.",
        "warning"
      );

      return;
    }


    const classes =
      Array.from(
        document.querySelectorAll(
          ".class-option input:checked"
        )
      ).map(
        input => input.value
      );


    if (classes.length === 0) {

      showMessage(
        comboMessage,
        "Wybierz przynajmniej jedną klasę samochodów.",
        "warning"
      );

      return;
    }


    const laps =
      document.getElementById("laps").value;


    if (!laps) {

      showMessage(
        comboMessage,
        "Podaj liczbę okrążeń.",
        "warning"
      );

      return;
    }


    const combo = {

      playerId:
        playerId,

      track:
        track,

      classes:
        classes,

      laps:
        Number(laps),

      weather:
        document.getElementById("weather").value,

      timeOfDay:
        document.getElementById("timeOfDay").value,

      tires:
        document.getElementById("tires").value,

      pit:
        document.getElementById("pit").value,

      fuel:
        document.getElementById("fuel").value,

      tireWear:
        document.getElementById("tireWear").value,

      startType:
        document.getElementById("startType").value,

      qualifying:
        document.getElementById("qualifying").value,

      bop:
        document.getElementById("bop").value,

      updatedAt:
        Date.now(),

      roundId:
        currentRound?.id || null

    };


    await set(
      ref(
        database,
        "srsLobbyCombos/" + playerId
      ),
      combo
    );


    showMessage(
      comboMessage,
      "Combo zostało zapisane w puli.",
      "success"
    );

  });


/* ==========================================================
   WCZYTAJ MOJE COMBO
========================================================== */

function loadMyCombo() {

  const combo =
    currentCombos?.[playerId];


  if (!combo) return;


  document.getElementById("track").value =
    combo.track || "";


  document
    .querySelectorAll(
      ".class-option input"
    )
    .forEach(input => {

      input.checked =
        Array.isArray(combo.classes) &&
        combo.classes.includes(
          input.value
        );

    });


  document.getElementById("laps").value =
    combo.laps || "";


  document.getElementById("weather").value =
    combo.weather || "Bezchmurnie";


  document.getElementById("timeOfDay").value =
    combo.timeOfDay || "Dzień";


  document.getElementById("tires").value =
    combo.tires || "Dowolne";


  document.getElementById("pit").value =
    combo.pit || "Brak obowiązkowego";


  document.getElementById("fuel").value =
    combo.fuel || "1x";


  document.getElementById("tireWear").value =
    combo.tireWear || "1x";


  document.getElementById("startType").value =
    combo.startType || "Start lotny";


  document.getElementById("qualifying").value =
    combo.qualifying || "Brak";


  document.getElementById("bop").value =
    combo.bop || "Włączone";

}


/* ==========================================================
   LOSOWANIE
========================================================== */

async function finishRound() {

  const snapshot =
    await get(combosRef);

  const allCombos =
    snapshot.val() || {};


  const entries =
    Object.entries(allCombos)
      .map(([key, combo]) => ({
        key,
        ...combo
      }));


  if (entries.length === 0) {

    const updated =
      currentRound
        ? {
            ...currentRound,
            status: "finished",
            finishedAt: Date.now(),
            winner: null
          }
        : null;


    if (updated) {

      await set(
        roundRef,
        updated
      );

    }

    return;
  }


  /* LOSOWANIE Z CAŁEJ AKTUALNEJ PULI */

  const randomIndex =
    Math.floor(
      Math.random() * entries.length
    );


  const winnerEntry =
    entries[randomIndex];


  const winner = {
    ...winnerEntry
  };

  delete winner.key;


  /* USUNIĘCIE WYLOSOWANEGO COMBO Z PULI */

  await remove(
    ref(
      database,
      "srsLobbyCombos/" +
      winnerEntry.key
    )
  );


  const updatedRound = {

    ...currentRound,

    status:
      "finished",

    finishedAt:
      Date.now(),

    winner:
      winner

  };


  await set(
    roundRef,
    updatedRound
  );


  showWinner(winner);

}

  resultContainer.classList.remove(

  );


  resultContent.innerHTML = `

    <div class="result-row">
      <strong>🏁 Tor:</strong>
      ${escapeHtml(winner.track)}
    </div>

    <div class="result-row">

    </div>

    </div>

    </div>

      ${escapeHtml(winner.tires)}
    </div>

      <strong>⛽ Pit stop:</strong>

    </div>

    <div class="result-row">

    </div>

/* ==========================================================
   DOMYŚLNA DATA
========================================================== */

function setDefaultDateTime() {

  const now =
    new Date(
      Date.now() + 60 * 60 * 1000
    );


  const year =
    now.getFullYear();

  const month =
    String(
      now.getMonth() + 1
    ).padStart(2, "0");

  const day =
    String(
      now.getDate()
    ).padStart(2, "0");


  const hours =
    String(
      now.getHours()
    ).padStart(2, "0");

  const minutes =
    String(
      now.getMinutes()
    ).padStart(2, "0");


  document.getElementById(
    "drawDate"
  ).value =
    `${year}-${month}-${day}`;


  document.getElementById(
    "drawTime"
  ).value =
    `${hours}:${minutes}`;

}


setDefaultDateTime();
