<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SRS LOBBY COMBO</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  overflow-x: hidden;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  color: white;
  background:
    linear-gradient(
      rgba(5, 6, 12, 0.78),
      rgba(5, 6, 12, 0.96)
    ),
    url("background.png.png");
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
}

.container {
  width: min(950px, 94%);
  margin: auto;
  padding: 20px 0 60px;
}

h1 {
  text-align: center;
  font-size: clamp(32px, 7vw, 55px);
  margin: 15px 0 25px;
  text-shadow: 0 4px 25px black;
}

.card {
  background: rgba(10, 11, 20, 0.96);
  border: 1px solid rgba(220, 0, 0, 0.65);
  border-radius: 18px;
  padding: 22px;
  margin-bottom: 20px;
  box-shadow:
    0 10px 35px rgba(0,0,0,0.6),
    0 0 30px rgba(180,0,0,0.08);
}

.hidden {
  display: none !important;
}

button,
input,
select {
  font-family: inherit;
}

button {
  border: none;
  border-radius: 11px;
  color: white;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
}

button:hover:not(:disabled) {
  transform: translateY(-2px);
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.admin-row {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
}

#adminPin {
  width: 220px;
  height: 58px;
  border-radius: 11px;
  border: 1px solid #555;
  background: #15151d;
  color: white;
  text-align: center;
  font-size: 17px;
  padding: 0 15px;
}

#newRoundBtn {
  min-width: 260px;
  height: 58px;
  font-size: 17px;
  background: linear-gradient(135deg, #e30000, #850000);
}

#adminInfo {
  margin-top: 12px;
  text-align: center;
  min-height: 20px;
  color: #aaa;
}

.status-card {
  text-align: center;
}

#phaseStatus {
  font-size: clamp(24px, 5vw, 31px);
  font-weight: bold;
  margin-bottom: 15px;
}

#countdown {
  font-size: clamp(55px, 12vw, 82px);
  font-weight: bold;
  color: #ffe000;
  line-height: 1;
  text-shadow: 0 0 25px rgba(255,220,0,0.35);
}

#phaseInfo {
  margin-top: 15px;
  color: #ccc;
}

.section-title {
  text-align: center;
  font-size: clamp(21px, 4vw, 27px);
  font-weight: bold;
  margin-bottom: 20px;
}

.label {
  display: block;
  margin: 18px 0 8px;
  font-weight: bold;
  color: #ddd;
}

select,
input[type="number"] {
  width: 100%;
  min-height: 52px;
  border-radius: 10px;
  border: 1px solid #555;
  background: #15151d;
  color: white;
  padding: 0 15px;
  font-size: 16px;
}

.classes,
.tires-grid,
.race-type-grid {
  display: grid;
  gap: 10px;
}

.classes {
  grid-template-columns: repeat(5, 1fr);
}

.tires-grid {
  grid-template-columns: repeat(3, 1fr);
}

.race-type-grid {
  grid-template-columns: repeat(2, 1fr);
}

.class-btn,
.tire-btn,
.race-type-btn {
  min-height: 60px;
  background: #15151d;
  border: 2px solid #444;
  font-size: 16px;
}

.class-btn.selected,
.tire-btn.selected,
.race-type-btn.selected {
  border-color: #ff2020;
  background: linear-gradient(135deg, #5e0000, #210000);
}

#saveComboBtn {
  width: 100%;
  min-height: 58px;
  margin-top: 25px;
  font-size: 18px;
  background: linear-gradient(135deg, #e30000, #850000);
}

#comboInfo {
  margin-top: 15px;
  text-align: center;
  min-height: 22px;
}

.participant-count {
  text-align: center;
  font-size: 20px;
  margin-bottom: 15px;
  color: #ffe000;
}

.my-combo {
  margin-top: 15px;
  text-align: center;
  line-height: 1.8;
}

.result {
  text-align: center;
  line-height: 1.8;
}

.result-title {
  color: #ffe000;
  font-size: 20px;
  margin-top: 12px;
}

.result-value {
  font-size: clamp(21px, 4vw, 30px);
  font-weight: bold;
  color: #ff6666;
}

@media (max-width: 850px) {
  .classes {
    grid-template-columns: repeat(4, 1fr);
  }
}

@media (max-width: 650px) {
  .classes {
    grid-template-columns: repeat(2, 1fr);
  }

  .tires-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 500px) {
  .admin-row {
    flex-direction: column;
  }

  #adminPin,
  #newRoundBtn {
    width: 100%;
  }

  .race-type-grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
  getDatabase,
  ref,
  set,
  get,
  onValue,
  remove,
  runTransaction
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


const firebaseConfig = {
  apiKey: "AIzaSyDRDAiSlJBPOG8N_c4ctBRLYrwx3ER5rKw",
  authDomain: "srs-losowanie.firebaseapp.com",
  databaseURL: "https://srs-losowanie-default-rtdb.firebaseio.com",
  projectId: "srs-losowanie",
  storageBucket: "srs-losowanie.firebasestorage.app",
  messagingSenderId: "212959687651",
  appId: "1:212959687651:web:0a9a5e647450767bc026d6"
};


const app = initializeApp(firebaseConfig);
const database = getDatabase(app);


const ADMIN_PIN = "840416";


const DISCORD_WEBHOOK = "WKLEJ_TUTAJ_WEBHOOK";


const ROUND_TIME = 5 * 60 * 1000;


const adminPin = document.getElementById("adminPin");
const newRoundBtn = document.getElementById("newRoundBtn");
const adminInfo = document.getElementById("adminInfo");

const phaseStatus = document.getElementById("phaseStatus");
const countdown = document.getElementById("countdown");
const phaseInfo = document.getElementById("phaseInfo");

const comboSection = document.getElementById("comboSection");

const trackSelect = document.getElementById("trackSelect");

const classButtons =
  document.querySelectorAll(".class-btn");

const raceTypeButtons =
  document.querySelectorAll(".race-type-btn");

const tireButtons =
  document.querySelectorAll(".tire-btn");

const lapsBox =
  document.getElementById("lapsBox");

const timeBox =
  document.getElementById("timeBox");

const lapsInput =
  document.getElementById("lapsInput");

const raceTimeInput =
  document.getElementById("raceTimeInput");

const weatherSelect =
  document.getElementById("weatherSelect");

const timeOfDaySelect =
  document.getElementById("timeOfDaySelect");

const pitSelect =
  document.getElementById("pitSelect");

const fuelSelect =
  document.getElementById("fuelSelect");

const tireWearSelect =
  document.getElementById("tireWearSelect");

const startTypeSelect =
  document.getElementById("startTypeSelect");

const qualifyingSelect =
  document.getElementById("qualifyingSelect");

const bopSelect =
  document.getElementById("bopSelect");

const saveComboBtn =
  document.getElementById("saveComboBtn");

const comboInfo =
  document.getElementById("comboInfo");

const myCombo =
  document.getElementById("myCombo");

const participantCount =
  document.getElementById("participantCount");

const officialResult =
  document.getElementById("officialResult");


const roundRef =
  ref(database, "srsLobbyRound");

const combosRef =
  ref(database, "srsLobbyCombos");


let currentRound = null;
let currentCombos = {};

let selectedClasses = [];
let selectedTires = [];

let selectedRaceType = "laps";

let finishingRound = false;


let playerId =
  localStorage.getItem("srsLobbyPlayerId");


if (!playerId) {

  playerId =
    "player_" +
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .substring(2, 10);

  localStorage.setItem(
    "srsLobbyPlayerId",
    playerId
  );

}


function showError(message) {

  comboInfo.textContent = message;
  comboInfo.style.color = "#ff5555";

}


function resetComboForm() {

  trackSelect.value = "";

  selectedClasses = [];
  selectedTires = [];

  selectedRaceType = "laps";

  classButtons.forEach(button => {
    button.classList.remove("selected");
  });

  tireButtons.forEach(button => {
    button.classList.remove("selected");
  });

  raceTypeButtons.forEach(button => {

    button.classList.remove("selected");

    if (button.dataset.raceType === "laps") {
      button.classList.add("selected");
    }

  });

  lapsBox.classList.remove("hidden");
  timeBox.classList.add("hidden");

  lapsInput.value = "";
  raceTimeInput.value = "";

  weatherSelect.value = "";
  timeOfDaySelect.value = "";
  pitSelect.value = "";
  fuelSelect.value = "";
  tireWearSelect.value = "";
  startTypeSelect.value = "";
  qualifyingSelect.value = "";
  bopSelect.value = "";

  myCombo.innerHTML = "";
  comboInfo.textContent = "";

  saveComboBtn.disabled = false;

  saveComboBtn.textContent =
    "➕ DODAJ MOJE COMBO";

}


function roundIsActive() {

  return (
    currentRound &&
    currentRound.status === "voting" &&
    Date.now() < Number(currentRound.endTime)
  );

}


classButtons.forEach(button => {

  button.addEventListener("click", () => {

    if (!roundIsActive()) return;

    const className =
      button.dataset.class;

    if (selectedClasses.includes(className)) {

      selectedClasses =
        selectedClasses.filter(
          item => item !== className
        );

      button.classList.remove("selected");

    } else {

      selectedClasses.push(className);

      button.classList.add("selected");

    }

  });

});


tireButtons.forEach(button => {

  button.addEventListener("click", () => {

    if (!roundIsActive()) return;

    const tireName =
      button.dataset.tire;

    if (selectedTires.includes(tireName)) {

      selectedTires =
        selectedTires.filter(
          item => item !== tireName
        );

      button.classList.remove("selected");

    } else {

      selectedTires.push(tireName);

      button.classList.add("selected");

    }

  });

});


raceTypeButtons.forEach(button => {

  button.addEventListener("click", () => {

    if (!roundIsActive()) return;

    selectedRaceType =
      button.dataset.raceType;

    raceTypeButtons.forEach(btn => {
      btn.classList.remove("selected");
    });

    button.classList.add("selected");

    if (selectedRaceType === "laps") {

      lapsBox.classList.remove("hidden");
      timeBox.classList.add("hidden");

    } else {

      lapsBox.classList.add("hidden");
      timeBox.classList.remove("hidden");

    }

  });

});


newRoundBtn.addEventListener(
  "click",
  async () => {

    if (
      adminPin.value.trim() !== ADMIN_PIN
    ) {

      adminInfo.textContent =
        "❌ Nieprawidłowy PIN.";

      adminInfo.style.color =
        "#ff5555";

      return;

    }


    const confirmStart = confirm(
      "Rozpocząć nową rundę na 5 minut?\n\n" +
      "Stare COMBO zostaną usunięte."
    );


    if (!confirmStart) return;


    try {

      newRoundBtn.disabled = true;

      adminInfo.textContent =
        "⏳ Usuwanie starej rundy...";

      adminInfo.style.color =
        "#ffe000";


      await remove(combosRef);


      const now = Date.now();


      await set(
        roundRef,
        {
          id: String(now),
          status: "voting",
          startTime: now,
          endTime: now + ROUND_TIME,
          winner: null,
          discordSent: false
        }
      );


      resetComboForm();

      adminPin.value = "";

      participantCount.textContent =
        "👥 0 osób dodało COMBO";


      officialResult.textContent =
        "🎰 Losowanie odbędzie się automatycznie po zakończeniu czasu.";


      adminInfo.textContent =
        "🟢 Nowa runda rozpoczęta od zera.";

      adminInfo.style.color =
        "#4ade80";

    }

    catch (error) {

      adminInfo.textContent =
        "❌ Błąd: " + error.message;

      adminInfo.style.color =
        "#ff5555";

    }


    newRoundBtn.disabled = false;

  }
);


saveComboBtn.addEventListener(
  "click",
  async () => {

    if (!roundIsActive()) {

      showError(
        "❌ Runda nie jest aktywna."
      );

      return;

    }


    const track =
      trackSelect.value;

    const weather =
      weatherSelect.value;

    const timeOfDay =
      timeOfDaySelect.value;

    const pit =
      pitSelect.value;

    const fuel =
      fuelSelect.value;

    const tireWear =
      tireWearSelect.value;

    const startType =
      startTypeSelect.value;

    const qualifying =
      qualifyingSelect.value;

    const bop =
      bopSelect.value;


    let raceLength = "";

    if (selectedRaceType === "laps") {

      const laps =
        Number(lapsInput.value);

      if (!laps || laps < 1) {

        showError(
          "❌ Podaj liczbę okrążeń."
        );

        return;

      }

      raceLength =
        laps + " okrążeń";

    }


    if (selectedRaceType === "time") {

      const raceMinutes =
        Number(raceTimeInput.value);

      if (!raceMinutes || raceMinutes < 1) {

        showError(
          "❌ Podaj czas trwania wyścigu."
        );

        return;

      }

      raceLength =
        raceMinutes + " minut";

    }


    if (!track) {
      showError("❌ Wybierz tor.");
      return;
    }

    if (selectedClasses.length === 0) {
      showError("❌ Wybierz klasę.");
      return;
    }

    if (selectedTires.length === 0) {
      showError("❌ Wybierz przynajmniej jedne opony.");
      return;
    }

    if (!weather) {
      showError("❌ Wybierz pogodę.");
      return;
    }

    if (!timeOfDay) {
      showError("❌ Wybierz porę dnia.");
      return;
    }

    if (!pit) {
      showError("❌ Wybierz PIT STOP.");
      return;
    }

    if (!fuel) {
      showError("❌ Wybierz zużycie paliwa.");
      return;
    }

    if (!tireWear) {
      showError("❌ Wybierz zużycie opon.");
      return;
    }

    if (!startType) {
      showError("❌ Wybierz typ startu.");
      return;
    }

    if (!qualifying) {
      showError("❌ Wybierz kwalifikacje.");
      return;
    }

    if (!bop) {
      showError("❌ Wybierz BOP.");
      return;
    }


    saveComboBtn.disabled = true;


    try {

      await set(
        ref(
          database,
          "srsLobbyCombos/" + playerId
        ),
        {
          playerId: playerId,

          roundId: currentRound.id,

          track: track,

          classes: selectedClasses,

          raceType: selectedRaceType,

          raceLength: raceLength,

          weather: weather,

          timeOfDay: timeOfDay,

          tires: selectedTires,

          pit: pit,

          fuel: fuel,

          tireWear: tireWear,

          startType: startType,

          qualifying: qualifying,

          bop: bop,

          time: Date.now()
        }
      );


      comboInfo.textContent =
        "✅ COMBO zapisane.";

      comboInfo.style.color =
        "#4ade80";


      saveComboBtn.textContent =
        "✏️ ZMIEŃ MOJE COMBO";

    }

    catch (error) {

      showError(
        "❌ Błąd: " + error.message
      );

    }


    saveComboBtn.disabled = false;

  }
);


function randomItem(array) {

  return array[
    Math.floor(
      Math.random() * array.length
    )
  ];

}


async function sendWinnerToDiscord(winner) {

  if (
    !DISCORD_WEBHOOK ||
    DISCORD_WEBHOOK ===
      "WKLEJ_TUTAJ_WEBHOOK"
  ) {

    console.log(
      "Nie ustawiono webhooka Discorda."
    );

    return false;

  }


  const classes =
    Array.isArray(winner.classes)
      ? winner.classes.join(" + ")
      : winner.classes;


  const tires =
    Array.isArray(winner.tires)
      ? winner.tires.join(" + ")
      : winner.tires;


  const classType =
    Array.isArray(winner.classes) &&
    winner.classes.length > 1
      ? "🔵 MULTIKLASA"
      : "🏎️ KLASA AUT";


  const message = `
🏆 **SRS LOBBY COMBO – WYNIK LOSOWANIA** 🏆

━━━━━━━━━━━━━━━━━━

🏁 **TOR**
**${winner.track}**

${classType}
**${classes}**

🏁 **DŁUGOŚĆ WYŚCIGU**
**${winner.raceLength}**

🌦️ **POGODA**
**${winner.weather}**

🌅 **PORA DNIA**
**${winner.timeOfDay}**

🛞 **OPONY**
**${tires}**

🔧 **PIT STOP**
**${winner.pit}**

⛽ **ZUŻYCIE PALIWA**
**${winner.fuel}**

🛞 **ZUŻYCIE OPON**
**${winner.tireWear}**

🚦 **TYP STARTU**
**${winner.startType}**

⏱️ **KWALIFIKACJE**
**${winner.qualifying}**

⚖️ **BOP**
**${winner.bop}**

━━━━━━━━━━━━━━━━━━

🎮 **SRS LOBBY COMBO**
🏁 Wynik został wylosowany automatycznie.
`;


  try {

    const response =
      await fetch(
        DISCORD_WEBHOOK,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              username:
                "SRS LOBBY COMBO",

              content:
                message
            })
        }
      );


    if (!response.ok) {

      console.error(
        "Błąd wysyłania Discord:",
        response.status
      );

      return false;

    }


    return true;

  }

  catch (error) {

    console.error(
      "Błąd webhooka:",
      error
    );

    return false;

  }

}


async function finishRound() {

  if (
    finishingRound ||
    !currentRound
  ) return;


  finishingRound = true;


  try {

    const roundSnapshot =
      await get(roundRef);

    const latestRound =
      roundSnapshot.val();


    if (
      !latestRound ||
      latestRound.status !== "voting" ||
      Date.now() <
        Number(latestRound.endTime)
    ) {

      finishingRound = false;
      return;

    }


    const combosSnapshot =
      await get(combosRef);

    const allCombos =
      combosSnapshot.val() || {};


    const combos =
      Object.values(allCombos)
        .filter(
          combo =>
            combo.roundId === latestRound.id
        );


    if (combos.length === 0) {

      await set(
        roundRef,
        {
          ...latestRound,
          status: "finished",
          winner: null,
          finishedAt: Date.now()
        }
      );

      finishingRound = false;
      return;

    }


    const winner =
      randomItem(combos);


    const result =
      await runTransaction(
        roundRef,
        current => {

          if (
            !current ||
            current.status !== "voting" ||
            Date.now() <
              Number(current.endTime)
          ) {
            return;
          }


          return {
            ...current,
            status: "finished",
            winner: winner,
            finishedAt: Date.now(),
            discordSent: false
          };

        }
      );


    if (!result.committed) {

      finishingRound = false;
      return;

    }


    const updatedRound =
      result.snapshot.val();


    if (
      updatedRound &&
      updatedRound.winner &&
      !updatedRound.discordSent
    ) {

      const sent =
        await sendWinnerToDiscord(
          updatedRound.winner
        );


      if (sent) {

        await runTransaction(
          roundRef,
          current => {

            if (
              !current ||
              current.id !== updatedRound.id ||
              current.discordSent
            ) {
              return;
            }


            return {
              ...current,
              discordSent: true,
              discordSentAt: Date.now()
            };

          }
        );

      }

    }

  }

  catch (error) {

    console.error(
      "Błąd losowania:",
      error
    );

  }


  finishingRound = false;

}


function updateCountdown() {

  if (
    !currentRound ||
    currentRound.status !== "voting"
  ) return;


  const left =
    Number(currentRound.endTime) -
    Date.now();


  if (left <= 0) {

    countdown.textContent =
      "00:00";

    finishRound();

    return;

  }


  const seconds =
    Math.floor(left / 1000);

  const minutes =
    Math.floor(seconds / 60);

  const remainingSeconds =
    seconds % 60;


  countdown.textContent =
    String(minutes).padStart(2, "0") +
    ":" +
    String(remainingSeconds)
      .padStart(2, "0");

}


function renderRound() {

  if (!currentRound) {

    phaseStatus.textContent =
      "⏳ BRAK AKTYWNEJ RUNDY";

    phaseStatus.style.color =
      "#ddd";

    countdown.textContent =
      "00:00";

    phaseInfo.textContent =
      "Czekamy na rozpoczęcie nowej rundy.";

    comboSection.classList.add(
      "hidden"
    );

    officialResult.textContent =
      "Wynik pojawi się po zakończeniu czasu.";

    return;

  }


  if (
    currentRound.status === "voting"
  ) {

    if (roundIsActive()) {

      phaseStatus.textContent =
        "🟢 DODAWANIE COMBO TRWA";

      phaseStatus.style.color =
        "#4ade80";

      phaseInfo.textContent =
        "Dodaj swoje COMBO przed końcem czasu.";

      comboSection.classList.remove(
        "hidden"
      );

      officialResult.textContent =
        "🎰 Losowanie odbędzie się automatycznie po zakończeniu czasu.";

    }

    else {

      phaseStatus.textContent =
        "🎰 AUTOMATYCZNE LOSOWANIE...";

      phaseStatus.style.color =
        "#ffe000";

      phaseInfo.textContent =
        "System losuje jedno COMBO.";

      comboSection.classList.add(
        "hidden"
      );

      finishRound();

    }

  }


  if (
    currentRound.status === "finished"
  ) {

    phaseStatus.textContent =
      "🏆 COMBO WYLOSOWANE";

    phaseStatus.style.color =
      "#ff6666";

    countdown.textContent =
      "00:00";

    phaseInfo.textContent =
      "Admin może rozpocząć nową rundę.";

    comboSection.classList.add(
      "hidden"
    );


    const winner =
      currentRound.winner;


    if (!winner) {

      officialResult.textContent =
        "❌ Nikt nie dodał COMBO.";

      return;

    }


    const classes =
      Array.isArray(winner.classes)
        ? winner.classes.join(" + ")
        : winner.classes;


    const tires =
      Array.isArray(winner.tires)
        ? winner.tires.join(" + ")
        : winner.tires;


    const classType =
      Array.isArray(winner.classes) &&
      winner.classes.length > 1
        ? "🔵 MULTIKLASA"
        : "🏎️ KLASA AUT";


    officialResult.innerHTML = `

      <div class="result-title">
        🏁 WYBRANY TOR
      </div>

      <div class="result-value">
        ${winner.track}
      </div>

      <div class="result-title">
        ${classType}
      </div>

      <div class="result-value">
        ${classes}
      </div>

      <div class="result-title">
        🏁 DŁUGOŚĆ WYŚCIGU
      </div>

      <div class="result-value">
        ${winner.raceLength}
      </div>

      <div class="result-title">
        🌦️ POGODA
      </div>

      <div class="result-value">
        ${winner.weather}
      </div>

      <div class="result-title">
        🌅 PORA DNIA
      </div>

      <div class="result-value">
        ${winner.timeOfDay}
      </div>

      <div class="result-title">
        🛞 OPONY
      </div>

      <div class="result-value">
        ${tires}
      </div>

      <div class="result-title">
        🔧 PIT STOP
      </div>

      <div class="result-value">
        ${winner.pit}
      </div>

      <div class="result-title">
        ⛽ ZUŻYCIE PALIWA
      </div>

      <div class="result-value">
        ${winner.fuel}
      </div>

      <div class="result-title">
        🛞 ZUŻYCIE OPON
      </div>

      <div class="result-value">
        ${winner.tireWear}
      </div>

      <div class="result-title">
        🚦 TYP STARTU
      </div>

      <div class="result-value">
        ${winner.startType}
      </div>

      <div class="result-title">
        ⏱️ KWALIFIKACJE
      </div>

      <div class="result-value">
        ${winner.qualifying}
      </div>

      <div class="result-title">
        ⚖️ BOP
      </div>

      <div class="result-value">
        ${winner.bop}
      </div>

    `;

  }

}


onValue(
  roundRef,
  snapshot => {

    currentRound =
      snapshot.val();

    renderRound();
    updateCountdown();

  }
);


onValue(
  combosRef,
  snapshot => {

    currentCombos =
      snapshot.val() || {};


    if (!currentRound) {

      participantCount.textContent =
        "👥 0 osób dodało COMBO";

      return;

    }


    const combos =
      Object.values(currentCombos)
        .filter(
          combo =>
            combo.roundId === currentRound.id
        );


    participantCount.textContent =
      "👥 " +
      combos.length +
      " osób dodało COMBO";


    const mySavedCombo =
      currentCombos[playerId];


    if (
      mySavedCombo &&
      mySavedCombo.roundId ===
        currentRound.id
    ) {

      const myClasses =
        Array.isArray(mySavedCombo.classes)
          ? mySavedCombo.classes.join(" + ")
          : mySavedCombo.classes;


      const myTires =
        Array.isArray(mySavedCombo.tires)
          ? mySavedCombo.tires.join(" + ")
          : mySavedCombo.tires;


      myCombo.innerHTML = `

        <strong>
          ✅ TWOJE COMBO:
        </strong>

        <br><br>

        🏁 ${mySavedCombo.track}

        <br>

        🏎️ ${myClasses}

        <br>

        🏁 ${mySavedCombo.raceLength}

        <br>

        🌦️ ${mySavedCombo.weather}

        <br>

        🌅 ${mySavedCombo.timeOfDay}

        <br>

        🛞 ${myTires}

        <br>

        🔧 ${mySavedCombo.pit}

        <br>

        ⛽ Paliwo ${mySavedCombo.fuel}

        <br>

        🛞 Zużycie opon ${mySavedCombo.tireWear}

        <br>

        🚦 ${mySavedCombo.startType}

        <br>

        ⏱️ ${mySavedCombo.qualifying}

        <br>

        ⚖️ ${mySavedCombo.bop}

      `;

      saveComboBtn.textContent =
        "✏️ ZMIEŃ MOJE COMBO";

    }

    else {

      myCombo.innerHTML = "";

      saveComboBtn.textContent =
        "➕ DODAJ MOJE COMBO";

    }

  }
);


setInterval(
  () => {

    updateCountdown();

    if (
      currentRound &&
      currentRound.status === "voting" &&
      !roundIsActive()
    ) {

      finishRound();

    }

  },
  1000
);

</script>
