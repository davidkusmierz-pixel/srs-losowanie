<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SRS LOBBY COMBO</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      overflow-x: hidden;

      background:
        linear-gradient(
          rgba(5, 6, 12, 0.78),
          rgba(5, 6, 12, 0.96)
        ),
        url("background.png.png");

      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    .container {
      width: min(950px, 94%);
      margin: 0 auto;
      padding: 20px 0 60px;
    }

    h1 {
      text-align: center;
      font-size: clamp(32px, 7vw, 55px);
      margin: 15px 0 25px;
      text-shadow: 0 4px 25px black;
    }

    .card {
      background: rgba(14, 14, 25, 0.96);
      border-top: 1px solid #c90000;
      border-bottom: 1px solid #c90000;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.55);
    }

    .hidden {
      display: none !important;
    }

    button,
    input,
    select {
      font-family: inherit;
    }

    button {
      border: none;
      border-radius: 12px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    /* ADMIN */

    .admin-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    #adminPin {
      width: 220px;
      height: 58px;
      border-radius: 12px;
      border: 1px solid #555;
      background: #171722;
      color: white;
      text-align: center;
      font-size: 17px;
      padding: 0 15px;
    }

    #newRoundBtn {
      width: 260px;
      height: 58px;
      font-size: 17px;

      background:
        linear-gradient(
          135deg,
          #f00000,
          #a00000
        );
    }

    #adminInfo {
      min-height: 24px;
      margin-top: 12px;
      text-align: center;
      color: #aaa;
    }

    /* STATUS */

    .status-card {
      text-align: center;
    }

    #phaseStatus {
      font-size: clamp(24px, 5vw, 31px);
      font-weight: bold;
      margin-bottom: 15px;
    }

    #countdown {
      font-size: clamp(55px, 12vw, 82px);
      font-weight: bold;
      color: #ffe500;
      line-height: 1.1;
      text-shadow:
        0 0 25px rgba(255,220,0,0.35);
    }

    #phaseInfo {
      margin-top: 15px;
      color: #ccc;
    }

    /* SEKCJE */

    .section-title {
      text-align: center;
      font-size: clamp(21px, 4vw, 27px);
      font-weight: bold;
      margin-bottom: 20px;
    }

    .label {
      display: block;
      margin: 22px 0 9px;
      font-weight: bold;
      color: #ddd;
    }

    select,
    input[type="number"] {
      width: 100%;
      min-height: 52px;
      border-radius: 10px;
      border: 1px solid #555;
      background: #171722;
      color: white;
      padding: 0 15px;
      font-size: 16px;
    }

    /* PRZYCISKI KLAS */

    .classes,
    .tires {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }

    .class-btn,
    .tire-btn {
      min-height: 70px;
      padding: 10px;
      background: #171722;
      border: 2px solid #444;
      font-size: 15px;
    }

    .class-btn.selected {
      border-color: #ff2020;

      background:
        linear-gradient(
          135deg,
          #670000,
          #260000
        );
    }

    .tire-btn.selected {
      border-color: #ffe000;

      background:
        linear-gradient(
          135deg,
          #5a4a00,
          #272100
        );
    }

    /* DYSTANS */

    .race-mode {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .race-mode-btn {
      min-height: 58px;
      background: #171722;
      border: 2px solid #444;
      font-size: 16px;
    }

    .race-mode-btn.selected {
      border-color: #ff2020;

      background:
        linear-gradient(
          135deg,
          #670000,
          #260000
        );
    }

    .race-mode-content {
      margin-top: 12px;
    }

    #saveComboBtn {
      width: 100%;
      min-height: 60px;
      margin-top: 28px;
      font-size: 18px;

      background:
        linear-gradient(
          135deg,
          #e30000,
          #850000
        );
    }

    #comboInfo {
      margin-top: 15px;
      text-align: center;
      min-height: 24px;
    }

    .my-combo {
      margin-top: 18px;
      padding: 15px;
      border: 1px solid #444;
      border-radius: 12px;
      background: rgba(0,0,0,0.2);
      text-align: center;
      line-height: 1.9;
    }

    /* UCZESTNICY */

    .participant-count {
      text-align: center;
      font-size: 20px;
      color: #ffe000;
    }

    /* WYNIK */

    .result {
      text-align: center;
      line-height: 1.8;
    }

    .result-title {
      color: #ffe000;
      font-size: 18px;
      margin-top: 15px;
    }

    .result-value {
      font-size: clamp(21px, 5vw, 32px);
      font-weight: bold;
      color: #ff6666;
      word-break: break-word;
    }

    @media (max-width: 850px) {
      .classes,
      .tires {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 600px) {
      .classes,
      .tires {
        grid-template-columns: repeat(2, 1fr);
      }

      .admin-row {
        flex-direction: column;
      }

      #adminPin,
      #newRoundBtn {
        width: 100%;
      }
    }

    @media (max-width: 450px) {
      .container {
        width: 100%;
      }

      .card {
        padding: 20px 14px;
      }

      h1 {
        font-size: 35px;
      }
    }

  </style>
</head>

    qualifyingSelect.value =
      "";

    bopSelect.value =
      "";


    myCombo.innerHTML =
      "";

    myCombo.classList.add(
      "hidden"
    );


    comboInfo.textContent =
      "";


    saveComboBtn.disabled =
      false;

    saveComboBtn.textContent =
      "➕ DODAJ MOJE COMBO";

  }


  // ==========================================
  // SPRAWDZENIE RUNDY
  // ==========================================

  function roundIsActive() {

    return (
      currentRound &&
      currentRound.status === "voting" &&
      Date.now() <
      Number(currentRound.endTime)
    );

  }


  // ==========================================
  // WYBÓR OKRĄŻEŃ / CZASU
  // ==========================================

  lapsModeBtn.addEventListener(
    "click",
    () => {

      if (!roundIsActive()) {
        return;
      }

      raceMode =
        "laps";

      lapsModeBtn.classList.add(
        "selected"
      );

      timeModeBtn.classList.remove(
        "selected"
      );

      lapsModeContent.classList.remove(
        "hidden"
      );

      timeModeContent.classList.add(
        "hidden"
      );

    }
  );


  timeModeBtn.addEventListener(
    "click",
    () => {

      if (!roundIsActive()) {
        return;
      }

      raceMode =
        "time";

      timeModeBtn.classList.add(
        "selected"
      );

      lapsModeBtn.classList.remove(
        "selected"
      );

      timeModeContent.classList.remove(
        "hidden"
      );

      lapsModeContent.classList.add(
        "hidden"
      );

    }
  );


  // ==========================================
  // NOWA RUNDA
  // ==========================================

  newRoundBtn.addEventListener(
    "click",
    async () => {

      if (
        adminPin.value.trim() !==
        ADMIN_PIN
      ) {

        adminInfo.textContent =
          "❌ Nieprawidłowy PIN.";

        adminInfo.style.color =
          "#ff5c8a";

        return;

      }


      const confirmStart =
        confirm(
          "Rozpocząć nową rundę na 5 minut?\n\n" +
          "Stare COMBO zostaną usunięte."
        );


      if (!confirmStart) {
        return;
      }


      try {

        newRoundBtn.disabled =
          true;


        adminInfo.textContent =
          "⏳ Usuwanie starej rundy...";

        adminInfo.style.color =
          "#ffe000";


        await remove(
          combosRef
        );


        const now =
          Date.now();


        await set(
          roundRef,
          {

            id:
              String(now),

            status:
              "voting",

            startTime:
              now,

            endTime:
              now + ROUND_TIME,

            winner:
              null,

            discordSent:
              false

          }
        );


        resetComboForm();


        adminPin.value =
          "";


        participantCount.textContent =
          "👥 0 osób dodało COMBO";


        officialResult.textContent =
          "🎰 Losowanie odbędzie się automatycznie po zakończeniu czasu.";


        adminInfo.textContent =
          "🟢 Nowa runda rozpoczęta.";

        adminInfo.style.color =
          "#4ade80";

      }

      catch (error) {

        adminInfo.textContent =
          "❌ Błąd: " +
          error.message;

        adminInfo.style.color =
          "#ff5c8a";

      }


      newRoundBtn.disabled =
        false;

    }
  );


  // ==========================================
  // WYBÓR KLAS
  // ==========================================

  classButtons.forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          if (!roundIsActive()) {
            return;
          }


          const className =
            button.dataset.class;


          if (
            selectedClasses.includes(
              className
            )
          ) {

            selectedClasses =
              selectedClasses.filter(
                item =>
                  item !== className
              );


            button.classList.remove(
              "selected"
            );

          }

          else {

            selectedClasses.push(
              className
            );


            button.classList.add(
              "selected"
            );

          }

        }
      );

    }
  );


  // ==========================================
  // WYBÓR OPON
  // ==========================================

  tireButtons.forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          if (!roundIsActive()) {
            return;
          }


          const tire =
            button.dataset.tire;


          if (
            selectedTires.includes(
              tire
            )
          ) {

            selectedTires =
              selectedTires.filter(
                item =>
                  item !== tire
              );


            button.classList.remove(
              "selected"
            );

          }

          else {

            selectedTires.push(
              tire
            );


            button.classList.add(
              "selected"
            );

          }

        }
      );

    }
  );


  // ==========================================
  // ZAPIS COMBO
  // ==========================================

  saveComboBtn.addEventListener(
    "click",
    async () => {

      if (!roundIsActive()) {

        showError(
          "❌ Runda nie jest aktywna."
        );

        return;

      }


      const track =
        trackSelect.value;


      const weather =
        weatherSelect.value;


      const timeOfDay =
        timeOfDaySelect.value;


      const pit =
        pitSelect.value;


      const fuel =
        fuelSelect.value;


      const tireWear =
        tireWearSelect.value;


      const startType =
        startTypeSelect.value;


      const qualifying =
        qualifyingSelect.value;


      const bop =
        bopSelect.value;


      let raceDistance =
        "";


      if (
        raceMode === "laps"
      ) {

        const laps =
          Number(
            lapsInput.value
          );


        if (
          !laps ||
          laps < 1
        ) {

          showError(
            "❌ Podaj liczbę okrążeń."
          );

          return;

        }


        raceDistance =
          laps + " okrążeń";

      }


      if (
        raceMode === "time"
      ) {

        if (
          !raceTimeSelect.value
        ) {

          showError(
            "❌ Wybierz czas wyścigu."
          );

          return;

        }


        raceDistance =
          raceTimeSelect.value;

      }


      if (!track) {

        showError(
          "❌ Wybierz tor."
        );

        return;

      }


      if (
        selectedClasses.length === 0
      ) {

        showError(
          "❌ Wybierz klasę."
        );

        return;

      }


      if (
        selectedTires.length === 0
      ) {

        showError(
          "❌ Wybierz przynajmniej jedną oponę."
        );

        return;

      }


      if (!weather) {

        showError(
          "❌ Wybierz pogodę."
        );

        return;

      }


      if (!timeOfDay) {

        showError(
          "❌ Wybierz porę dnia."
        );

        return;

      }


      if (!pit) {

        showError(
          "❌ Wybierz PIT STOP."
        );

        return;

      }


      if (!fuel) {

        showError(
          "❌ Wybierz zużycie paliwa."
        );

        return;

      }


      if (!tireWear) {

        showError(
          "❌ Wybierz zużycie opon."
        );

        return;

      }


      if (!startType) {

        showError(
          "❌ Wybierz typ startu."
        );

        return;

      }


      if (!qualifying) {

        showError(
          "❌ Wybierz kwalifikacje."
        );

        return;

      }


      if (!bop) {

        showError(
          "❌ Wybierz BOP."
        );

        return;

      }


      saveComboBtn.disabled =
        true;


      try {

        await set(
          ref(
            database,
            "srsLobbyCombos/" +
            playerId
          ),
          {

            playerId:
              playerId,

            roundId:
              currentRound.id,

            track:
              track,

            classes:
              selectedClasses,

            raceMode:
              raceMode,

            raceDistance:
              raceDistance,

            tires:
              selectedTires,

            weather:
              weather,

            timeOfDay:
              timeOfDay,

            pit:
              pit,

            fuel:
              fuel,

            tireWear:
              tireWear,

            startType:
              startType,

            qualifying:
              qualifying,

            bop:
              bop,

            time:
              Date.now()

          }
        );


        comboInfo.textContent =
          "✅ COMBO zapisane.";

        comboInfo.style.color =
          "#4ade80";


        saveComboBtn.textContent =
          "✏️ ZMIEŃ MOJE COMBO";

      }

      catch (error) {

        showError(
          "❌ Błąd: " +
          error.message
        );

      }


      saveComboBtn.disabled =
        false;

    }
  );


  function showError(message) {

    comboInfo.textContent =
      message;

    comboInfo.style.color =
      "#ff5c8a";

  }


  // ==========================================
  // LOSOWANIE
  // ==========================================

  function randomItem(array) {

    return array[
      Math.floor(
        Math.random() *
        array.length
      )
    ];

  }


  // ==========================================
  // DISCORD
  // ==========================================

  async function sendWinnerToDiscord(
    winner
  ) {

    if (!DISCORD_WEBHOOK) {
      return false;
    }


    const classes =
      Array.isArray(
        winner.classes
      )
        ? winner.classes.join(" + ")
        : winner.classes;


    const tires =
      Array.isArray(
        winner.tires
      )
        ? winner.tires.join(" + ")
        : winner.tires;


    const classType =
      Array.isArray(
        winner.classes
      ) &&
      winner.classes.length > 1
        ? "🔵 MULTIKLASA"
        : "🏎️ KLASA AUT";


    const message = `
🏆 **SRS LOBBY COMBO – WYNIK LOSOWANIA** 🏆

━━━━━━━━━━━━━━━━━━

🏁 **TOR**
**${winner.track}**

${classType}
**${classes}**

⏱️ **DŁUGOŚĆ WYŚCIGU**
**${winner.raceDistance}**

🌦️ **POGODA**
**${winner.weather}**

🌅 **PORA DNIA**
**${winner.timeOfDay}**

🛞 **OPONY**
**${tires}**

🔧 **PIT STOP**
**${winner.pit}**

⛽ **ZUŻYCIE PALIWA**
**${winner.fuel}**

🛞 **ZUŻYCIE OPON**
**${winner.tireWear}**

🚦 **TYP STARTU**
**${winner.startType}**

⏱️ **KWALIFIKACJE**
**${winner.qualifying}**

⚖️ **BOP**
**${winner.bop}**

━━━━━━━━━━━━━━━━━━

🎮 **SRS LOBBY COMBO**
🏁 Wynik został wylosowany automatycznie.
`;


    try {

      const response =
        await fetch(
          DISCORD_WEBHOOK,
          {

            method:
              "POST",

            headers:
              {
                "Content-Type":
                  "application/json"
              },

            body:
              JSON.stringify(
                {
                  username:
                    "SRS LOBBY COMBO",

                  content:
                    message
                }
              )

          }
        );


      return response.ok;

    }

    catch (error) {

      console.error(
        error
      );

      return false;

    }

  }


  // ==========================================
  // KOŃCZENIE RUNDY
  // ==========================================

  async function finishRound() {

    if (
      finishingRound ||
      !currentRound
    ) {
      return;
    }


    finishingRound =
      true;


    try {

      const roundSnapshot =
        await get(roundRef);


      const latestRound =
        roundSnapshot.val();


      if (
        !latestRound ||
        latestRound.status !==
          "voting" ||
        Date.now() <
          Number(
            latestRound.endTime
          )
      ) {

        finishingRound =
          false;

        return;

      }


      const combosSnapshot =
        await get(combosRef);


      const allCombos =
        combosSnapshot.val() ||
        {};


      const combos =
        Object.values(
          allCombos
        )
        .filter(
          combo =>
            combo.roundId ===
            latestRound.id
        );


      if (
        combos.length === 0
      ) {

        await set(
          roundRef,
          {

            ...latestRound,

            status:
              "finished",

            winner:
              null,

            finishedAt:
              Date.now()

          }
        );


        finishingRound =
          false;

        return;

      }


      const winner =
        randomItem(
          combos
        );


      const result =
        await runTransaction(
          roundRef,
          current => {

            if (
              !current ||
              current.status !==
                "voting" ||
              Date.now() <
                Number(
                  current.endTime
                )
            ) {
              return;
            }


            return {

              ...current,

              status:
                "finished",

              winner:
                winner,

              finishedAt:
                Date.now(),

              discordSent:
                false

            };

          }
        );


      if (!result.committed) {

        finishingRound =
          false;

        return;

      }


      const updatedRound =
        result.snapshot.val();


      if (
        updatedRound &&
        updatedRound.winner &&
        !updatedRound.discordSent
      ) {

        const sent =
          await sendWinnerToDiscord(
            updatedRound.winner
          );


        if (sent) {

          await runTransaction(
            roundRef,
            current => {

              if (
                !current ||
                current.discordSent
              ) {
                return;
              }


              return {

                ...current,

                discordSent:
                  true,

                discordSentAt:
                  Date.now()

              };

            }
          );

        }

      }

    }

    catch (error) {

      console.error(
        "Błąd losowania:",
        error
      );

    }


    finishingRound =
      false;

  }


  // ==========================================
  // LICZNIK
  // ==========================================

  function updateCountdown() {

    if (
      !currentRound ||
      currentRound.status !==
        "voting"
    ) {
      return;
    }


    const left =
      Number(
        currentRound.endTime
      ) -
      Date.now();


    if (left <= 0) {

      countdown.textContent =
        "00:00";

      finishRound();

      return;

    }


    const seconds =
      Math.ceil(
        left / 1000
      );


    const minutes =
      Math.floor(
        seconds / 60
      );


    const remainingSeconds =
      seconds % 60;


    countdown.textContent =
      String(minutes)
        .padStart(2, "0") +
      ":" +
      String(
        remainingSeconds
      )
        .padStart(2, "0");

  }


  // ==========================================
  // WYSWIETLANIE RUNDY
  // ==========================================

  function renderRound() {

    if (!currentRound) {

      phaseStatus.textContent =
        "⏳ BRAK AKTYWNEJ RUNDY";

      phaseStatus.style.color =
        "#ddd";

      countdown.textContent =
        "00:00";

      phaseInfo.textContent =
        "Czekamy na rozpoczęcie nowej rundy.";

      comboSection.classList.add(
        "hidden"
      );

      officialResult.textContent =
        "Wynik pojawi się po zakończeniu czasu.";

      return;

    }


    if (
      currentRound.status ===
      "voting"
    ) {

      if (roundIsActive()) {

        phaseStatus.textContent =
          "🟢 DODAWANIE COMBO TRWA";

        phaseStatus.style.color =
          "#4ade80";

        phaseInfo.textContent =
          "Dodaj swoje COMBO przed końcem czasu.";

        comboSection.classList.remove(
          "hidden"
        );


        officialResult.textContent =
          "🎰 Losowanie odbędzie się automatycznie po zakończeniu czasu.";

      }

      else {

        phaseStatus.textContent =
          "🎰 AUTOMATYCZNE LOSOWANIE...";

        phaseStatus.style.color =
          "#ffe000";

        phaseInfo.textContent =
          "System losuje jedno COMBO.";

        comboSection.classList.add(
          "hidden"
        );

        finishRound();

      }

    }


    if (
      currentRound.status ===
      "finished"
    ) {

      phaseStatus.textContent =
        "🏆 COMBO WYLOSOWANE";

      phaseStatus.style.color =
        "#ff6666";

      countdown.textContent =
        "00:00";

      phaseInfo.textContent =
        "Admin może rozpocząć nową rundę.";

      comboSection.classList.add(
        "hidden"
      );


      const winner =
        currentRound.winner;


      if (!winner) {

        officialResult.textContent =
          "❌ Nikt nie dodał COMBO.";

        return;

      }


      const classes =
        Array.isArray(
          winner.classes
        )
          ? winner.classes.join(" + ")
          : winner.classes;


      const tires =
        Array.isArray(
          winner.tires
        )
          ? winner.tires.join(" + ")
          : winner.tires;


      officialResult.innerHTML =
        `
          <div class="result-title">
            🏁 WYBRANY TOR
          </div>

          <div class="result-value">
            ${winner.track}
          </div>

          <div class="result-title">
            🏎️ KLASA AUT
          </div>

          <div class="result-value">
            ${classes}
          </div>

          <div class="result-title">
            ⏱️ DŁUGOŚĆ WYŚCIGU
          </div>

          <div class="result-value">
            ${winner.raceDistance}
          </div>

          <div class="result-title">
            🌦️ POGODA
          </div>

          <div class="result-value">
            ${winner.weather}
          </div>

          <div class="result-title">
            🌅 PORA DNIA
          </div>

          <div class="result-value">
            ${winner.timeOfDay}
          </div>

          <div class="result-title">
            🛞 OPONY
          </div>

          <div class="result-value">
            ${tires}
          </div>

          <div class="result-title">
            🔧 PIT STOP
          </div>

          <div class="result-value">
            ${winner.pit}
          </div>

          <div class="result-title">
            ⛽ ZUŻYCIE PALIWA
          </div>

          <div class="result-value">
            ${winner.fuel}
          </div>

          <div class="result-title">
            🛞 ZUŻYCIE OPON
          </div>

          <div class="result-value">
            ${winner.tireWear}
          </div>

          <div class="result-title">
            🚦 TYP STARTU
          </div>

          <div class="result-value">
            ${winner.startType}
          </div>

          <div class="result-title">
            ⏱️ KWALIFIKACJE
          </div>

          <div class="result-value">
            ${winner.qualifying}
          </div>

          <div class="result-title">
            ⚖️ BOP
          </div>

          <div class="result-value">
            ${winner.bop}
          </div>
        `;

    }

  }


  // ==========================================
  // NASŁUCHIWANIE FIREBASE
  // ==========================================

  onValue(
    roundRef,
    snapshot => {

      currentRound =
        snapshot.val();

      renderRound();

      updateCountdown();

    }
  );


  onValue(
    combosRef,
    snapshot => {

      currentCombos =
        snapshot.val() ||
        {};


      if (!currentRound) {

        participantCount.textContent =
          "👥 0 osób dodało COMBO";

        return;

      }


      const combos =
        Object.values(
          currentCombos
        )
        .filter(
          combo =>
            combo.roundId ===
            currentRound.id
        );


      participantCount.textContent =
        "👥 " +
        combos.length +
        " osób dodało COMBO";


      const mySavedCombo =
        currentCombos[playerId];


      if (
        mySavedCombo &&
        mySavedCombo.roundId ===
          currentRound.id
      ) {

        const myClasses =
          Array.isArray(
            mySavedCombo.classes
          )
            ? mySavedCombo.classes.join(" + ")
            : mySavedCombo.classes;


        const myTires =
          Array.isArray(
            mySavedCombo.tires
          )
            ? mySavedCombo.tires.join(" + ")
            : mySavedCombo.tires;


        myCombo.classList.remove(
          "hidden"
        );


        myCombo.innerHTML =
          `
            <strong>
              ✅ TWOJE COMBO
            </strong>

            <br><br>

            🏁 ${mySavedCombo.track}

            <br>

            🏎️ ${myClasses}

            <br>

            ⏱️ ${mySavedCombo.raceDistance}

            <br>

            🌦️ ${mySavedCombo.weather}

            <br>

            🌅 ${mySavedCombo.timeOfDay}

            <br>

            🛞 ${myTires}

            <br>

            🔧 ${mySavedCombo.pit}

            <br>

            ⛽ Paliwo:
            ${mySavedCombo.fuel}

            <br>

            🛞 Zużycie opon:
            ${mySavedCombo.tireWear}

            <br>

            🚦 ${mySavedCombo.startType}

            <br>

            ⏱️ Kwalifikacje:
            ${mySavedCombo.qualifying}

            <br>

            ⚖️ ${mySavedCombo.bop}
          `;

      }

      else {

        myCombo.innerHTML =
          "";

        myCombo.classList.add(
          "hidden"
        );

      }

    }
  );


  // ==========================================
  // TIMER
  // ==========================================

  setInterval(
    () => {

      updateCountdown();


      if (
        currentRound &&
        currentRound.status ===
          "voting" &&
        !roundIsActive()
      ) {

        finishRound();

      }

    },
    1000
  );

</script>

</body>
</html>
