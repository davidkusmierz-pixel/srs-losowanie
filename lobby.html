<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SRS LOBBY COMBO</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: white;

      background:
        linear-gradient(
          rgba(5, 6, 12, 0.75),
          rgba(5, 6, 12, 0.94)
        ),
        url("background.png.png");

      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    .container {
      width: min(950px, 94%);
      margin: auto;
      padding: 20px 0 60px;
    }

    h1 {
      text-align: center;
      font-size: clamp(32px, 7vw, 55px);
      margin: 15px 0 25px;
      text-shadow: 0 4px 25px black;
    }

    .card {
      background: rgba(10, 11, 20, 0.94);
      border: 1px solid rgba(220, 0, 0, 0.55);
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 20px;

      box-shadow:
        0 10px 35px rgba(0,0,0,0.6),
        0 0 30px rgba(180,0,0,0.08);
    }

    .hidden {
      display: none !important;
    }

    button,
    input,
    select {
      font-family: inherit;
    }

    button {
      border: none;
      border-radius: 11px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .admin-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    #adminPin,
    #roundEndDateTime {
      min-height: 58px;
      border-radius: 11px;
      border: 1px solid #555;
      background: #15151d;
      color: white;
      padding: 0 15px;
      font-size: 16px;
    }

    #adminPin {
      width: 220px;
      text-align: center;
    }

    #roundEndDateTime {
      flex: 1;
      min-width: 250px;
    }

    #newRoundBtn {
      min-width: 220px;
      height: 58px;
      font-size: 17px;

      background:
        linear-gradient(
          135deg,
          #e30000,
          #850000
        );
    }

    #adminInfo {
      margin-top: 12px;
      text-align: center;
      min-height: 20px;
      color: #aaa;
    }

    .status-card {
      text-align: center;
    }

    #phaseStatus {
      font-size: clamp(24px, 5vw, 31px);
      font-weight: bold;
      margin-bottom: 15px;
    }

    #countdown {
      font-size: clamp(45px, 11vw, 82px);
      font-weight: bold;
      color: #ffe000;
      line-height: 1;

      text-shadow:
        0 0 25px rgba(255,220,0,0.35);
    }

    #phaseInfo {
      margin-top: 15px;
      color: #ccc;
    }

    .section-title {
      text-align: center;
      font-size: clamp(21px, 4vw, 27px);
      font-weight: bold;
      margin-bottom: 20px;
    }

    .label {
      display: block;
      margin: 20px 0 8px;
      font-weight: bold;
      color: #ddd;
    }

    select,
    input[type="number"],
    input[type="text"] {
      width: 100%;
      min-height: 52px;
      border-radius: 10px;
      border: 1px solid #555;
      background: #15151d;
      color: white;
      padding: 0 15px;
      font-size: 16px;
    }

    .classes,
    .tire-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .class-btn,
    .tire-btn,
    .mandatory-tire-btn {
      min-height: 65px;
      background: #15151d;
      border: 2px solid #444;
      font-size: 15px;
      padding: 8px;
    }

    .class-btn.selected,
    .tire-btn.selected,
    .mandatory-tire-btn.selected {
      border-color: #ff2020;

      background:
        linear-gradient(
          135deg,
          #5e0000,
          #210000
        );
    }

    /*
      OPONY Z INNEJ KATEGORII
      SĄ WYSZARZONE
    */

    .tire-btn.locked,
    .mandatory-tire-btn.locked {
      opacity: 0.25;
      cursor: not-allowed;
      border-color: #333;
    }

    .race-type-buttons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .race-type-btn {
      min-height: 58px;
      background: #15151d;
      border: 2px solid #444;
      font-size: 16px;
    }

    .race-type-btn.selected {
      border-color: #ff2020;

      background:
        linear-gradient(
          135deg,
          #5e0000,
          #210000
        );
    }

    #saveComboBtn {
      width: 100%;
      min-height: 58px;
      margin-top: 25px;
      font-size: 18px;

      background:
        linear-gradient(
          135deg,
          #e30000,
          #850000
        );
    }

    #comboInfo {
      margin-top: 15px;
      text-align: center;
      min-height: 22px;
    }

    .participant-count {
      text-align: center;
      font-size: 20px;
      color: #ffe000;
    }

    .my-combo,
    .result {
      margin-top: 15px;
      text-align: center;
      line-height: 1.8;
    }

    .result-title {
      color: #ffe000;
      font-size: 20px;
      margin-top: 15px;
      font-weight: bold;
    }

    .result-value {
      font-size: clamp(21px, 5vw, 32px);
      font-weight: bold;
      color: #ff6666;
    }

    @media (max-width: 650px) {

      .classes,
      .tire-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .admin-row {
        flex-direction: column;
      }

      #adminPin,
      #roundEndDateTime,
      #newRoundBtn {
        width: 100%;
      }
    }
  
.combo-header{font-size:20px;margin-bottom:16px}.combo-block{padding:9px 0;line-height:1.5}.combo-block strong{display:block;font-size:14px;margin-bottom:3px}.my-combo hr{border:0;border-top:1px solid rgba(255,255,255,.18);margin:12px 0}.combo-footer{text-align:center;font-weight:700;padding-top:6px}
</style>
</head>

  function resetComboForm() {

    selectedClasses =

        button.classList.remove(

      }

      "hidden"

    );


    lapsInput.value =

    raceTimeInput.value =
      "";


    weatherSelect.value =
      "";

    timeOfDaySelect.value =
      "";


    // ======================================
    // RESET OPON
    // ======================================

      [];

    selectedMandatoryTires =
      [];

    anyRacingTiresSelected =

    selectedTireCategory =
      null;


    tireButtons.forEach(
      button => {

        button.classList.remove(
          "selected"
        );

        button.classList.remove(
          "locked"
        );

      }

    mandatoryTireButtons.forEach(
      button => {

        button.classList.remove(

        );

        button.classList.remove(
          "locked"
        );

      }
    );


    mandatoryTiresMode.value =
      "";

    mandatoryTiresSection.classList.add(
      "hidden"
    );


    // ======================================
    // RESZTA
    // ======================================

    pitSelect.value =
      "";

    fuelSelect.value =
      "";

    tireWearSelect.value =
      "";

    startTypeSelect.value =
      "";

    qualifyingSelect.value =
      "";

    bopSelect.value =
      "";


    myCombo.innerHTML =
      "";

    comboInfo.textContent =
      "";

    saveComboBtn.disabled =
      false;

    saveComboBtn.textContent =
      "➕ DODAJ MOJE COMBO";

  // ==========================================
  // CZY RUNDA JEST AKTYWNA
  // ==========================================

  function roundIsActive() {

    return (

      currentRound &&

      currentRound.status ===
        "voting" &&

      Date.now() <
        Number(
          currentRound.endTime
        )

    );

  }


  // ==========================================
  // NOWA RUNDA
  // ==========================================

  newRoundBtn.addEventListener(
    "click",
    async () => {

      if (
        adminPin.value.trim() !==
        ADMIN_PIN
      ) {

        adminInfo.textContent =
          "❌ Nieprawidłowy PIN.";

        adminInfo.style.color =
          "#ff5555";

        return;

      }


      if (
        !roundEndDateTime.value
      ) {

        adminInfo.textContent =
          "❌ Wybierz datę i godzinę zakończenia.";

        adminInfo.style.color =
          "#ff5555";

        return;

      }


      const endTime =
        new Date(
          roundEndDateTime.value
        ).getTime();


      if (
        !endTime ||
        endTime <= Date.now()
      ) {

        adminInfo.textContent =
          "❌ Data zakończenia musi być w przyszłości.";

        adminInfo.style.color =
          "#ff5555";

        return;

      }


      const confirmStart =
        confirm(
          "Rozpocząć nową rundę?\n\n" +
          "Stare COMBO zostaną usunięte."
        );


      if (!confirmStart) {
        return;
      }


      try {

        newRoundBtn.disabled =
          true;

        adminInfo.textContent =
          "⏳ Tworzenie nowej rundy...";

        adminInfo.style.color =
          "#ffe000";


        // USUŃ STARE COMBO

        await remove(
          combosRef
        );


        const now =
          Date.now();


        // UTWÓRZ NOWĄ RUNDĘ

        await set(
          roundRef,
          {

            id:
              String(now),

            status:
              "voting",

            startTime:
              now,

            endTime:
              endTime,

            winner:
              null,

            discordSent:
              false

          }
        );


        // WYCZYŚĆ FORMULARZ

        resetComboForm();

        adminPin.value =
          "";


        adminInfo.textContent =
          "🟢 Nowa runda rozpoczęta.";

        adminInfo.style.color =
          "#4ade80";

      }

      catch (error) {

        adminInfo.textContent =
          "❌ Błąd: " +
          error.message;

        adminInfo.style.color =
          "#ff5555";

      }


      newRoundBtn.disabled =
        false;

    }
  );


  // ==========================================
  // KLASY
  // ==========================================

  classButtons.forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          if (
            !roundIsActive()
          ) {
            return;
          }


          const className =
            button.dataset.class;


          if (
            selectedClasses.includes(
              className
            )
          ) {

            selectedClasses =
              selectedClasses.filter(
                item =>
                  item !==
                  className
              );

            button.classList.remove(
              "selected"
            );

          }

          else {

            selectedClasses.push(
              className
            );

            button.classList.add(
              "selected"
            );

          }

        }
      );

    }
  );


  // ==========================================
  // TYP WYŚCIGU
  // ==========================================

  raceTypeButtons.forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          if (
            !roundIsActive()
          ) {
            return;

          selectedRaceType =
            button.dataset.raceType;


          raceTypeButtons.forEach(
            item => {

              item.classList.toggle(

            "laps"
          ) {

            lapsSection.classList.remove(

            raceTimeSection.classList.add(
              "hidden"
            );

          }

          else {

            lapsSection.classList.add(
              "hidden"
            );

            raceTimeSection.classList.remove(
              "hidden"
            );

          }

        }
      );

    }
  );


  // ==========================================
  // BLOKOWANIE KATEGORII OPON
  // ==========================================

  function updateTireLocks() {

    // DOSTĘPNE OPONY
    tireButtons.forEach(button => {

      if (!selectedTireCategory) {
        button.classList.remove("locked");
        return;
      }

      // "Dowolne opony" jest tylko dla kategorii wyścigowych.
      // Po jej zaznaczeniu wszystkie opony z pozostałych kategorii
      // są zablokowane.
      if (button.dataset.category !== selectedTireCategory) {
        button.classList.add("locked");
      } else {
        button.classList.remove("locked");
      }

    });

    // OBOWIĄZKOWE OPONY
    // Obowiązkowe są niezależne od tego, które mieszanki
    // zaznaczono w DOSTĘPNYCH, ale muszą być z tej samej kategorii.
    mandatoryTireButtons.forEach(button => {

      if (!selectedTireCategory) {
        button.classList.remove("locked");
        return;
      }

      if (button.dataset.category !== selectedTireCategory) {
        button.classList.add("locked");
      } else {
        button.classList.remove("locked");
      }

    });

  }


  // ==========================================
  // DOSTĘPNE OPONY
  // ==========================================

  tireButtons.forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          if (
            !roundIsActive()
          ) {
            return;
          }

          const tire =
            button.dataset.tire;

          const category =
            button.dataset.category;

          /*
            "Dowolne opony" istnieje tylko w kategorii
            WYŚCIGOWE i oznacza wszystkie 3 mieszanki
            wyścigowe.
          */

          if (
            tire ===
            "Dowolne opony"
          ) {

            if (
              selectedTireCategory &&
              selectedTireCategory !==
                "racing"
            ) {

              comboInfo.textContent =
                "⚠️ Dowolne opony można wybrać tylko dla opon wyścigowych.";

              comboInfo.style.color =
                "#ffe000";

              return;

            }

            if (
              !selectedTireCategory
            ) {

              selectedTireCategory =
                "racing";

              updateTireLocks();

            }

            anyRacingTiresSelected =
              !anyRacingTiresSelected;

            button.classList.toggle(
              "selected",
              anyRacingTiresSelected
            );

            /*
              Przy "Dowolne opony" wszystkie 3 wyścigowe
              są traktowane jako dostępne, ale nie musimy
              zaznaczać ich wizualnie jako osobnych wyborów.
            */

            comboInfo.textContent =
              anyRacingTiresSelected
                ? "✅ Dowolne opony wyścigowe — wszystkie mieszanki są dostępne."
                : "";

            comboInfo.style.color =
              "#4ade80";

            return;

          }


          /*
            Jeśli wybrano "Dowolne opony", nie pozwalamy
            osobno odznaczać / zmieniać jej działania.
            Wszystkie 3 wyścigowe pozostają dostępne.
          */

          if (
            anyRacingTiresSelected &&
            category ===
              "racing"
          ) {

            comboInfo.textContent =
              "ℹ️ Masz wybrane „Dowolne opony” — wszystkie mieszanki wyścigowe są już dostępne.";

            comboInfo.style.color =
              "#ffe000";

            return;

          }


          /*
            Zwykłe blokowanie kategorii:
            jedna kategoria na COMBO.
          */

          if (
            selectedTireCategory &&
            category !==
              selectedTireCategory
          ) {

            comboInfo.textContent =
              "⚠️ Możesz wybrać opony tylko z jednej kategorii.";

            comboInfo.style.color =
              "#ffe000";

            return;

          }


          if (
            !selectedTireCategory
          ) {

            selectedTireCategory =
              category;

            updateTireLocks();

          }


          if (
            selectedAvailableTires.includes(
              tire
            )
          ) {

            selectedAvailableTires =
              selectedAvailableTires.filter(
                item =>
                  item !==
                  tire
              );

            button.classList.remove(
              "selected"
            );

          }

          else {

            selectedAvailableTires.push(
              tire
            );

            button.classList.add(
              "selected"
            );

          }


          /*
            Jeżeli nie ma już żadnej zwykłej opony
            i nie ma "Dowolne opony", reset kategorii.
          */

          if (
            selectedAvailableTires.length ===
              0 &&
            !anyRacingTiresSelected
          ) {

            selectedTireCategory =
              null;

            selectedMandatoryTires =
              [];

            updateTireLocks();


            mandatoryTireButtons.forEach(
              item => {

                item.classList.remove(
                  "selected"
                );

              }
            );

          }

        }
      );

    }
  );


  // ==========================================
  // OPONY OBOWIĄZKOWE - TRYB
  // ==========================================

  mandatoryTiresMode.addEventListener(
    "change",
    () => {

      if (
        mandatoryTiresMode.value ===
        "required"
      ) {

        /*
          NAJPIERW MUSI BYĆ WYBRANA
          KATEGORIA DOSTĘPNYCH OPON
        */

        if (
          !selectedTireCategory
        ) {

          mandatoryTiresMode.value =
            "";

          comboInfo.textContent =
            "❌ Najpierw wybierz dostępne opony.";

          comboInfo.style.color =
            "#ff5555";

          mandatoryTiresSection.classList.add(
            "hidden"
          );

          return;

        }


        mandatoryTiresSection.classList.remove(
          "hidden"
        );


        updateTireLocks();

      }

      else {

        mandatoryTiresSection.classList.add(
          "hidden"
        );

        selectedMandatoryTires =
          [];


        mandatoryTireButtons.forEach(
          button => {

            button.classList.remove(
              "selected"
            );

          }
        );

      }

    }
  );


  // ==========================================
  // OPONY OBOWIĄZKOWE
  // ==========================================

  mandatoryTireButtons.forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          if (
            !roundIsActive()
          ) {
            return;
          }


          const tire =
            button.dataset.tire;

          const category =
            button.dataset.category;


          /*
            MUSI BYĆ TA SAMA KATEGORIA
          */

          if (
            category !==
            selectedTireCategory
          ) {

            comboInfo.textContent =
              "⚠️ Opony obowiązkowe muszą być z tej samej kategorii.";

            comboInfo.style.color =
              "#ffe000";

            return;

          }

          /*
            Jeśli dostępne są "Dowolne opony" wyścigowe,
            każda z 3 mieszanek wyścigowych może być
            ustawiona jako obowiązkowa — niezależnie od
            tego, czy została osobno zaznaczona.
          */

          if (
            anyRacingTiresSelected &&
            category ===
              "racing"
          ) {

            // dozwolone
          }


          /*
            WAŻNE:

            NIE SPRAWDZAMY, CZY OPONA
            JEST WYBRANA JAKO DOSTĘPNA.

            Dzięki temu można zrobić np.:

            DOSTĘPNE:
            Komfortowe twarde

            OBOWIĄZKOWE:
            Komfortowe średnie
            Komfortowe miękkie
          */


          if (
            selectedMandatoryTires.includes(
              tire
            )
          ) {

            selectedMandatoryTires =
              selectedMandatoryTires.filter(
                item =>
                  item !==
                  tire
              );

            button.classList.remove(
              "selected"
            );

          }

          else {

            selectedMandatoryTires.push(
              tire
            );

            button.classList.add(
              "selected"
            );

          }

        }
      );

    }
  );


  // ==========================================
  // ZAPIS COMBO
  // ==========================================

  saveComboBtn.addEventListener(
    "click",
    async () => {

      if (
        !roundIsActive()
      ) {

        showError(
          "❌ Runda nie jest aktywna."
        );

        return;

      }


      const track =
        trackSelect.value;

      const weather =
        weatherSelect.value;

      const timeOfDay =
        timeOfDaySelect.value;

      const pit =
        pitSelect.value;

      const fuel =
        fuelSelect.value;

      const tireWear =
        tireWearSelect.value;

      const startType =
        startTypeSelect.value;

      const qualifying =
        qualifyingSelect.value;

      const bop =
        bopSelect.value;


      // TOR

      if (!track) {

        showError(
          "❌ Wybierz tor."
        );

        return;

      }


      // KLASA

      if (
        selectedClasses.length ===
        0
      ) {

        showError(
          "❌ Wybierz klasę."
        );

        return;

      }


      // ======================================
      // DŁUGOŚĆ
      // ======================================

      let raceLength =
        "";


      if (
        selectedRaceType ===
        "laps"
      ) {

        const laps =
          Number(
            lapsInput.value
          );


        if (
          !laps ||
          laps < 1
        ) {

          showError(
            "❌ Podaj liczbę okrążeń."
          );

          return;

        }


        if (
          laps > 500
        ) {

          showError(
            "❌ Maksymalnie 500 okrążeń."
          );

          return;

        }


        raceLength =
          laps +
          " okr.";

      }

      else {

        const minutes =
          Number(
            raceTimeInput.value
          );


        if (
          !minutes ||
          minutes < 1
        ) {

          showError(
            "❌ Podaj czas wyścigu."
          );

          return;

        }


        if (
          minutes > 600
        ) {

          showError(
            "❌ Maksymalnie 600 minut."
          );

          return;

        }


        raceLength =
          minutes +
          " min";

      }


      // ======================================
      // POGODA / PORA
      // ======================================

      if (
        !weather ||
        !timeOfDay
      ) {

        showError(
          "❌ Wybierz pogodę i porę dnia."
        );

        return;

      }


      // ======================================
      // DOSTĘPNE OPONY
      // ======================================

      if (
        selectedAvailableTires.length ===
          0 &&
        !anyRacingTiresSelected
      ) {

        showError(
          "❌ Wybierz dostępne opony."
        );

        return;

      }


      if (
        !selectedTireCategory
      ) {

        showError(
          "❌ Wybierz kategorię opon."
        );

        return;

      }


      // ======================================
      // OBOWIĄZKOWE OPONY
      // ======================================

      if (
        !mandatoryTiresMode.value
      ) {

        showError(
          "❌ Wybierz ustawienie opon obowiązkowych."
        );

        return;

      }


      if (
        mandatoryTiresMode.value ===
        "required"
      ) {

        if (
          selectedMandatoryTires.length ===
          0
        ) {

          showError(
            "❌ Wybierz minimum jedną obowiązkową oponę."
          );

          return;

        }


        /*
          SPRAWDZENIE KATEGORII
        */

        const wrongCategory =
          selectedMandatoryTires.some(
            tire => {

              const button =
                [...mandatoryTireButtons]
                  .find(
                    item =>
                      item.dataset.tire ===
                      tire
                  );

              return (
                !button ||
                button.dataset.category !==
                  selectedTireCategory
              );

            }
          );


        if (
          wrongCategory
        ) {

          showError(
            "❌ Opony obowiązkowe muszą być z tej samej kategorii."
          );

          return;

        }

      }


      // ======================================
      // RESZTA USTAWIEŃ
      // ======================================

      if (
        !pit ||
        !fuel ||
        !tireWear ||
        !startType ||
        !qualifying ||
        !bop
      ) {

        showError(
          "❌ Uzupełnij wszystkie ustawienia."
        );

        return;

      }


      saveComboBtn.disabled =
        true;


      try {

        await set(
          ref(
            database,
            "srsLobbyCombos/" +
              playerId
          ),
          {

            playerId:
              playerId,

            roundId:
              currentRound.id,

            track:
              track,

            classes:
              selectedClasses,

            raceType:
              selectedRaceType,

            raceLength:
              raceLength,

            weather:
              weather,

            timeOfDay:
              timeOfDay,

            availableTires:
              anyRacingTiresSelected
                ? [
                    "Wyścigowe twarde",
                    "Wyścigowe średnie",
                    "Wyścigowe miękkie"
                  ]
                : selectedAvailableTires,

            anyRacingTires:
              anyRacingTiresSelected,

            mandatoryTiresMode:
              mandatoryTiresMode.value,

            mandatoryTires:
              mandatoryTiresMode.value ===
              "required"
                ? selectedMandatoryTires
                : [],

            pit:
              pit,

            fuel:
              fuel,

            tireWear:
              tireWear,

            startType:
              startType,

            qualifying:
              qualifying,

            bop:
              bop,

            time:
              Date.now()

          }
        );


        comboInfo.textContent =
          "✅ COMBO zapisane.";

        comboInfo.style.color =
          "#4ade80";


        saveComboBtn.textContent =
          "✏️ ZMIEŃ MOJE COMBO";

      }

      catch (error) {

        showError(
          "❌ Błąd: " +
          error.message
        );

      }


      saveComboBtn.disabled =
        false;

    }
  );


  // ==========================================
  // KOMUNIKAT BŁĘDU
  // ==========================================

  function showError(
    message
  ) {

    comboInfo.textContent =
      message;

    comboInfo.style.color =
      "#ff5555";

  }


  // ==========================================
  // LOSOWANIE
  // ==========================================

  function randomItem(
    array
  ) {

    return array[
      Math.floor(
        Math.random() *
        array.length
      )
    ];

  }


  // ==========================================
  // FORMATOWANIE TABLIC
  // ==========================================

  function formatArray(
    value
  ) {

    if (
      !value ||
      value.length ===
        0
    ) {

      return "Brak";

    }


    return Array.isArray(
      value
    )
      ? value.join(
          " + "
        )
      : value;

  }


  // ==========================================
  // DISCORD
  // ==========================================

  async function sendWinnerToDiscord(
    winner
  ) {

    if (
      !DISCORD_WEBHOOK ||
      DISCORD_WEBHOOK ===
        "WKLEJ_TUTAJ_NOWY_WEBHOOK"
    ) {

      console.log(
        "Nie ustawiono webhooka."
      );

      return false;

    }


    const mandatoryText =
      winner.mandatoryTiresMode ===
      "required"

        ? formatArray(
            winner.mandatoryTires
          )

        : "Brak obowiązkowych opon";


    const message = `
🏆 **SRS LOBBY COMBO – WYNIK LOSOWANIA** 🏆

━━━━━━━━━━━━━━━━━━

🗺️ **TOR**
${winner.track}

🏎️ **KLASA**
${formatArray(
  winner.classes
)}

🏁 **DŁUGOŚĆ WYŚCIGU**
${winner.raceLength}

🌤️ **POGODA**
${winner.weather}

🌅 **PORA DNIA**
${winner.timeOfDay}

🛞 **DOSTĘPNE OPONY**
${formatArray(
  winner.availableTires
)}

🚨 **OPONY OBOWIĄZKOWE**
${mandatoryText}

🔧 **PIT STOP**
${winner.pit}

⛽ **ZUŻYCIE PALIWA**
${winner.fuel}

📉 **ZUŻYCIE OPON**
${winner.tireWear}

🏎️ **TYP STARTU**
${winner.startType}

⏱️ **KWALIFIKACJE**
${winner.qualifying}

⚖️ **BOP**
${winner.bop}

━━━━━━━━━━━━━━━━━━

🎮 **SRS LOBBY COMBO**
🏁 Wynik został wylosowany automatycznie.
`;


    try {

      const response =
        await fetch(
          DISCORD_WEBHOOK,
          {

            method:
              "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify(
                {

                  username:
                    "SRS LOBBY COMBO",

                  content:
                    message

                }
              )

          }
        );


      return response.ok;

    }

    catch (error) {

      console.error(
        error
      );

      return false;

    }

  }


  // ==========================================
  // ZAKOŃCZENIE RUNDY
  // ==========================================

  async function finishRound() {

    if (
      finishingRound ||
      !currentRound
    ) {

      return;

    }


    finishingRound =
      true;


    try {

      const roundSnapshot =
        await get(
          roundRef
        );


      const latestRound =
        roundSnapshot.val();


      if (
        !latestRound ||
        latestRound.status !==
          "voting" ||
        Date.now() <
          Number(
            latestRound.endTime
          )
      ) {

        finishingRound =
          false;

        return;

      }


      const combosSnapshot =
        await get(
          combosRef
        );


      const allCombos =
        combosSnapshot.val() ||
        {};


      const combos =
        Object.values(
          allCombos
        )
        .filter(
          combo =>
            combo.roundId ===
            latestRound.id
        );


      // NIKT NIE DODAŁ COMBO

      if (
        combos.length ===
        0
      ) {

        await set(
          roundRef,
          {

            ...latestRound,

            status:
              "finished",

            winner:
              null,

            finishedAt:
              Date.now()

          }
        );


        finishingRound =
          false;

        return;

      }


      // LOSOWANIE

      const winner =
        randomItem(
          combos
        );


      const result =
        await runTransaction(
          roundRef,
          current => {

            if (
              !current ||
              current.status !==
                "voting" ||
              Date.now() <
                Number(
                  current.endTime
                )
            ) {

              return;

            }


            return {

              ...current,

              status:
                "finished",

              winner:
                winner,

              finishedAt:
                Date.now(),

              discordSent:
                false

            };

          }
        );


      if (
        result.committed
      ) {

        const updatedRound =
          result.snapshot.val();


        if (
          updatedRound &&
          updatedRound.winner &&
          !updatedRound.discordSent
        ) {

          const sent =
            await sendWinnerToDiscord(
              updatedRound.winner
            );


          if (sent) {

            await runTransaction(
              roundRef,
              current => {

                if (
                  !current ||
                  current.discordSent
                ) {

                  return;

                }


                return {

                  ...current,

                  discordSent:
                    true,

                  discordSentAt:
                    Date.now()

                };

              }
            );

          }

        }

      }

    }

    catch (error) {

      console.error(
        "Błąd losowania:",
        error
      );

    }


    finishingRound =
      false;

  }


  // ==========================================
  // ODLICZANIE
  // ==========================================

  function updateCountdown() {

    if (
      !currentRound ||
      currentRound.status !==
        "voting"
    ) {

      return;

    }


    const left =
      Number(
        currentRound.endTime
      ) -
      Date.now();


    if (
      left <= 0
    ) {

      countdown.textContent =
        "00:00:00";

      finishRound();

      return;

    }


    const totalSeconds =
      Math.floor(
        left / 1000
      );


    const days =
      Math.floor(
        totalSeconds /
          86400
      );


    const hours =
      Math.floor(
        (
          totalSeconds %
          86400
        ) / 3600
      );


    const minutes =
      Math.floor(
        (
          totalSeconds %
          3600
        ) / 60
      );


    const seconds =
      totalSeconds %
      60;


    countdown.textContent =

      (
        days > 0
          ? days + "d "
          : ""
      ) +

      String(
        hours
      ).padStart(
        2,
        "0"
      ) +

      ":" +

      String(
        minutes
      ).padStart(
        2,
        "0"
      ) +

      ":" +

      String(
        seconds
      ).padStart(
        2,
        "0"
      );

  }


  // ==========================================
  // WYŚWIETLANIE RUNDY
  // ==========================================

  function renderRound() {

    if (

        "hidden"
      );

    // ========================================
    // GŁOSOWANIE
    // ========================================

    if (
      currentRound.status ===
      "voting"
    ) {

        roundIsActive()
      ) {

        );

        <div class="result-title">

        </div>

          ${winner.bop}
        </div>

      `;

  // ==========================================
  // FIREBASE - RUNDA
  // ==========================================

  onValue(
    roundRef,
    snapshot => {

      currentRound =
        snapshot.val();

      renderRound();

      updateCountdown();

    }
  );

  // ==========================================

        );

      else {

  // ==========================================
  // TIMER
  // ==========================================

  setInterval(
    () => {

      updateCountdown();


      if (
        currentRound &&
        currentRound.status ===
          "voting" &&
        !roundIsActive()
      ) {

        finishRound();

      }

  );

</script>
