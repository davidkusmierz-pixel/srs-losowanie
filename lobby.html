<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SRS LOBBY COMBO</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      background:
        linear-gradient(
          rgba(5, 6, 12, 0.75),
          rgba(5, 6, 12, 0.94)
        ),
        url("background.png.png");

      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    .container {
      width: min(950px, 94%);
      margin: auto;
      padding: 20px 0 60px;
    }

    h1 {
      text-align: center;
      font-size: clamp(32px, 7vw, 55px);
      margin: 15px 0 25px;
      text-shadow: 0 4px 25px black;
    }

    .card {
      background: rgba(10, 11, 20, 0.94);
      border: 1px solid rgba(220, 0, 0, 0.55);
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow:
        0 10px 35px rgba(0,0,0,0.6),
        0 0 30px rgba(180,0,0,0.08);
    }

    .hidden {
      display: none !important;
    }

    button,
    input,
    select {
      font-family: inherit;
    }

    button {
      border: none;
      border-radius: 11px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .admin-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    #adminPin,
    #roundEndDateTime {
      min-height: 58px;
      border-radius: 11px;
      border: 1px solid #555;
      background: #15151d;
      color: white;
      padding: 0 15px;
      font-size: 16px;
    }

    #adminPin {
      width: 220px;
      text-align: center;
    }

    #roundEndDateTime {
      flex: 1;
      min-width: 250px;
    }

    #newRoundBtn {
      min-width: 220px;
      height: 58px;
      font-size: 17px;
      background: linear-gradient(
        135deg,
        #e30000,
        #850000
      );
    }

    #adminInfo {
      margin-top: 12px;
      text-align: center;
      min-height: 20px;
      color: #aaa;
    }

    .status-card {
      text-align: center;
    }

    #phaseStatus {
      font-size: clamp(24px, 5vw, 31px);
      font-weight: bold;
      margin-bottom: 15px;
    }

    #countdown {
      font-size: clamp(45px, 11vw, 82px);
      font-weight: bold;
      color: #ffe000;
      line-height: 1;
      text-shadow: 0 0 25px rgba(255,220,0,0.35);
    }

    #phaseInfo {
      margin-top: 15px;
      color: #ccc;
    }

    .section-title {
      text-align: center;
      font-size: clamp(21px, 4vw, 27px);
      font-weight: bold;
      margin-bottom: 20px;
    }

    .label {
      display: block;
      margin: 20px 0 8px;
      font-weight: bold;
      color: #ddd;
    }

    select,
    input[type="number"],
    input[type="text"] {
      width: 100%;
      min-height: 52px;
      border-radius: 10px;
      border: 1px solid #555;
      background: #15151d;
      color: white;
      padding: 0 15px;
      font-size: 16px;
    }

    .classes,
    .tire-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .class-btn,
    .tire-btn,
    .mandatory-tire-btn {
      min-height: 65px;
      background: #15151d;
      border: 2px solid #444;
      font-size: 15px;
      padding: 8px;
    }

    .class-btn.selected,
    .tire-btn.selected,
    .mandatory-tire-btn.selected {
      border-color: #ff2020;
      background: linear-gradient(
        135deg,
        #5e0000,
        #210000
      );
    }

    .race-type-buttons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .race-type-btn {
      min-height: 58px;
      background: #15151d;
      border: 2px solid #444;
      font-size: 16px;
    }

    .race-type-btn.selected {
      border-color: #ff2020;
      background: linear-gradient(
        135deg,
        #5e0000,
        #210000
      );
    }

    #saveComboBtn {
      width: 100%;
      min-height: 58px;
      margin-top: 25px;
      font-size: 18px;
      background: linear-gradient(
        135deg,
        #e30000,
        #850000
      );
    }

    #comboInfo {
      margin-top: 15px;
      text-align: center;
      min-height: 22px;
    }

    .participant-count {
      text-align: center;
      font-size: 20px;
      color: #ffe000;
    }

    .my-combo,
    .result {
      margin-top: 15px;
      text-align: center;
      line-height: 1.8;
    }

    .result-title {
      color: #ffe000;
      font-size: 20px;
      margin-top: 15px;
    }

    .result-value {
      font-size: clamp(21px, 5vw, 32px);
      font-weight: bold;
      color: #ff6666;
    }

    @media (max-width: 650px) {
      .classes,
      .tire-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .admin-row {
        flex-direction: column;
      }

      #adminPin,
      #roundEndDateTime,
      #newRoundBtn {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

    import {
      getDatabase,
      ref,
      set,
      get,
      onValue,
      remove,
      runTransaction
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


    const firebaseConfig = {
      apiKey: "TU_WKLEJ_SWÓJ_FIREBASE_API_KEY",
      authDomain: "srs-losowanie.firebaseapp.com",
      databaseURL: "https://srs-losowanie-default-rtdb.firebaseio.com",
      projectId: "srs-losowanie",
      storageBucket: "srs-losowanie.firebasestorage.app",
      messagingSenderId: "212959687651",
      appId: "1:212959973858506751:web:0a9a5e647450767bc026d6"
    };


    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);


    const ADMIN_PIN = "840416";

    const DISCORD_WEBHOOK =
      "https://discord.com/api/webhooks/1543742170157158550/pRsAgoyhhswi7kD57RFc1wERkVtLNlsgky7BI-JoYq7sTmWwMo5brD_kVf7Wa7PWWwmz";


    const adminPin =
      document.getElementById("adminPin");

    const roundEndDateTime =
      document.getElementById("roundEndDateTime");

    const newRoundBtn =
      document.getElementById("newRoundBtn");

    const adminInfo =
      document.getElementById("adminInfo");

    const phaseStatus =
      document.getElementById("phaseStatus");

    const countdown =
      document.getElementById("countdown");

    const phaseInfo =
      document.getElementById("phaseInfo");

    const comboSection =
      document.getElementById("comboSection");

    const trackSelect =
      document.getElementById("trackSelect");

    const classButtons =
      document.querySelectorAll(".class-btn");

    const raceTypeButtons =
      document.querySelectorAll(".race-type-btn");

    const lapsSection =
      document.getElementById("lapsSection");

    const raceTimeSection =
      document.getElementById("raceTimeSection");

    const lapsInput =
      document.getElementById("lapsInput");

    const raceTimeInput =
      document.getElementById("raceTimeInput");

    const weatherSelect =
      document.getElementById("weatherSelect");

    const timeOfDaySelect =
      document.getElementById("timeOfDaySelect");

    const tireButtons =
      document.querySelectorAll(".tire-btn");

    const mandatoryTiresMode =
      document.getElementById("mandatoryTiresMode");

    const mandatoryTiresSection =
      document.getElementById("mandatoryTiresSection");

    const mandatoryTireButtons =
      document.querySelectorAll(".mandatory-tire-btn");

    const pitSelect =
      document.getElementById("pitSelect");

    const fuelSelect =
      document.getElementById("fuelSelect");

    const tireWearSelect =
      document.getElementById("tireWearSelect");

    const startTypeSelect =
      document.getElementById("startTypeSelect");

    const qualifyingSelect =
      document.getElementById("qualifyingSelect");

    const bopSelect =
      document.getElementById("bopSelect");

    const saveComboBtn =
      document.getElementById("saveComboBtn");

    const comboInfo =
      document.getElementById("comboInfo");

    const myCombo =
      document.getElementById("myCombo");

    const participantCount =
      document.getElementById("participantCount");

    const officialResult =
      document.getElementById("officialResult");


    const roundRef =
      ref(database, "srsLobbyRound");

    const combosRef =
      ref(database, "srsLobbyCombos");


    let currentRound = null;
    let currentCombos = {};

    let selectedClasses = [];
    let selectedAvailableTires = [];
    let selectedMandatoryTires = [];

    let selectedRaceType = "laps";

    let finishingRound = false;


    let playerId =
      localStorage.getItem("srsLobbyPlayerId");


    if (!playerId) {

      playerId =
        "player_" +
        Date.now() +
        "_" +
        Math.random()
          .toString(36)
          .substring(2, 10);

      localStorage.setItem(
        "srsLobbyPlayerId",
        playerId
      );

    }


    function resetComboForm() {

      trackSelect.value = "";

      selectedClasses = [];

      classButtons.forEach(button => {
        button.classList.remove("selected");
      });


      selectedRaceType = "laps";

      raceTypeButtons.forEach(button => {

        button.classList.toggle(
          "selected",
          button.dataset.raceType === "laps"
        );

      });

      lapsSection.classList.remove("hidden");
      raceTimeSection.classList.add("hidden");

      lapsInput.value = "";
      raceTimeInput.value = "";


      weatherSelect.value = "";
      timeOfDaySelect.value = "";


      selectedAvailableTires = [];

      tireButtons.forEach(button => {
        button.classList.remove("selected");
      });


      mandatoryTiresMode.value = "";

      selectedMandatoryTires = [];

      mandatoryTireButtons.forEach(button => {
        button.classList.remove("selected");
      });

      mandatoryTiresSection.classList.add("hidden");


      pitSelect.value = "";
      fuelSelect.value = "";
      tireWearSelect.value = "";
      startTypeSelect.value = "";
      qualifyingSelect.value = "";
      bopSelect.value = "";

      myCombo.innerHTML = "";

      comboInfo.textContent = "";

      saveComboBtn.disabled = false;

      saveComboBtn.textContent =
        "➕ DODAJ MOJE COMBO";

    }


    function roundIsActive() {

      return (
        currentRound &&
        currentRound.status === "voting" &&
        Date.now() < Number(currentRound.endTime)
      );

    }


    newRoundBtn.addEventListener(
      "click",
      async () => {

        if (
          adminPin.value.trim() !== ADMIN_PIN
        ) {

          adminInfo.textContent =
            "❌ Nieprawidłowy PIN.";

          adminInfo.style.color =
            "#ff5555";

          return;

        }


        if (!roundEndDateTime.value) {

          adminInfo.textContent =
            "❌ Wybierz datę i godzinę zakończenia.";

          adminInfo.style.color =
            "#ff5555";

          return;

        }


        const endTime =
          new Date(
            roundEndDateTime.value
          ).getTime();


        if (
          !endTime ||
          endTime <= Date.now()
        ) {

          adminInfo.textContent =
            "❌ Data zakończenia musi być w przyszłości.";

          adminInfo.style.color =
            "#ff5555";

          return;

        }


        const confirmStart =
          confirm(
            "Rozpocząć nową rundę?\n\n" +
            "Stare COMBO zostaną usunięte."
          );


        if (!confirmStart) {
          return;
        }


        try {

          newRoundBtn.disabled = true;

          adminInfo.textContent =
            "⏳ Tworzenie nowej rundy...";

          adminInfo.style.color =
            "#ffe000";


          await remove(combosRef);


          const now = Date.now();


          await set(
            roundRef,
            {
              id: String(now),
              status: "voting",
              startTime: now,
              endTime: endTime,
              winner: null,
              discordSent: false
            }
          );


          resetComboForm();

          adminPin.value = "";


          adminInfo.textContent =
            "🟢 Nowa runda rozpoczęta.";

          adminInfo.style.color =
            "#4ade80";

        }

        catch (error) {

          adminInfo.textContent =
            "❌ Błąd: " +
            error.message;

          adminInfo.style.color =
            "#ff5555";

        }


        newRoundBtn.disabled = false;

      }
    );


    classButtons.forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            if (!roundIsActive()) {
              return;
            }


            const className =
              button.dataset.class;


            if (
              selectedClasses.includes(className)
            ) {

              selectedClasses =
                selectedClasses.filter(
                  item => item !== className
                );

              button.classList.remove("selected");

            }

            else {

              selectedClasses.push(className);

              button.classList.add("selected");

            }

          }
        );

      }
    );


    raceTypeButtons.forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            if (!roundIsActive()) {
              return;
            }


            selectedRaceType =
              button.dataset.raceType;


            raceTypeButtons.forEach(item => {

              item.classList.toggle(
                "selected",
                item.dataset.raceType ===
                selectedRaceType
              );

            });


            if (
              selectedRaceType === "laps"
            ) {

              lapsSection.classList.remove(
                "hidden"
              );

              raceTimeSection.classList.add(
                "hidden"
              );

            }

            else {

              lapsSection.classList.add(
                "hidden"
              );

              raceTimeSection.classList.remove(
                "hidden"
              );

            }

          }
        );

      }
    );


    tireButtons.forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            if (!roundIsActive()) {
              return;
            }


            const tire =
              button.dataset.tire;


            if (
              selectedAvailableTires.includes(tire)
            ) {

              selectedAvailableTires =
                selectedAvailableTires.filter(
                  item => item !== tire
                );

              button.classList.remove(
                "selected"
              );

            }

            else {

              selectedAvailableTires.push(
                tire
              );

              button.classList.add(
                "selected"
              );

            }

          }
        );

      }
    );


    mandatoryTiresMode.addEventListener(
      "change",
      () => {

        if (
          mandatoryTiresMode.value ===
          "required"
        ) {

          mandatoryTiresSection.classList.remove(
            "hidden"
          );

        }

        else {

          mandatoryTiresSection.classList.add(
            "hidden"
          );

          selectedMandatoryTires = [];


          mandatoryTireButtons.forEach(
            button => {

              button.classList.remove(
                "selected"
              );

            }
          );

        }

      }
    );


    mandatoryTireButtons.forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            if (!roundIsActive()) {
              return;
            }


            const tire =
              button.dataset.tire;


            if (
              selectedMandatoryTires.includes(
                tire
              )
            ) {

              selectedMandatoryTires =
                selectedMandatoryTires.filter(
                  item => item !== tire
                );

              button.classList.remove(
                "selected"
              );

            }

            else {

              selectedMandatoryTires.push(
                tire
              );

              button.classList.add(
                "selected"
              );

            }

          }
        );

      }
    );


    saveComboBtn.addEventListener(
      "click",
      async () => {

        if (!roundIsActive()) {

          showError(
            "❌ Runda nie jest aktywna."
          );

          return;

        }


        const track =
          trackSelect.value;

        const weather =
          weatherSelect.value;

        const timeOfDay =
          timeOfDaySelect.value;

        const pit =
          pitSelect.value;

        const fuel =
          fuelSelect.value;

        const tireWear =
          tireWearSelect.value;

        const startType =
          startTypeSelect.value;

        const qualifying =
          qualifyingSelect.value;

        const bop =
          bopSelect.value;


        if (!track) {
          showError("❌ Wybierz tor.");
          return;
        }


        if (
          selectedClasses.length === 0
        ) {
          showError("❌ Wybierz klasę.");
          return;
        }


        let raceLength = "";


        if (
          selectedRaceType === "laps"
        ) {

          const laps =
            Number(lapsInput.value);


          if (!laps || laps < 1) {

            showError(
              "❌ Podaj liczbę okrążeń."
            );

            return;

          }


          raceLength =
            laps + " okr.";

        }

        else {

          const raceTime =
            raceTimeInput.value.trim();


          if (!raceTime) {

            showError(
              "❌ Podaj czas wyścigu."
            );

            return;

          }


          if (
            !/^\d+$/.test(raceTime)
          ) {

            showError(
              "❌ Podaj samą liczbę minut, np. 45."
            );

            return;

          }


          const minutes =
            Number(raceTime);


          if (
            minutes < 1 ||
            minutes > 600
          ) {

            showError(
              "❌ Czas musi być od 1 do 600 minut."
            );

            return;

          }


          raceLength =
            minutes + " min";

        }


        if (
          !weather ||
          !timeOfDay
        ) {

          showError(
            "❌ Wybierz pogodę i porę dnia."
          );

          return;

        }


        if (
          selectedAvailableTires.length === 0
        ) {

          showError(
            "❌ Wybierz dostępne opony."
          );

          return;

        }


        if (
          !mandatoryTiresMode.value
        ) {

          showError(
            "❌ Wybierz ustawienie opon obowiązkowych."
          );

          return;

        }


        if (
          mandatoryTiresMode.value ===
          "required" &&
          selectedMandatoryTires.length === 0
        ) {

          showError(
            "❌ Wybierz minimum jedną oponę obowiązkową."
          );

          return;

        }


        if (
          !pit ||
          !fuel ||
          !tireWear ||
          !startType ||
          !qualifying ||
          !bop
        ) {

          showError(
            "❌ Uzupełnij wszystkie ustawienia."
          );

          return;

        }


        saveComboBtn.disabled = true;


        try {

          await set(
            ref(
              database,
              "srsLobbyCombos/" +
              playerId
            ),
            {
              playerId: playerId,
              roundId: currentRound.id,

              track: track,
              classes: selectedClasses,

              raceType:
                selectedRaceType,

              raceLength:
                raceLength,

              weather: weather,
              timeOfDay: timeOfDay,

              availableTires:
                selectedAvailableTires,

              mandatoryTiresMode:
                mandatoryTiresMode.value,

              mandatoryTires:
                mandatoryTiresMode.value ===
                "required"
                  ? selectedMandatoryTires
                  : [],

              pit: pit,
              fuel: fuel,
              tireWear: tireWear,
              startType: startType,
              qualifying: qualifying,
              bop: bop,

              time: Date.now()
            }
          );


          comboInfo.textContent =
            "✅ COMBO zapisane.";

          comboInfo.style.color =
            "#4ade80";


          saveComboBtn.textContent =
            "✏️ ZMIEŃ MOJE COMBO";

        }

        catch (error) {

          showError(
            "❌ Błąd: " +
            error.message
          );

        }


        saveComboBtn.disabled = false;

      }
    );


    function showError(message) {

      comboInfo.textContent = message;

      comboInfo.style.color =
        "#ff5555";

    }


    function randomItem(array) {

      return array[
        Math.floor(
          Math.random() *
          array.length
        )
      ];

    }


    function formatArray(value) {

      if (
        !value ||
        value.length === 0
      ) {
        return "Brak";
      }

      return Array.isArray(value)
        ? value.join(" + ")
        : value;

    }


    async function sendWinnerToDiscord(
      winner
    ) {

      if (
        !DISCORD_WEBHOOK ||
        DISCORD_WEBHOOK ===
        "WKLEJ_TUTAJ_SWÓJ_WEBHOOK"
      ) {

        console.log(
          "Nie ustawiono webhooka."
        );

        return false;

      }


      const message = `
🏆 **SRS LOBBY COMBO – WYNIK LOSOWANIA** 🏆

━━━━━━━━━━━━━━━━━━

🏁 **TOR**
**${winner.track}**

🏎️ **KLASA**
**${formatArray(winner.classes)}**

⏱️ **DŁUGOŚĆ WYŚCIGU**
**${winner.raceLength}**

🌦️ **POGODA**
**${winner.weather}**

🌅 **PORA DNIA**
**${winner.timeOfDay}**

🛞 **DOSTĘPNE OPONY**
**${formatArray(winner.availableTires)}**

⚠️ **OPONY OBOWIĄZKOWE**
**${
  winner.mandatoryTiresMode === "required"
    ? formatArray(winner.mandatoryTires)
    : "Brak obowiązkowych opon"
}**

🔧 **PIT STOP**
**${winner.pit}**

⛽ **ZUŻYCIE PALIWA**
**${winner.fuel}**

🛞 **ZUŻYCIE OPON**
**${winner.tireWear}**

🚦 **TYP STARTU**
**${winner.startType}**

⏱️ **KWALIFIKACJE**
**${winner.qualifying}**

⚖️ **BOP**
**${winner.bop}**

━━━━━━━━━━━━━━━━━━

🎮 **SRS LOBBY COMBO**
🏁 Wynik został wylosowany automatycznie.
`;


      try {

        const response =
          await fetch(
            DISCORD_WEBHOOK,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify(
                  {
                    username:
                      "SRS LOBBY COMBO",

                    content:
                      message
                  }
                )
            }
          );


        return response.ok;

      }

      catch (error) {

        console.error(error);

        return false;

      }

    }


    async function finishRound() {

      if (
        finishingRound ||
        !currentRound
      ) {
        return;
      }


      finishingRound = true;


      try {

        const roundSnapshot =
          await get(roundRef);

        const latestRound =
          roundSnapshot.val();


        if (
          !latestRound ||
          latestRound.status !== "voting" ||
          Date.now() <
          Number(latestRound.endTime)
        ) {

          finishingRound = false;

          return;

        }


        const combosSnapshot =
          await get(combosRef);

        const allCombos =
          combosSnapshot.val() || {};


        const combos =
          Object.values(allCombos)
            .filter(
              combo =>
                combo.roundId ===
                latestRound.id
            );


        if (
          combos.length === 0
        ) {

          await set(
            roundRef,
            {
              ...latestRound,
              status: "finished",
              winner: null,
              finishedAt: Date.now()
            }
          );

          finishingRound = false;

          return;

        }


        const winner =
          randomItem(combos);


        const result =
          await runTransaction(
            roundRef,
            current => {

              if (
                !current ||
                current.status !== "voting" ||
                Date.now() <
                Number(current.endTime)
              ) {
                return;
              }


              return {
                ...current,
                status: "finished",
                winner: winner,
                finishedAt: Date.now(),
                discordSent: false
              };

            }
          );


        if (
          result.committed
        ) {

          const updatedRound =
            result.snapshot.val();


          if (
            updatedRound &&
            updatedRound.winner &&
            !updatedRound.discordSent
          ) {

            const sent =
              await sendWinnerToDiscord(
                updatedRound.winner
              );


            if (sent) {

              await runTransaction(
                roundRef,
                current => {

                  if (
                    !current ||
                    current.discordSent
                  ) {
                    return;
                  }


                  return {
                    ...current,
                    discordSent: true,
                    discordSentAt: Date.now()
                  };

                }
              );

            }

          }

        }

      }

      catch (error) {

        console.error(
          "Błąd losowania:",
          error
        );

      }


      finishingRound = false;

    }


    function updateCountdown() {

      if (
        !currentRound ||
        currentRound.status !== "voting"
      ) {
        return;
      }


      const left =
        Number(currentRound.endTime) -
        Date.now();


      if (left <= 0) {

        countdown.textContent =
          "00:00:00";

        finishRound();

        return;

      }


      const totalSeconds =
        Math.floor(left / 1000);

      const days =
        Math.floor(
          totalSeconds / 86400
        );

      const hours =
        Math.floor(
          (totalSeconds % 86400) / 3600
        );

      const minutes =
        Math.floor(
          (totalSeconds % 3600) / 60
        );

      const seconds =
        totalSeconds % 60;


      countdown.textContent =
        (days > 0
          ? days + "d "
          : "") +
        String(hours).padStart(2, "0") +
        ":" +
        String(minutes).padStart(2, "0") +
        ":" +
        String(seconds).padStart(2, "0");

    }


    function renderRound() {

      if (!currentRound) {

        phaseStatus.textContent =
          "⏳ BRAK AKTYWNEJ RUNDY";

        countdown.textContent =
          "00:00:00";

        phaseInfo.textContent =
          "Czekamy na rozpoczęcie rundy.";

        comboSection.classList.add(
          "hidden"
        );

        return;

      }


      if (
        currentRound.status === "voting"
      ) {

        if (roundIsActive()) {

          phaseStatus.textContent =
            "🟢 DODAWANIE COMBO TRWA";

          phaseStatus.style.color =
            "#4ade80";

          phaseInfo.textContent =
            "Dodaj swoje COMBO przed końcem czasu.";

          comboSection.classList.remove(
            "hidden"
          );

        }

        else {

          phaseStatus.textContent =
            "🎰 AUTOMATYCZNE LOSOWANIE...";

          comboSection.classList.add(
            "hidden"
          );

          finishRound();

        }

      }


      if (
        currentRound.status === "finished"
      ) {

        phaseStatus.textContent =
          "🏆 COMBO WYLOSOWANE";

        phaseStatus.style.color =
          "#ff6666";

        countdown.textContent =
          "00:00:00";

        comboSection.classList.add(
          "hidden"
        );


        const winner =
          currentRound.winner;


        if (!winner) {

          officialResult.textContent =
            "❌ Nikt nie dodał COMBO.";

          return;

        }


        officialResult.innerHTML = `

          <div class="result-title">🏁 TOR</div>
          <div class="result-value">${winner.track}</div>

          <div class="result-title">🏎️ KLASA</div>
          <div class="result-value">${formatArray(winner.classes)}</div>

          <div class="result-title">⏱️ DŁUGOŚĆ WYŚCIGU</div>
          <div class="result-value">${winner.raceLength}</div>

          <div class="result-title">🌦️ POGODA</div>
          <div class="result-value">${winner.weather}</div>

          <div class="result-title">🌅 PORA DNIA</div>
          <div class="result-value">${winner.timeOfDay}</div>

          <div class="result-title">🛞 DOSTĘPNE OPONY</div>
          <div class="result-value">
            ${formatArray(winner.availableTires)}
          </div>

          <div class="result-title">⚠️ OPONY OBOWIĄZKOWE</div>
          <div class="result-value">
            ${
              winner.mandatoryTiresMode === "required"
                ? formatArray(winner.mandatoryTires)
                : "Brak obowiązkowych"
            }
          </div>

          <div class="result-title">🔧 PIT STOP</div>
          <div class="result-value">${winner.pit}</div>

          <div class="result-title">⛽ ZUŻYCIE PALIWA</div>
          <div class="result-value">${winner.fuel}</div>

          <div class="result-title">🛞 ZUŻYCIE OPON</div>
          <div class="result-value">${winner.tireWear}</div>

          <div class="result-title">🚦 TYP STARTU</div>
          <div class="result-value">${winner.startType}</div>

          <div class="result-title">⏱️ KWALIFIKACJE</div>
          <div class="result-value">${winner.qualifying}</div>

          <div class="result-title">⚖️ BOP</div>
          <div class="result-value">${winner.bop}</div>

        `;

      }

    }


    onValue(
      roundRef,
      snapshot => {

        currentRound =
          snapshot.val();

        renderRound();

        updateCountdown();

      }
    );


    onValue(
      combosRef,
      snapshot => {

        currentCombos =
          snapshot.val() || {};


        if (!currentRound) {

          participantCount.textContent =
            "👥 0 osób dodało COMBO";

          return;

        }


        const combos =
          Object.values(currentCombos)
            .filter(
              combo =>
                combo.roundId ===
                currentRound.id
            );


        participantCount.textContent =
          "👥 " +
          combos.length +
          " osób dodało COMBO";


        const mySavedCombo =
          currentCombos[playerId];


        if (
          mySavedCombo &&
          mySavedCombo.roundId ===
          currentRound.id
        ) {

          myCombo.innerHTML = `

            <strong>
              ✅ TWOJE COMBO:
            </strong>

            <br><br>

            🏁 ${mySavedCombo.track}

            <br>

            🏎️ ${formatArray(mySavedCombo.classes)}

            <br>

            ⏱️ ${mySavedCombo.raceLength}

            <br>

            🌦️ ${mySavedCombo.weather}

            <br>

            🌅 ${mySavedCombo.timeOfDay}

            <br>

            🛞 Dostępne:
            ${formatArray(
              mySavedCombo.availableTires
            )}

            <br>

            ⚠️ Obowiązkowe:
            ${
              mySavedCombo.mandatoryTiresMode ===
              "required"
                ? formatArray(
                    mySavedCombo.mandatoryTires
                  )
                : "Brak"
            }

          `;

          saveComboBtn.textContent =
            "✏️ ZMIEŃ MOJE COMBO";

        }

        else {

          myCombo.innerHTML = "";

        }

      }
    );


    setInterval(
      () => {

        updateCountdown();


        if (
          currentRound &&
          currentRound.status ===
          "voting" &&
          !roundIsActive()
        ) {

          finishRound();

        }

      },
      1000
    );

  </script>

</body>
