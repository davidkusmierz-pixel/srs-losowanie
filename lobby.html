<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SRS LOBBY COMBO</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: white;

      background:
        linear-gradient(
          rgba(5, 6, 12, 0.75),
          rgba(5, 6, 12, 0.94)
        ),
        url("background.png.png");

      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    .container {
      width: min(950px, 94%);
      margin: auto;
      padding: 20px 0 60px;
    }

    h1 {
      text-align: center;
      font-size: clamp(32px, 7vw, 55px);
      margin: 15px 0 25px;
      text-shadow: 0 4px 25px black;
    }

    .card {
      background: rgba(10, 11, 20, 0.94);
      border: 1px solid rgba(220, 0, 0, 0.55);
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 20px;

      box-shadow:
        0 10px 35px rgba(0,0,0,0.6),
        0 0 30px rgba(180,0,0,0.08);
    }

    .hidden {
      display: none !important;
    }

    button,
    input,
    select {
      font-family: inherit;
    }

    button {
      border: none;
      border-radius: 11px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .admin-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    #adminPin {
      width: 220px;
      height: 58px;
      border-radius: 11px;
      border: 1px solid #555;
      background: #15151d;
      color: white;
      text-align: center;
      font-size: 17px;
      padding: 0 15px;
    }

    #endDateTime {
      width: 270px;
      height: 58px;
      border-radius: 11px;
      border: 1px solid #555;
      background: #15151d;
      color: white;
      padding: 0 15px;
      font-size: 15px;
    }

    #newRoundBtn {
      min-width: 220px;
      height: 58px;
      font-size: 17px;

      background: linear-gradient(
        135deg,
        #e30000,
        #850000
      );
    }

    #adminInfo {
      margin-top: 12px;
      text-align: center;
      min-height: 20px;
      color: #aaa;
    }

    .status-card {
      text-align: center;
    }

    #phaseStatus {
      font-size: clamp(24px, 5vw, 31px);
      font-weight: bold;
      margin-bottom: 15px;
    }

    #countdown {
      font-size: clamp(42px, 10vw, 82px);
      font-weight: bold;
      color: #ffe000;
      line-height: 1;
      text-shadow: 0 0 25px rgba(255,220,0,0.35);
    }

    #phaseInfo {
      margin-top: 15px;
      color: #ccc;
    }

    .section-title {
      text-align: center;
      font-size: clamp(21px, 4vw, 27px);
      font-weight: bold;
      margin-bottom: 20px;
    }

    .label {
      display: block;
      margin: 22px 0 8px;
      font-weight: bold;
      color: #ddd;
    }

    select,
    input[type="number"],
    input[type="text"] {
      width: 100%;
      min-height: 52px;
      border-radius: 10px;
      border: 1px solid #555;
      background: #15151d;
      color: white;
      padding: 0 15px;
      font-size: 16px;
    }

    .classes,
    .tire-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .class-btn,
    .tire-btn {
      min-height: 65px;
      background: #15151d;
      border: 2px solid #444;
      font-size: 15px;
      padding: 8px;
    }

    .class-btn.selected,
    .tire-btn.selected {
      border-color: #ff2020;

      background: linear-gradient(
        135deg,
        #5e0000,
        #210000
      );
    }

    .choice-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .choice-btn {
      min-height: 58px;
      background: #15151d;
      border: 2px solid #444;
      font-size: 16px;
    }

    .choice-btn.selected {
      border-color: #ff2020;

      background: linear-gradient(
        135deg,
        #5e0000,
        #210000
      );
    }

    #saveComboBtn {
      width: 100%;
      min-height: 58px;
      margin-top: 25px;
      font-size: 18px;

      background: linear-gradient(
        135deg,
        #e30000,
        #850000
      );
    }

    #comboInfo {
      margin-top: 15px;
      text-align: center;
      min-height: 22px;
    }

    .participant-count {
      text-align: center;
      font-size: 20px;
      color: #ffe000;
    }

    .my-combo {
      margin-top: 20px;
      text-align: center;
      line-height: 1.8;
    }

    .result {
      text-align: center;
      line-height: 1.8;
    }

    .result-title {
      color: #ffe000;
      font-size: 19px;
      margin-top: 18px;
    }

    .result-value {
      font-size: clamp(20px, 5vw, 30px);
      font-weight: bold;
      color: #ff7777;
    }

    @media (max-width: 700px) {
      .classes,
      .tire-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 500px) {
      .admin-row,
      .choice-row {
        grid-template-columns: 1fr;
        display: grid;
      }

      #adminPin,
      #endDateTime,
      #newRoundBtn {
        width: 100%;
      }
    }
  </style>
</head>

const roundRef =

  ref(database, "srsLobbyCombos");


let currentRound = null;
let selectedClasses = [];

let selectedAvailableTires = [];
let selectedMandatoryTires = [];

let mandatoryMode = false;

let raceFormat = "laps";

let finishingRound = false;


let playerId =
  localStorage.getItem("srsLobbyPlayerId");


if (!playerId) {

  playerId =
    "player_" +
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .substring(2, 10);

  localStorage.setItem(
    "srsLobbyPlayerId",
    playerId
  );

}


function escapeHTML(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");

}


function roundIsActive() {

  return (
    currentRound &&
    currentRound.status === "voting" &&
    Date.now() < Number(currentRound.endTime)
  );

}


function resetComboForm() {

  trackSelect.value = "";

  selectedClasses = [];

  classButtons.forEach(
    button => {
      button.classList.remove("selected");
    }
  );


  raceFormat = "laps";

  raceFormatButtons.forEach(
    button => {

      button.classList.toggle(
        "selected",
        button.dataset.format === "laps"
      );

    }
  );


  lapsBox.classList.remove("hidden");
  timeBox.classList.add("hidden");

  lapsInput.value = "";
  raceTimeInput.value = "";


  weatherSelect.value = "";
  timeOfDaySelect.value = "";


  selectedAvailableTires = [];

  availableTireButtons.forEach(
    button => {
      button.classList.remove("selected");
    }
  );


  mandatoryMode = false;

  selectedMandatoryTires = [];

  noMandatoryBtn.classList.add("selected");
  mandatoryBtn.classList.remove("selected");

function randomItem(array) {

  return array[
    Math.floor(
      Math.random() * array.length
    )
  ];

}


function formatTimeLeft(milliseconds) {

  if (milliseconds <= 0) {
    return "00:00:00";
  }

  const totalSeconds =
    Math.floor(milliseconds / 1000);

  const days =
    Math.floor(totalSeconds / 86400);

  const hours =
    Math.floor(
      (totalSeconds % 86400) / 3600
    );

  const minutes =
    Math.floor(
      (totalSeconds % 3600) / 60
    );

  const seconds =
    totalSeconds % 60;


  if (days > 0) {

    return (
      days + "d " +
      String(hours).padStart(2, "0") + ":" +
      String(minutes).padStart(2, "0") + ":" +
      String(seconds).padStart(2, "0")
    );

  }


  return (
    String(hours).padStart(2, "0") + ":" +
    String(minutes).padStart(2, "0") + ":" +
    String(seconds).padStart(2, "0")
  );

}

newRoundBtn.addEventListener(

        endDateTime.value
      ).getTime();

        "❌ Data zakończenia musi być w przyszłości.";

      return;
    }

      newRoundBtn.disabled = true;


      await remove(combosRef);

        Date.now();


      await set(
        roundRef,
        {
          id: String(now),
          status: "voting",
          startTime: now,
          endTime: endTime,
          winner: null,
          discordSent: false
        }

      resetComboForm();


      adminPin.value = "";

saveComboBtn.addEventListener(

      weatherSelect.value;

    const timeOfDay =
      timeOfDaySelect.value;

    const pit =
      pitSelect.value;

    const fuel =
      fuelSelect.value;

    const tireWear =
      tireWearSelect.value;

    const startType =
      startTypeSelect.value;

      qualifyingSelect.value;

    const bop =
      bopSelect.value;

    if (
      raceFormat === "laps"

          lapsInput.value

        showError(
          "❌ Podaj liczbę okrążeń."

      }

    else {

        raceTimeInput.value.trim();


      if (!time) {

        showError(

        return;

      }

    if (!track) {
      showError("❌ Wybierz tor.");
      return;
    }


    if (
      selectedClasses.length === 0
    ) {

      showError(
        "❌ Wybierz klasę."
      );

      return;

    }


    if (
      selectedAvailableTires.length === 0
    ) {

      showError(
        "❌ Wybierz dostępne opony."

      return;

    if (
      mandatoryMode &&
      selectedMandatoryTires.length === 0
    ) {

      showError(

    }


    if (!weather) {

    }

      showError("❌ Wybierz porę dnia.");
      return;

      showError("❌ Wybierz PIT STOP.");
      return;

    if (!fuel) {
      showError("❌ Wybierz zużycie paliwa.");

    }

    }

    winner.mandatoryTires &&
    winner.mandatoryTires.length > 0
      ? winner.mandatoryTires.join("\n")
      : "🚫 Brak obowiązkowych";


  const message =
`🏆 **SRS LOBBY COMBO – WYNIK LOSOWANIA** 🏆

━━━━━━━━━━━━━━━━━━

🏁 **TOR**
**${winner.track}**

🏎️ **KLASA AUT**
**${classes}**

🏁 **FORMAT WYŚCIGU**
**${winner.raceFormat === "laps" ? "🔢 Okrążenia" : "⏱️ Czas"}**

**${winner.raceValue}**

🌦️ **POGODA**
**${winner.weather}**

🌅 **PORA DNIA**
**${winner.timeOfDay}**

🛞 **DOSTĘPNE OPONY**
${availableTires}

⚠️ **OBOWIĄZKOWE OPONY**
${mandatoryTires}

**${winner.fuel}**

🛞 **ZUŻYCIE OPON**
**${winner.tireWear}**

🚦 **TYP STARTU**
**${winner.startType}**

⏱️ **KWALIFIKACJE**
**${winner.qualifying}**

⚖️ **BOP**
**${winner.bop}**

━━━━━━━━━━━━━━━━━━

🎮 **SRS LOBBY COMBO**`;


  try {

async function finishRound() {

  if (
    finishingRound ||
    !currentRound
  ) {
    return;
  }


  finishingRound = true;


  try {

    const roundSnapshot =
      await get(roundRef);

    const latestRound =
      roundSnapshot.val();


    if (
      !latestRound ||
      latestRound.status !== "voting" ||
      Date.now() <
        Number(latestRound.endTime)
    ) {

      finishingRound = false;

      return;

    }


    const combosSnapshot =
      await get(combosRef);

    const allCombos =
      combosSnapshot.val() || {};


    const combos =
      Object.values(allCombos)
        .filter(
          combo =>
            combo.roundId ===
            latestRound.id
        );


    const winner =
      combos.length > 0
        ? randomItem(combos)
        : null;


    const result =
      await runTransaction(
        roundRef,
        current => {

          if (
            !current ||
            current.status !== "voting" ||
            Date.now() <
              Number(current.endTime)
          ) {
            return;
          }


          return {
            ...current,

            status:
              "finished",

            winner:
              winner,

            finishedAt:
              Date.now(),

            discordSent:
              false
          };

        }
      );


    if (
      result.committed
    ) {

      const updatedRound =
        result.snapshot.val();


      if (
        updatedRound.winner &&
        !updatedRound.discordSent
      ) {

        const sent =
          await sendWinnerToDiscord(
            updatedRound.winner
          );


        if (sent) {

          await runTransaction(
            roundRef,
            current => {

              if (
                !current ||
                current.id !== updatedRound.id ||
                current.discordSent
              ) {
                return;
              }


              return {
                ...current,

                discordSent:
                  true

              };

            }
          );

        }

      }

    }

  }

  catch (error) {

    console.error(
      "Błąd losowania:",
      error
    );

  }


  finishingRound = false;

}


function updateCountdown() {

  if (
    !currentRound ||
    currentRound.status !== "voting"
  ) {
    return;
  }


  const left =
    Number(
      currentRound.endTime
    ) - Date.now();


  if (left <= 0) {

    countdown.textContent =
      "00:00:00";

    finishRound();

    return;

  }


  countdown.textContent =
    formatTimeLeft(left);

}


function renderRound() {

  if (!currentRound) {

    phaseStatus.textContent =
      "⏳ BRAK AKTYWNEJ RUNDY";

    phaseStatus.style.color =
      "#ddd";

    countdown.textContent =
      "00:00:00";

    phaseInfo.textContent =
      "Czekamy na rozpoczęcie rundy.";

    comboSection.classList.add(
      "hidden"
    );

    return;

  }


  if (
    currentRound.status === "voting"
  ) {

    if (roundIsActive()) {

      phaseStatus.textContent =
        "🟢 DODAWANIE COMBO TRWA";

      phaseStatus.style.color =
        "#4ade80";

      phaseInfo.textContent =
        "Dodaj swoje COMBO przed końcem czasu.";

      comboSection.classList.remove(
        "hidden"
      );

    }

    else {

      phaseStatus.textContent =
        "🎰 AUTOMATYCZNE LOSOWANIE...";

      phaseStatus.style.color =
        "#ffe000";

      comboSection.classList.add(
        "hidden"
      );

      finishRound();

    }

  }


  if (
    currentRound.status === "finished"
  ) {

    phaseStatus.textContent =
      "🏆 COMBO WYLOSOWANE";

    phaseStatus.style.color =
      "#ff6666";

    countdown.textContent =
      "00:00:00";

    phaseInfo.textContent =
      "Admin może rozpocząć nową rundę.";

    comboSection.classList.add(
      "hidden"
    );


    const winner =
      currentRound.winner;


    if (!winner) {

      officialResult.textContent =
        "❌ Nikt nie dodał COMBO.";

      return;

    }


    const classes =
      winner.classes.join(" + ");


    const availableTires =
      winner.availableTires.join("<br>");


    const mandatoryTires =
      winner.mandatoryTires &&
      winner.mandatoryTires.length > 0
        ? winner.mandatoryTires.join("<br>")
        : "🚫 Brak obowiązkowych";


    officialResult.innerHTML = `

      <div class="result-title">🏁 WYBRANY TOR</div>
      <div class="result-value">${escapeHTML(winner.track)}</div>

      <div class="result-title">🏎️ KLASA AUT</div>
      <div class="result-value">${escapeHTML(classes)}</div>

      <div class="result-title">
        ${winner.raceFormat === "laps" ? "🔢 LICZBA OKRĄŻEŃ" : "⏱️ CZAS TRWANIA"}
      </div>

      <div class="result-value">
        ${escapeHTML(winner.raceValue)}
      </div>

      <div class="result-title">🌦️ POGODA</div>
      <div class="result-value">${escapeHTML(winner.weather)}</div>

      <div class="result-title">🌅 PORA DNIA</div>
      <div class="result-value">${escapeHTML(winner.timeOfDay)}</div>

      <div class="result-title">🛞 DOSTĘPNE OPONY</div>
      <div class="result-value">${availableTires}</div>

      <div class="result-title">⚠️ OBOWIĄZKOWE OPONY</div>
      <div class="result-value">${mandatoryTires}</div>

      <div class="result-title">🔧 PIT STOP</div>
      <div class="result-value">${escapeHTML(winner.pit)}</div>

      <div class="result-title">⛽ ZUŻYCIE PALIWA</div>
      <div class="result-value">${escapeHTML(winner.fuel)}</div>

      <div class="result-title">🛞 ZUŻYCIE OPON</div>
      <div class="result-value">${escapeHTML(winner.tireWear)}</div>

      <div class="result-title">🚦 TYP STARTU</div>
      <div class="result-value">${escapeHTML(winner.startType)}</div>

      <div class="result-title">⏱️ KWALIFIKACJE</div>
      <div class="result-value">${escapeHTML(winner.qualifying)}</div>

      <div class="result-title">⚖️ BOP</div>
      <div class="result-value">${escapeHTML(winner.bop)}</div>

    `;

  }

}


onValue(
  roundRef,
  snapshot => {

    currentRound =
      snapshot.val();

    renderRound();

    updateCountdown();

  }
);


onValue(
  combosRef,
  snapshot => {

    const currentCombos =
      snapshot.val() || {};


    if (!currentRound) {

      participantCount.textContent =
        "👥 0 osób dodało COMBO";

      return;

    }


    const combos =
      Object.values(currentCombos)
        .filter(
          combo =>
            combo.roundId ===
            currentRound.id
        );


    participantCount.textContent =
      "👥 " +
      combos.length +
      " osób dodało COMBO";


    const mySavedCombo =
      currentCombos[playerId];


    if (
      mySavedCombo &&
      mySavedCombo.roundId ===
      currentRound.id
    ) {

      const classes =
        mySavedCombo.classes.join(" + ");


      myCombo.innerHTML = `

        <strong>✅ TWOJE COMBO:</strong>

        <br><br>

        🏁 ${escapeHTML(mySavedCombo.track)}

        <br>

        🏎️ ${escapeHTML(classes)}

        <br>

        ${mySavedCombo.raceFormat === "laps" ? "🔢" : "⏱️"}
        ${escapeHTML(mySavedCombo.raceValue)}

        <br>

        🛞 Dostępne:
        ${mySavedCombo.availableTires.map(escapeHTML).join(" + ")}

        <br>

        ⚠️ Obowiązkowe:
        ${
          mySavedCombo.mandatoryTires &&
          mySavedCombo.mandatoryTires.length > 0
            ? mySavedCombo.mandatoryTires.map(escapeHTML).join(" + ")
            : "🚫 Brak"
        }

      `;


      saveComboBtn.textContent =
        "✏️ ZMIEŃ MOJE COMBO";

    }

    else {

      myCombo.innerHTML = "";

    }

  }
);


setInterval(
  () => {

    updateCountdown();


    if (
      currentRound &&
      currentRound.status === "voting" &&
      !roundIsActive()
    ) {

      finishRound();

    }

  },
  1000
);
