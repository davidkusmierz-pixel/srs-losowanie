<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SRS LOBBY COMBO</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  color: white;
  background:
    linear-gradient(rgba(5,6,12,0.78), rgba(5,6,12,0.95)),
    url("background.png.png");
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
}

.container {
  width: min(1000px, 94%);
  margin: auto;
  padding: 20px 0 60px;
}

h1 {
  text-align: center;
  font-size: clamp(32px, 7vw, 55px);
  margin: 15px 0 25px;
  text-shadow: 0 4px 25px black;
}

.card {
  background: rgba(15, 14, 26, 0.96);
  border: 1px solid rgba(220, 0, 0, 0.65);
  border-radius: 18px;
  padding: 22px;
  margin-bottom: 20px;
  box-shadow: 0 10px 35px rgba(0,0,0,0.65);
}

.hidden {
  display: none !important;
}

button, input, select {
  font-family: inherit;
}

button {
  border: none;
  border-radius: 11px;
  color: white;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
}

button:hover:not(:disabled) {
  transform: translateY(-2px);
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.admin-row {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
}

#adminPin {
  width: 220px;
  height: 58px;
  border-radius: 11px;
  border: 1px solid #555;
  background: #171720;
  color: white;
  text-align: center;
  font-size: 17px;
  padding: 0 15px;
}

#newRoundBtn {
  min-width: 260px;
  height: 58px;
  font-size: 17px;
  background: linear-gradient(135deg, #e30000, #850000);
}

#adminInfo {
  margin-top: 12px;
  text-align: center;
  min-height: 20px;
  color: #aaa;
}

.status-card {
  text-align: center;
}

#phaseStatus {
  font-size: clamp(24px, 5vw, 31px);
  font-weight: bold;
  margin-bottom: 15px;
}

#countdown {
  font-size: clamp(55px, 12vw, 82px);
  font-weight: bold;
  color: #ffe000;
  line-height: 1;
  text-shadow: 0 0 25px rgba(255,220,0,0.35);
}

#phaseInfo {
  margin-top: 15px;
  color: #ccc;
}

.section-title {
  text-align: center;
  font-size: clamp(21px, 4vw, 27px);
  font-weight: bold;
  margin-bottom: 20px;
}

.label {
  display: block;
  margin: 20px 0 8px;
  font-weight: bold;
  color: #ddd;
}

select,
input[type="number"] {
  width: 100%;
  min-height: 52px;
  border-radius: 10px;
  border: 1px solid #555;
  background: #171720;
  color: white;
  padding: 0 15px;
  font-size: 16px;
}

.classes {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 10px;
}

.class-btn {
  min-height: 70px;
  background: #171720;
  border: 2px solid #444;
  font-size: 16px;
}

.class-btn.selected {
  border-color: #ff2020;
  background: linear-gradient(135deg, #650000, #250000);
}

/* OPONY */

.tire-box {
  margin-top: 12px;
  padding: 16px;
  border: 1px solid #555;
  border-radius: 14px;
  background: rgba(0,0,0,0.18);
}

.tire-title {
  font-size: 18px;
  font-weight: bold;
  color: #ffe000;
  margin-bottom: 12px;
}

.tire-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

.tire-btn {
  min-height: 50px;
  padding: 8px;
  background: #1b1b25;
  border: 1px solid #555;
  font-size: 14px;
}

.tire-btn.selected {
  background: linear-gradient(135deg, #5e0000, #260000);
  border-color: #ff2020;
}

.obligatory-choice {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.obligatory-btn {
  min-height: 50px;
  padding: 0 20px;
  background: #1b1b25;
  border: 1px solid #555;
}

.obligatory-btn.selected {
  background: linear-gradient(135deg, #5e0000, #260000);
  border-color: #ff2020;
}

.race-type {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.race-type-btn {
  min-height: 52px;
  padding: 0 20px;
  background: #1b1b25;
  border: 1px solid #555;
}

.race-type-btn.selected {
  background: linear-gradient(135deg, #5e0000, #260000);
  border-color: #ff2020;
}

#saveComboBtn {
  width: 100%;
  min-height: 60px;
  margin-top: 28px;
  font-size: 18px;
  background: linear-gradient(135deg, #e30000, #850000);
}

#comboInfo {
  margin-top: 15px;
  text-align: center;
  min-height: 22px;
}

.participant-count {
  text-align: center;
  font-size: 20px;
  color: #ffe000;
}

.my-combo {
  margin-top: 20px;
  text-align: center;
  line-height: 1.8;
}

.result {
  text-align: center;
  line-height: 1.8;
}

.result-title {
  color: #ffe000;
  font-size: 20px;
  margin-top: 16px;
}

.result-value {
  font-size: clamp(20px, 4vw, 30px);
  font-weight: bold;
  color: #ff7777;
}

@media (max-width: 850px) {
  .classes {
    grid-template-columns: repeat(3, 1fr);
  }

  .tire-grid {
    grid-template-columns: repeat(3, 1fr);
  }
}

@media (max-width: 600px) {
  .classes {
    grid-template-columns: repeat(2, 1fr);
  }

  .tire-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .admin-row {
    flex-direction: column;
  }

  #adminPin,
  #newRoundBtn {
    width: 100%;
  }
}
</style>
</head>

<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
  getDatabase,
  ref,
  set,
  get,
  onValue,
  remove,
  runTransaction
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


const firebaseConfig = {
  apiKey: "AIzaSyDRDAiSlJBPOG8N_c4ctBRLYrwx3ER5rKw",
  authDomain: "srs-losowanie.firebaseapp.com",
  databaseURL: "https://srs-losowanie-default-rtdb.firebaseio.com",
  projectId: "srs-losowanie",
  storageBucket: "srs-losowanie.firebasestorage.app",
  messagingSenderId: "212959687651",
  appId: "1:212959687651:web:0a9a5e647450767bc026d6"
};


const app = initializeApp(firebaseConfig);
const database = getDatabase(app);


const ADMIN_PIN = "840416";


const DISCORD_WEBHOOK =
"https://discord.com/api/webhooks/1543742170157158550/pRsAgoyhhswi7kD57RFc1wERkVtLNlsgky7BI-JoYq7sTmWwMo5brD_kVf7Wa7PWWwmz";


const ROUND_TIME = 5 * 60 * 1000;


const adminPin = document.getElementById("adminPin");
const newRoundBtn = document.getElementById("newRoundBtn");
const adminInfo = document.getElementById("adminInfo");

const phaseStatus = document.getElementById("phaseStatus");
const countdown = document.getElementById("countdown");
const phaseInfo = document.getElementById("phaseInfo");

const comboSection = document.getElementById("comboSection");

const trackSelect = document.getElementById("trackSelect");
const classButtons = document.querySelectorAll(".class-btn");

const lapsInput = document.getElementById("lapsInput");
const raceTimeSelect = document.getElementById("raceTimeSelect");

const lapsBox = document.getElementById("lapsBox");
const raceTimeBox = document.getElementById("raceTimeBox");
const raceTypeButtons = document.querySelectorAll(".race-type-btn");

const weatherSelect = document.getElementById("weatherSelect");
const timeOfDaySelect = document.getElementById("timeOfDaySelect");

const availableTireButtons =
document.querySelectorAll("#availableTires .tire-btn");

const noMandatoryBtn =
document.getElementById("noMandatoryBtn");

const mandatoryBtn =
document.getElementById("mandatoryBtn");

const mandatoryTiresBox =
document.getElementById("mandatoryTiresBox");

const mandatoryTireButtons =
document.querySelectorAll("#mandatoryTires .tire-btn");

const pitSelect = document.getElementById("pitSelect");
const fuelSelect = document.getElementById("fuelSelect");
const tireWearSelect = document.getElementById("tireWearSelect");
const startTypeSelect = document.getElementById("startTypeSelect");
const qualifyingSelect = document.getElementById("qualifyingSelect");
const bopSelect = document.getElementById("bopSelect");

const saveComboBtn =
document.getElementById("saveComboBtn");

const comboInfo =
document.getElementById("comboInfo");

const myCombo =
document.getElementById("myCombo");

const participantCount =
document.getElementById("participantCount");

const officialResult =
document.getElementById("officialResult");


const roundRef =
ref(database, "srsLobbyRound");

const combosRef =
ref(database, "srsLobbyCombos");


let currentRound = null;
let currentCombos = {};

let selectedClasses = [];
let selectedAvailableTires = [];
let selectedMandatoryTires = [];

let mandatoryMode = false;
let raceType = "laps";

let finishingRound = false;


let playerId =
localStorage.getItem("srsLobbyPlayerId");

if (!playerId) {

  playerId =
  "player_" +
  Date.now() +
  "_" +
  Math.random().toString(36).substring(2, 10);

  localStorage.setItem(
    "srsLobbyPlayerId",
    playerId
  );

}


function roundIsActive() {

  return (
    currentRound &&
    currentRound.status === "voting" &&
    Date.now() < Number(currentRound.endTime)
  );

}


function showError(message) {

  comboInfo.textContent = message;
  comboInfo.style.color = "#ff5555";

}


function resetComboForm() {

  trackSelect.value = "";

  selectedClasses = [];

  classButtons.forEach(button => {
    button.classList.remove("selected");
  });


  raceType = "laps";

  raceTypeButtons.forEach(button => {
    button.classList.toggle(
      "selected",
      button.dataset.raceType === "laps"
    );
  });

  lapsBox.classList.remove("hidden");
  raceTimeBox.classList.add("hidden");

  lapsInput.value = "";
  raceTimeSelect.value = "";


  weatherSelect.value = "";
  timeOfDaySelect.value = "";


  selectedAvailableTires = [];

  availableTireButtons.forEach(button => {
    button.classList.remove("selected");
  });


  mandatoryMode = false;

  selectedMandatoryTires = [];

  noMandatoryBtn.classList.add("selected");
  mandatoryBtn.classList.remove("selected");

  mandatoryTiresBox.classList.add("hidden");

  mandatoryTireButtons.forEach(button => {
    button.classList.remove("selected");
  });


  pitSelect.value = "";
  fuelSelect.value = "";
  tireWearSelect.value = "";
  startTypeSelect.value = "";
  qualifyingSelect.value = "";
  bopSelect.value = "";

  myCombo.innerHTML = "";
  comboInfo.textContent = "";

  saveComboBtn.disabled = false;

  saveComboBtn.textContent =
  "➕ DODAJ MOJE COMBO";

}


newRoundBtn.addEventListener("click", async () => {

  if (adminPin.value.trim() !== ADMIN_PIN) {

    adminInfo.textContent =
    "❌ Nieprawidłowy PIN.";

    adminInfo.style.color = "#ff5555";

    return;

  }


  const confirmStart = confirm(
    "Rozpocząć nową rundę na 5 minut?\n\nStare COMBO zostaną usunięte."
  );

  if (!confirmStart) return;


  try {

    newRoundBtn.disabled = true;

    await remove(combosRef);

    const now = Date.now();

    await set(roundRef, {
      id: String(now),
      status: "voting",
      startTime: now,
      endTime: now + ROUND_TIME,
      winner: null,
      discordSent: false
    });

    resetComboForm();

    adminPin.value = "";

    adminInfo.textContent =
    "🟢 Nowa runda rozpoczęta.";

    adminInfo.style.color = "#4ade80";

  }

  catch (error) {

    adminInfo.textContent =
    "❌ Błąd: " + error.message;

    adminInfo.style.color = "#ff5555";

  }

  newRoundBtn.disabled = false;

});


classButtons.forEach(button => {

  button.addEventListener("click", () => {

    if (!roundIsActive()) return;

    const className = button.dataset.class;

    if (selectedClasses.includes(className)) {

      selectedClasses =
      selectedClasses.filter(item => item !== className);

      button.classList.remove("selected");

    }

    else {

      selectedClasses.push(className);

      button.classList.add("selected");

    }

  });

});


raceTypeButtons.forEach(button => {

  button.addEventListener("click", () => {

    if (!roundIsActive()) return;

    raceType = button.dataset.raceType;

    raceTypeButtons.forEach(item => {

      item.classList.toggle(
        "selected",
        item.dataset.raceType === raceType
      );

    });


    if (raceType === "laps") {

      lapsBox.classList.remove("hidden");
      raceTimeBox.classList.add("hidden");

    }

    else {

      lapsBox.classList.add("hidden");
      raceTimeBox.classList.remove("hidden");

    }

  });

});


availableTireButtons.forEach(button => {

  button.addEventListener("click", () => {

    if (!roundIsActive()) return;

    const tire = button.dataset.tire;

    if (selectedAvailableTires.includes(tire)) {

      selectedAvailableTires =
      selectedAvailableTires.filter(item => item !== tire);

      button.classList.remove("selected");

    }

    else {

      selectedAvailableTires.push(tire);

      button.classList.add("selected");

    }

  });

});


noMandatoryBtn.addEventListener("click", () => {

  mandatoryMode = false;

  selectedMandatoryTires = [];

  noMandatoryBtn.classList.add("selected");

  mandatoryBtn.classList.remove("selected");

  mandatoryTiresBox.classList.add("hidden");

  mandatoryTireButtons.forEach(button => {
    button.classList.remove("selected");
  });

});


mandatoryBtn.addEventListener("click", () => {

  mandatoryMode = true;

  mandatoryBtn.classList.add("selected");

  noMandatoryBtn.classList.remove("selected");

  mandatoryTiresBox.classList.remove("hidden");

});


mandatoryTireButtons.forEach(button => {

  button.addEventListener("click", () => {

    if (!roundIsActive()) return;

    const tire = button.dataset.mandatoryTire;

    if (selectedMandatoryTires.includes(tire)) {

      selectedMandatoryTires =
      selectedMandatoryTires.filter(item => item !== tire);

      button.classList.remove("selected");

    }

    else {

      selectedMandatoryTires.push(tire);

      button.classList.add("selected");

    }

  });

});


saveComboBtn.addEventListener("click", async () => {

  if (!roundIsActive()) {

    showError("❌ Runda nie jest aktywna.");

    return;

  }


  const track = trackSelect.value;

  const weather = weatherSelect.value;
  const timeOfDay = timeOfDaySelect.value;

  const pit = pitSelect.value;
  const fuel = fuelSelect.value;
  const tireWear = tireWearSelect.value;
  const startType = startTypeSelect.value;
  const qualifying = qualifyingSelect.value;
  const bop = bopSelect.value;


  let raceLength = "";

  if (raceType === "laps") {

    const laps = Number(lapsInput.value);

    if (!laps || laps < 1) {

      showError("❌ Podaj liczbę okrążeń.");

      return;

    }

    raceLength = laps + " okrążeń";

  }

  else {

    if (!raceTimeSelect.value) {

      showError("❌ Wybierz czas trwania wyścigu.");

      return;

    }

    raceLength = raceTimeSelect.value;

  }


  if (!track) {

    showError("❌ Wybierz tor.");

    return;

  }


  if (selectedClasses.length === 0) {

    showError("❌ Wybierz klasę.");

    return;

  }


  if (selectedAvailableTires.length === 0) {

    showError("❌ Wybierz dostępne opony.");

    return;

  }


  if (
    mandatoryMode &&
    selectedMandatoryTires.length === 0
  ) {

    showError(
      "❌ Wybierz obowiązkowe opony."
    );

    return;

  }


  if (!weather) {

    showError("❌ Wybierz pogodę.");

    return;

  }

  if (!timeOfDay) {

    showError("❌ Wybierz porę dnia.");

    return;

  }

  if (!pit) {

    showError("❌ Wybierz PIT STOP.");

    return;

  }

  if (!fuel) {

    showError("❌ Wybierz zużycie paliwa.");

    return;

  }

  if (!tireWear) {

    showError("❌ Wybierz zużycie opon.");

    return;

  }

  if (!startType) {

    showError("❌ Wybierz typ startu.");

    return;

  }

  if (!qualifying) {

    showError("❌ Wybierz kwalifikacje.");

    return;

  }

  if (!bop) {

    showError("❌ Wybierz BOP.");

    return;

  }


  saveComboBtn.disabled = true;


  try {

    await set(
      ref(
        database,
        "srsLobbyCombos/" + playerId
      ),
      {
        playerId: playerId,
        roundId: currentRound.id,

        track: track,

        classes: selectedClasses,

        raceType: raceType,

        raceLength: raceLength,

        weather: weather,
        timeOfDay: timeOfDay,

        availableTires: selectedAvailableTires,

        mandatoryTires:
        mandatoryMode
          ? selectedMandatoryTires
          : [],

        mandatoryMode: mandatoryMode,

        pit: pit,
        fuel: fuel,
        tireWear: tireWear,
        startType: startType,
        qualifying: qualifying,
        bop: bop,

        time: Date.now()
      }
    );


    comboInfo.textContent =
    "✅ COMBO zapisane.";

    comboInfo.style.color = "#4ade80";

    saveComboBtn.textContent =
    "✏️ ZMIEŃ MOJE COMBO";

  }

  catch (error) {

    showError(
      "❌ Błąd: " + error.message
    );

  }


  saveComboBtn.disabled = false;

});


function randomItem(array) {

  return array[
    Math.floor(
      Math.random() * array.length
    )
  ];

}


async function sendWinnerToDiscord(winner) {

  const classes =
  Array.isArray(winner.classes)
    ? winner.classes.join(" + ")
    : winner.classes;


  const availableTires =
  Array.isArray(winner.availableTires)
    ? winner.availableTires.join(" + ")
    : winner.availableTires;


  const mandatoryTires =
  winner.mandatoryMode &&
  Array.isArray(winner.mandatoryTires) &&
  winner.mandatoryTires.length > 0
    ? winner.mandatoryTires.join(" + ")
    : "Brak obowiązkowych opon";


  const message = `
🏆 **SRS LOBBY COMBO – WYNIK LOSOWANIA** 🏆

━━━━━━━━━━━━━━━━━━

🏁 **TOR**
**${winner.track}**

🏎️ **KLASA AUT**
**${classes}**

⏱️ **DŁUGOŚĆ WYŚCIGU**
**${winner.raceLength}**

🌦️ **POGODA**
**${winner.weather}**

🌅 **PORA DNIA**
**${winner.timeOfDay}**

🛞 **DOSTĘPNE OPONY**
**${availableTires}**

⭐ **OBOWIĄZKOWE OPONY**
**${mandatoryTires}**

🔧 **PIT STOP**
**${winner.pit}**

⛽ **ZUŻYCIE PALIWA**
**${winner.fuel}**

🛞 **ZUŻYCIE OPON**
**${winner.tireWear}**

🚦 **TYP STARTU**
**${winner.startType}**

⏱️ **KWALIFIKACJE**
**${winner.qualifying}**

⚖️ **BOP**
**${winner.bop}**

━━━━━━━━━━━━━━━━━━

🎮 **SRS LOBBY COMBO**
🏁 Wynik został wylosowany automatycznie.
`;


  try {

    const response = await fetch(
      DISCORD_WEBHOOK,
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          username: "SRS LOBBY COMBO",
          content: message
        })
      }
    );

    return response.ok;

  }

  catch (error) {

    console.error(error);

    return false;

  }

}


async function finishRound() {

  if (
    finishingRound ||
    !currentRound
  ) {
    return;
  }

  finishingRound = true;


  try {

    const roundSnapshot =
    await get(roundRef);

    const latestRound =
    roundSnapshot.val();


    if (
      !latestRound ||
      latestRound.status !== "voting" ||
      Date.now() <
      Number(latestRound.endTime)
    ) {

      finishingRound = false;

      return;

    }


    const combosSnapshot =
    await get(combosRef);

    const allCombos =
    combosSnapshot.val() || {};


    const combos =
    Object.values(allCombos)
    .filter(
      combo =>
      combo.roundId === latestRound.id
    );


    if (combos.length === 0) {

      await set(
        roundRef,
        {
          ...latestRound,
          status: "finished",
          winner: null,
          finishedAt: Date.now(),
          discordSent: false
        }
      );

      finishingRound = false;

      return;

    }


    const winner =
    randomItem(combos);


    const result =
    await runTransaction(
      roundRef,
      current => {

        if (
          !current ||
          current.status !== "voting" ||
          Date.now() <
          Number(current.endTime)
        ) {
          return;
        }

        return {
          ...current,
          status: "finished",
          winner: winner,
          finishedAt: Date.now(),
          discordSent: false
        };

      }
    );


    if (!result.committed) {

      finishingRound = false;

      return;

    }


    const updatedRound =
    result.snapshot.val();


    if (
      updatedRound &&
      updatedRound.winner &&
      !updatedRound.discordSent
    ) {

      const sent =
      await sendWinnerToDiscord(
        updatedRound.winner
      );


      if (sent) {

        await runTransaction(
          roundRef,
          current => {

            if (
              !current ||
              current.id !== updatedRound.id ||
              current.discordSent
            ) {
              return;
            }

            return {
              ...current,
              discordSent: true,
              discordSentAt: Date.now()
            };

          }
        );

      }

    }

  }

  catch (error) {

    console.error(
      "Błąd losowania:",
      error
    );

  }


  finishingRound = false;

}


function updateCountdown() {

  if (
    !currentRound ||
    currentRound.status !== "voting"
  ) {
    return;
  }


  const left =
  Number(currentRound.endTime) -
  Date.now();


  if (left <= 0) {

    countdown.textContent = "00:00";

    finishRound();

    return;

  }


  const seconds =
  Math.floor(left / 1000);

  const minutes =
  Math.floor(seconds / 60);

  const remainingSeconds =
  seconds % 60;


  countdown.textContent =
  String(minutes).padStart(2, "0") +
  ":" +
  String(remainingSeconds).padStart(2, "0");

}


function renderRound() {

  if (!currentRound) {

    phaseStatus.textContent =
    "⏳ BRAK AKTYWNEJ RUNDY";

    phaseStatus.style.color = "#ddd";

    countdown.textContent = "00:00";

    phaseInfo.textContent =
    "Czekamy na rozpoczęcie nowej rundy.";

    comboSection.classList.add("hidden");

    officialResult.textContent =
    "Wynik pojawi się po zakończeniu czasu.";

    return;

  }


  if (currentRound.status === "voting") {

    if (roundIsActive()) {

      phaseStatus.textContent =
      "🟢 DODAWANIE COMBO TRWA";

      phaseStatus.style.color =
      "#4ade80";

      phaseInfo.textContent =
      "Dodaj swoje COMBO przed końcem czasu.";

      comboSection.classList.remove("hidden");

      officialResult.textContent =
      "🎰 Losowanie odbędzie się automatycznie po zakończeniu czasu.";

    }

    else {

      phaseStatus.textContent =
      "🎰 AUTOMATYCZNE LOSOWANIE...";

      phaseStatus.style.color =
      "#ffe000";

      comboSection.classList.add("hidden");

      finishRound();

    }

  }


  if (currentRound.status === "finished") {

    phaseStatus.textContent =
    "🏆 COMBO WYLOSOWANE";

    phaseStatus.style.color =
    "#ff6666";

    countdown.textContent = "00:00";

    phaseInfo.textContent =
    "Admin może rozpocząć nową rundę.";

    comboSection.classList.add("hidden");


    const winner =
    currentRound.winner;


    if (!winner) {

      officialResult.textContent =
      "❌ Nikt nie dodał COMBO.";

      return;

    }


    const classes =
    Array.isArray(winner.classes)
      ? winner.classes.join(" + ")
      : winner.classes;


    const availableTires =
    Array.isArray(winner.availableTires)
      ? winner.availableTires.join(" + ")
      : winner.availableTires;


    const mandatoryTires =
    winner.mandatoryMode &&
    Array.isArray(winner.mandatoryTires) &&
    winner.mandatoryTires.length > 0
      ? winner.mandatoryTires.join(" + ")
      : "Brak obowiązkowych opon";


    officialResult.innerHTML = `

      <div class="result-title">
        🏁 WYBRANY TOR
      </div>

      <div class="result-value">
        ${winner.track}
      </div>

      <div class="result-title">
        🏎️ KLASA AUT
      </div>

      <div class="result-value">
        ${classes}
      </div>

      <div class="result-title">
        ⏱️ DŁUGOŚĆ WYŚCIGU
      </div>

      <div class="result-value">
        ${winner.raceLength}
      </div>

      <div class="result-title">
        🌦️ POGODA
      </div>

      <div class="result-value">
        ${winner.weather}
      </div>

      <div class="result-title">
        🌅 PORA DNIA
      </div>

      <div class="result-value">
        ${winner.timeOfDay}
      </div>

      <div class="result-title">
        🛞 DOSTĘPNE OPONY
      </div>

      <div class="result-value">
        ${availableTires}
      </div>

      <div class="result-title">
        ⭐ OBOWIĄZKOWE OPONY
      </div>

      <div class="result-value">
        ${mandatoryTires}
      </div>

      <div class="result-title">
        🔧 PIT STOP
      </div>

      <div class="result-value">
        ${winner.pit}
      </div>

      <div class="result-title">
        ⛽ ZUŻYCIE PALIWA
      </div>

      <div class="result-value">
        ${winner.fuel}
      </div>

      <div class="result-title">
        🛞 ZUŻYCIE OPON
      </div>

      <div class="result-value">
        ${winner.tireWear}
      </div>

      <div class="result-title">
        🚦 TYP STARTU
      </div>

      <div class="result-value">
        ${winner.startType}
      </div>

      <div class="result-title">
        ⏱️ KWALIFIKACJE
      </div>

      <div class="result-value">
        ${winner.qualifying}
      </div>

      <div class="result-title">
        ⚖️ BOP
      </div>

      <div class="result-value">
        ${winner.bop}
      </div>

    `;

  }

}


onValue(
  roundRef,
  snapshot => {

    currentRound =
    snapshot.val();

    renderRound();

    updateCountdown();

  }
);


onValue(
  combosRef,
  snapshot => {

    currentCombos =
    snapshot.val() || {};


    if (!currentRound) {

      participantCount.textContent =
      "👥 0 osób dodało COMBO";

      return;

    }


    const combos =
    Object.values(currentCombos)
    .filter(
      combo =>
      combo.roundId === currentRound.id
    );


    participantCount.textContent =
    "👥 " +
    combos.length +
    " osób dodało COMBO";


    const mySavedCombo =
    currentCombos[playerId];


    if (
      mySavedCombo &&
      mySavedCombo.roundId ===
      currentRound.id
    ) {

      const myClasses =
      Array.isArray(mySavedCombo.classes)
        ? mySavedCombo.classes.join(" + ")
        : mySavedCombo.classes;


      const myAvailableTires =
      Array.isArray(
        mySavedCombo.availableTires
      )
        ? mySavedCombo.availableTires.join(" + ")
        : "";


      const myMandatoryTires =
      mySavedCombo.mandatoryMode &&
      Array.isArray(
        mySavedCombo.mandatoryTires
      ) &&
      mySavedCombo.mandatoryTires.length > 0
        ? mySavedCombo.mandatoryTires.join(" + ")
        : "Brak obowiązkowych opon";


      myCombo.innerHTML = `

        <strong>✅ TWOJE COMBO:</strong>

        <br><br>

        🏁 ${mySavedCombo.track}

        <br>

        🏎️ ${myClasses}

        <br>

        ⏱️ ${mySavedCombo.raceLength}

        <br>

        🌦️ ${mySavedCombo.weather}

        <br>

        🌅 ${mySavedCombo.timeOfDay}

        <br>

        🛞 Dostępne:
        ${myAvailableTires}

        <br>

        ⭐ Obowiązkowe:
        ${myMandatoryTires}

        <br>

        🔧 ${mySavedCombo.pit}

        <br>

        ⛽ Paliwo:
        ${mySavedCombo.fuel}

        <br>

        🛞 Zużycie opon:
        ${mySavedCombo.tireWear}

        <br>

        🚦 ${mySavedCombo.startType}

        <br>

        ⏱️ Kwalifikacje:
        ${mySavedCombo.qualifying}

        <br>

        ⚖️ ${mySavedCombo.bop}

      `;

    }

    else {

      myCombo.innerHTML = "";

    }

  }
);


setInterval(
  () => {

    updateCountdown();

    if (
      currentRound &&
      currentRound.status === "voting" &&
      !roundIsActive()
    ) {

      finishRound();

    }

  },
  1000
);

</script>
